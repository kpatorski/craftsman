<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>craftsman dashboard</title>
<style>
  /*THEME_CSS*/
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--blue); text-decoration: none; cursor: pointer; }
  code { font-family: var(--mono); font-size: 12.5px; color: var(--blue); }
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr) 360px; height: 100vh; }
  .app > * { overflow-y: auto; min-height: 0; }

  /* ---- menu ---- */
  .menu { background: var(--panel); border-right: 1px solid var(--border); padding: 14px 0; }
  .brand { padding: 0 16px 4px; font-weight: 600; color: var(--green); letter-spacing: .5px; }
  .project { padding: 0 16px 14px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
  .menu-group { padding: 10px 0 2px; }
  .menu-title { padding: 2px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .menu-item { display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 22px; cursor: pointer;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item:hover { background: var(--panel2); }
  .menu-item.current { background: var(--blue-bg); color: var(--heading); }
  .menu-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .menu-item.top { padding-left: 16px; font-weight: 500; }
  .project { display: flex; align-items: center; gap: 6px; }
  .project-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rm-project { flex: none; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 15px;
    line-height: 1; padding: 0; border-radius: 4px; }
  .rm-project:hover { color: var(--red); border-color: var(--red-dim); }
  .changed-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .count { color: var(--muted); font-size: 12px; }

  /* ---- centre ---- */
  .centre { padding: 0; }
  .topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 10px 24px;
    background: var(--bg); border-bottom: 1px solid var(--border); }
  .topbar .crumb { flex: 1; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .topbar .crumb b { color: var(--heading); font-weight: 500; }
  .live { font-size: 12px; color: var(--muted); }
  .live::before { content: "●"; color: var(--green); margin-right: 5px; }
  .live.off::before { color: var(--red); }
  .projects { flex: 1; min-width: 0; margin: 0; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; padding: 3px; font-size: 12px; }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 4px;
    padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--blue); }
  .btn.demo { border-color: var(--amber-dim); color: var(--amber); }
  .view { padding: 18px 24px 60px; max-width: 980px; }
  h1 { font-size: 20px; color: var(--heading); margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 26px 0 8px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

  details.block { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; }
  details.block > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
  details.block > summary::-webkit-details-marker { display: none; }
  details.block > summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
  details.block[open] > summary::before { content: "▾"; }
  details.block > summary .t { color: var(--heading); font-weight: 500; }
  details.block > .inner { padding: 4px 16px 12px 32px; border-top: 1px solid var(--border); }
  details.row { border-bottom: 1px solid var(--border); }
  details.row > summary { list-style: none; cursor: pointer; padding: 6px 4px; display: flex; gap: 10px; align-items: baseline; }
  details.row > summary::-webkit-details-marker { display: none; }
  details.row > summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
  details.row[open] > summary::before { content: "▾"; }
  details.row > .inner { padding: 0 8px 10px 24px; }
  .muted { color: var(--muted); }
  .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .arrow { color: var(--green); margin: 0 6px; }
  .kv { display: grid; grid-template-columns: 80px 1fr; gap: 3px 12px; font-size: 13.5px; }
  .kv > :nth-child(odd) { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: .5px; padding-top: 3px; }

  .badge { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--border);
    font-family: var(--mono); white-space: nowrap; }
  .badge.active, .badge.domain { color: var(--green); border-color: var(--green-dim); background: var(--green-bg); }
  .badge.blocked { color: var(--red); border-color: var(--red-dim); background: var(--red-bg); }
  .badge.done, .badge.crud { color: var(--muted); }
  .badge.pending { color: var(--blue); border-color: var(--blue-dim); background: var(--blue-bg); }
  .badge.on { color: var(--green); border-color: var(--green-dim); background: var(--green-bg); }
  .badge.off { color: var(--muted); }

  .bar { display: flex; gap: 3px; margin: 6px 0 12px; }
  .bar span { flex: 1; height: 6px; border-radius: 3px; background: var(--panel2); }
  .bar span.done { background: var(--green); }
  .bar span.active { background: repeating-linear-gradient(45deg, var(--green), var(--green) 4px, var(--green-dim) 4px, var(--green-dim) 8px); }
  .list-row { display: flex; gap: 10px; align-items: baseline; padding: 5px 4px; border-bottom: 1px solid var(--border); }
  .list-row .grow { flex: 1; }
  .ico { width: 14px; text-align: center; flex: none; }
  .ico.done { color: var(--muted); } .ico.active { color: var(--green); } .ico.pending { color: var(--blue); }
  .ico.blocked { color: var(--red); }

  .criteria { list-style: none; padding: 0; margin: 0; }
  .criteria li { display: flex; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  .criteria li.done { color: var(--muted); }
  .check { flex: none; width: 16px; height: 16px; border: 1px solid var(--muted); border-radius: 3px; margin-top: 3px;
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--green); }

  .now-card { background: var(--panel); border: 1px solid var(--green-dim); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .now-step { font-family: var(--mono); font-size: 18px; color: var(--green); }
  .now-note { font-size: 15px; color: var(--heading); margin: 2px 0 8px; }
  .crumbs { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .crumbs a { color: var(--muted); } .crumbs a:hover { color: var(--blue); }
  .quote { border-left: 3px solid var(--border); padding: 4px 12px; margin: 8px 0; color: var(--text); }
  .next { border-left: 3px solid var(--green); padding: 4px 12px; margin: 10px 0 0; }

  /* library */
  .search { width: 100%; padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-size: 14px; outline: none; margin: 4px 0 8px; }
  .search:focus { border-color: var(--blue); }
  .entry { display: flex; gap: 10px; align-items: center; padding: 5px 4px; border-bottom: 1px solid var(--border); }
  .entry .kind { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 64px; flex: none; }
  .entry .eid { font-family: var(--mono); font-size: 13px; color: var(--blue); width: 230px; flex: none;
    overflow: hidden; text-overflow: ellipsis; }
  .entry .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry.off .eid, .entry.off .title { opacity: .5; }
  .switch { width: 30px; height: 16px; border-radius: var(--pill); background: var(--switch-off); position: relative; cursor: pointer; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--knob); transition: left .15s; }
  .switch.on { background: var(--green-dim); } .switch.on::after { left: 16px; background: var(--green); }
  .members { padding-left: 24px; }
  pre.help { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    font-family: var(--mono); font-size: 12.5px; overflow-x: auto; }

  /* ---- sessions (right) ---- */
  .side { background: var(--panel); border-left: 1px solid var(--border); padding: 12px 12px 40px; }
  .side-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 2px 4px 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; }
  .card.active { border-color: var(--green-dim); } .card.blocked { border-color: var(--red-dim); }
  .card-head { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px 2px; cursor: pointer; }
  .card-head .entryp { font-family: var(--mono); font-size: 12px; color: var(--heading); }
  .card-head .slug { flex: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-leaf { padding: 0 10px 8px 26px; cursor: pointer; }
  .card-leaf .step { font-family: var(--mono); color: var(--green); font-size: 13px; }
  .card.blocked .card-leaf .step { color: var(--red); }
  .card-leaf .note { font-size: 12.5px; }
  .card.done .card-leaf { display: none; }
  .card-body { border-top: 1px solid var(--border); padding: 6px 6px 8px; }
  .node { display: flex; align-items: baseline; gap: 6px; padding: 1px 4px; border-radius: 3px; font-family: var(--mono);
    font-size: 12px; }
  .node:hover { background: var(--panel2); }
  .node .nid { cursor: pointer; white-space: nowrap; }
  .node.done .nid { color: var(--muted); }
  .node.pending .nid { color: var(--text); opacity: .75; }
  .node.active .nid { color: var(--green); }
  .node.blocked .nid { color: var(--red); }
  .node.leaf { background: var(--green-bg); }
  .node .tw { width: 12px; color: var(--muted); cursor: pointer; flex: none; text-align: center; }
  .node .chip { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .node .nnote { color: var(--muted); font-family: -apple-system, sans-serif; font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .parked { margin-top: 6px; border-top: 1px dashed var(--border); padding: 6px 4px 0; }
  .parked-head { cursor: pointer; font-size: 12px; color: var(--amber); }
  .parked-item { font-size: 12px; padding: 3px 0 3px 14px; }
  .cmd { display: flex; gap: 6px; align-items: center; margin: 4px 0 0; }
  .cmd code { background: var(--panel2); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  .copy { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px; flex: none;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; color: var(--muted); cursor: pointer; padding: 0; }
  .copy:hover { color: var(--green); border-color: var(--green); }
  .copy.done { color: var(--green); border-color: var(--green); }
  .card-actions { display: flex; gap: 8px; padding: 0 10px 8px 26px; }
  @keyframes flash { 0% { box-shadow: 0 0 0 2px var(--green); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .flash { animation: flash 1.6s ease-out; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--green); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 640px; }
  .toast.show { opacity: 1; }

  /* ---- reviews ---- */
  .rv-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .btn.primary { border-color: var(--green-dim); color: var(--green); }
  .btn.danger { border-color: var(--red-dim); color: var(--red); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .checkpoint { background: var(--amber-bg); border: 1px solid var(--amber-dim); border-radius: var(--radius); padding: 12px 14px;
    margin: 0 0 16px; }
  .checkpoint .q { color: var(--heading); margin-bottom: 8px; white-space: pre-wrap; }
  .field { width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 6px 8px; font: inherit; }
  textarea.field { min-height: 120px; font-family: var(--mono); font-size: 12.5px; }
  .filterbar { display: flex; gap: 8px; align-items: center; background: var(--blue-bg); border: 1px solid var(--blue-dim);
    border-radius: var(--radius-sm); padding: 5px 10px; margin: 0 0 12px; font-size: 13px; }
  .graph { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
  .graph svg { display: block; width: 100%; height: auto; }
  .graph .gnode rect { fill: var(--panel2); stroke: var(--border); rx: 8; }
  .graph .gnode.uc rect { stroke: var(--blue-dim); } .graph .gnode.ctx rect { stroke: var(--violet); }
  .graph .gnode text { fill: var(--text); font-size: 12px; pointer-events: none; }
  .graph .gnode { cursor: pointer; }
  .graph .gedge { stroke: var(--border); stroke-width: 1.5; fill: none; }
  .graph .glink { stroke: var(--green); stroke-width: 1.8; fill: none; cursor: pointer; }
  .graph .glink.doubt { stroke: var(--red); stroke-dasharray: 5 4; }
  .graph .glabel { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  .graph.hovering .gnode, .graph.hovering .gedge, .graph.hovering .glink, .graph.hovering .glabel { opacity: .25; }
  .graph.hovering .hl { opacity: 1 !important; }
  .graph .gnode.picked rect { fill: var(--blue-bg); stroke: var(--blue); }
  .graph-info { margin-top: 6px; font-size: 13px; }
  .finding { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; padding: 10px 14px; }
  .finding.to-send { border-color: var(--green-dim); }
  .finding.deleted { opacity: .5; } .finding.sent { border-color: var(--blue-dim); }
  .finding.maybe-resolved { border-style: dashed; }
  .finding .fhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .finding .ftitle { color: var(--heading); font-weight: 500; flex: 1; }
  .finding .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-top: 8px; }
  .finding .comment { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px 12px; }
  .badge.violation { color: var(--red); border-color: var(--red-dim); }
  .badge.new-convention { color: var(--violet); border-color: var(--violet-dim); }
  .badge.scout { color: var(--green); border-color: var(--green-dim); }
  .badge.out-of-scope { color: var(--amber); border-color: var(--amber-dim); }
  .badge.to-send { color: var(--green); border-color: var(--green-dim); background: var(--green-bg); }
  .badge.sent { color: var(--blue); border-color: var(--blue-dim); background: var(--blue-bg); }
  .badge.deleted, .badge.merged { color: var(--muted); }
  .badge.maybe-resolved { color: var(--amber); border-color: var(--amber-dim); }
  .loc { font-family: var(--mono); font-size: 12px; }
  .hunk { font-family: var(--mono); font-size: 12px; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); margin: 4px 0 8px; overflow-x: auto; }
  .hunk div { white-space: pre; padding: 0 8px; }
  .hunk .add { background: var(--green-bg); } .hunk .del { background: var(--red-bg); }
  .hunk .at { color: var(--muted); } .hunk .here { outline: 1px solid var(--amber); }
  .reply { border-left: 3px solid var(--blue-dim); padding: 2px 10px; margin: 4px 0; font-size: 13px; }
  .console { display: flex; flex-direction: column; height: 100%; }
  .console .lines { flex: 1; overflow-y: auto; font-size: 12.5px; padding: 0 2px; }
  .console .ln { padding: 3px 4px; white-space: pre-wrap; word-break: break-word; }
  .console .ln.you { color: var(--heading); border-left: 2px solid var(--blue); background: var(--blue-bg); margin-top: 8px; }
  .console .ln.tool { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .console .ln.denied { color: var(--red); font-family: var(--mono); font-size: 11.5px; }
  .console .ln.turn { color: var(--muted); font-size: 11px; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
  .console .say { display: flex; gap: 6px; padding-top: 8px; }
  .console .say textarea { flex: 1; min-height: 54px; font-size: 13px; font-family: inherit; }
  .side.console-side { display: flex; flex-direction: column; overflow: hidden; }
  /*MD_CSS*/
</style>
</head>
<body>
<div class="app">
  <nav class="menu" id="menu"></nav>
  <main class="centre" id="centre"></main>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
// ---------------------------------------------------------------- state
const openKeys = new Set();        // every expanded <details> / tree node / card, kept across re-renders
const seen = {};                   // file id -> mtime last looked at; a newer mtime shows a dot in the menu
const flashKeys = new Set();
const params = new URLSearchParams(location.search);
let current = params.get("review") ? { type: "review", project: params.get("project"), id: params.get("review") } : { type: "now" };
let libQuery = "";
let project = new URLSearchParams(location.search).get("project") || "";
let D, files, fileById, libById, sessions, loaded = false;

function ingest(data) {
  const before = loaded ? Object.fromEntries(sessions.map(s => [s.file.id, (leafOf(s) || {}).id + "|" + s.state])) : {};
  D = data; files = D.files; project = D.project ? D.project.path : "";
  fileById = Object.fromEntries(files.map(f => [f.id, f]));
  libById = Object.fromEntries(D.library.map(e => [e.id, e]));
  sessions = files.filter(f => f.kind === "session").map(parseSession);
  files.forEach(f => { if (!loaded) seen[f.id] = f.mtime; else if (!(f.id in seen)) seen[f.id] = 0; });
  if (!loaded) {
    const active = sessions.find(s => s.state === "active");
    if (active) openKeys.add("card:" + active.file.id);
  } else {
    sessions.forEach(s => { const now = (leafOf(s) || {}).id + "|" + s.state;
      if (before[s.file.id] !== undefined && before[s.file.id] !== now) flashKeys.add("card:" + s.file.id); });
  }
  if (current.type === "file" && !fileById[current.id]) current = { type: "now" };
  if (!D.project && current.type === "specs") current = { type: "now" };
  if (current.type === "lib" && !libById[current.id]) current = { type: "library" };
  loaded = true;
}
async function reload() {
  const r = await fetch("/api/data" + (project ? "?project=" + encodeURIComponent(project) : ""));
  if (!r.ok) { document.getElementById("centre").innerHTML = `<div class="view"><h1>No project</h1><div class="muted">Start the dashboard from a project: /craftsman:dashboard</div></div>`; return; }
  ingest(await r.json());
  const rl = await fetch("/api/reviews"); reviewsList = rl.ok ? (await rl.json()).reviews : [];
  await loadReview();
  if (!editing) render(); else { renderMenu(); renderSide(); }
  flashKeys.clear();
}

// ---------------------------------------------------------------- helpers
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const squash = s => String(s ?? "").replace(/\s+/g, " ").trim();
const ICON = { done: "✓", active: "●", pending: "○", blocked: "■" };
const COPY_SVG = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
const copyCmd = c => `<span class="cmd"><button class="copy" data-copy="${esc(c)}" title="copy">${COPY_SVG}</button><code>${esc(c)}</code></span>`;
// Shortest trailing part of each project path that tells the projects apart: gym/workspace vs Projects/workspace.
function projectLabel(path) {
  const all = (D.projects.length ? D.projects : [path]).map(p => p.split("/").filter(Boolean));
  const mine = path.split("/").filter(Boolean);
  for (let n = 1; n <= mine.length; n++) {
    const tail = mine.slice(-n).join("/");
    if (all.filter(parts => parts.slice(-n).join("/") === tail).length <= 1) return tail;
  }
  return path;
}
const ico = st => `<span class="ico ${st}">${ICON[st] || "·"}</span>`;
function det(key, cls, summary, inner) {
  return `<details class="${cls}" data-key="${esc(key)}"${openKeys.has(key) ? " open" : ""}>` +
         `<summary>${summary}</summary><div class="inner">${inner}</div></details>`;
}
function ago(t) {
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return Math.floor(s / 86400) + " d ago";
}
function sectionsOf(raw) {
  const out = {}; const parts = raw.split(/^## (.+)$/m);

// ---------------------------------------------------------------- session parsing
function parseSession(f) {

    entryPoint: label(s["Task"] || "", "Entry point"), related: label(s["Task"] || "", "Related sessions"),

  };

  const base = Math.min(...lines.map(l => l.match(/^\s*/)[0].length));

    if (!m) continue;

    if (!h) continue;

}

    `${tw}${ico(node.status)}<span class="nid"${doc}>${node.handoff ? "→ " : ""}${esc(node.id)}</span>${chip}` +
    `${node.note ? `<span class="nnote" title="${esc(node.note)}">${esc(node.note)}</span>` : ""}</div>`;

  });

      `<text class="glabel" data-a="ctx:${esc(l.from)}" data-b="ctx:${esc(l.to)}" x="${bend - 8}" y="${(y1 + y2) / 2 + 4}">${esc(l.how)}</text>`;
  });

function hunkFor(path, line) {
  if (!diffText) return `<div class="muted">no diff loaded</div>`;
  const files_ = diffText.split(/^diff --git /m).slice(1);
  const file = files_.find(f => f.split("\n")[0].endsWith(" b/" + path));
  if (!file) return `<div class="muted">${esc(path)} is not in the diff — outside the change</div>`;
  const hunks = file.split(/^(?=@@ )/m).slice(1);
  for (const h of hunks) {
    const m = h.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/);
    if (!m) continue;
    const start = +m[1], len = m[2] === undefined ? 1 : +m[2];
    if (line < start || line >= start + len) continue;
    let n = start - 1;
    const raw = h.replace(/\n$/, "").split("\n").filter(l => !l.startsWith("\\"));
    const rows = raw.map((l, i) => {
      if (i === 0) return `<div class="at">${esc(l)}</div>`;
      const cls = l[0] === "+" ? "add" : l[0] === "-" ? "del" : "";
      if (l[0] !== "-") n++;
      return `<div class="${cls}${l[0] !== "-" && n === line ? " here" : ""}">${esc(l)}</div>`;
    });
    return `<div class="hunk">${rows.join("")}</div>`;
  }
  return `<div class="muted">line ${line} of ${esc(path)} is not in a changed hunk</div>`;
}

  const visible = S.findings.filter(f => f.status !== "merged" && f.locations.some(l => inFilter(l.path)));
  const counts = {}; S.findings.forEach(f => counts[f.status] = (counts[f.status] || 0) + 1);
  html += `<h2>Findings · ${visible.length}</h2><div class="sub">${Object.entries(counts).map(([k, n]) => `<span class="badge ${k}">${k} ${n}</span>`).join(" ")}</div>`;
  const cats = {}; visible.forEach(f => (cats[f.category] ||= []).push(f));
  Object.entries(cats).forEach(([cat, list]) => {
    const key = "rv#cat:" + cat; if (!loadedCats.has(key)) { openKeys.add(key); loadedCats.add(key); }
    html += det(key, "block", `<span class="t">${esc(cat)}</span><span class="count">${list.length}</span>`,
      list.map(f => findingCard(f, S.findings.filter(m => m.status === "merged" && m["merged-into"] === f.id))).join(""));
  });
  return html;
}
const loadedCats = new Set();

function viewNewReview() {
  const projects = D.projects.length ? D.projects : [];
  return `<h1>New review</h1><div class="sub">A pull request URL, or two branches of the repository as <code>target:source</code>.` +
    ` The review runs in its own worktree; your checkout is not touched.</div>` +
    `<div class="label muted" style="font-size:11px">REPOSITORY</div><select class="field" id="nr-project">${projects.map(p =>
      `<option value="${esc(p)}"${p === project ? " selected" : ""}>${esc(p)}</option>`).join("")}</select>` +
    `<div class="label muted" style="font-size:11px;margin-top:8px">PULL REQUEST OR BRANCHES</div>` +
    `<input class="field" id="nr-source" placeholder="https://github.com/org/repo/pull/123  or  main:feature/x">` +
    `<div class="rv-actions" style="margin-top:10px"><button class="btn primary" data-rv="start">Start review</button></div>` +
    `<p class="muted" style="font-size:12.5px">The same from Claude CLI: ${copyCmd("/craftsman:pr-review <url | target:source>")}</p>`;
}

function renderConsole() {
  const side = document.getElementById("side");
  side.classList.add("console-side");
  const lines = R ? R.console : [];
  const box = document.getElementById("console-lines");
  const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const draft = (document.getElementById("say") || {}).value || "";
  side.innerHTML = `<div class="side-title">Console · ${esc(current.id)}</div><div class="console">` +
    `<div class="lines" id="console-lines">${lines.map(l => `<div class="ln ${l.kind}">${l.kind === "text" || l.kind === "you" ? inline(l.text) : (l.kind === "denied" ? "refused · " : "") + esc(l.text)}</div>`).join("") ||
      '<div class="muted">Nothing yet.</div>'}</div>` +
    `<div class="say"><textarea class="field" id="say" placeholder="Write to the review's session…">${esc(draft)}</textarea>` +
    `<button class="btn primary" data-rv="say">Send</button></div></div>`;
  const nb = document.getElementById("console-lines");
  if (atBottom) nb.scrollTop = nb.scrollHeight;
}

async function reviewAction(what) {
  const k = reviewKey();
  if (what === "start") {
    const body = { project: document.getElementById("nr-project").value, source: document.getElementById("nr-source").value.trim() };
    const out = await api("/api/review/start", body);
    if (out) { project = body.project; go({ type: "review", project: body.project, id: out.id }); }
    return;
  }
  if (what === "resume" || what === "stop") { if (await api("/api/review/" + what, k)) toast(what === "stop" ? "session stopped" : "session started"); return reload(); }
  if (what === "cli") {
    if (!(await api("/api/review/stop", k))) return;
    toast("session stopped — run the command shown in the console panel");
    await reload();
    const cmd = `cd ${current.project} && claude --resume ${R.state.session}`;
    document.getElementById("console-lines").insertAdjacentHTML("beforeend", `<div class="ln you">Continue in the CLI:${copyCmd(cmd)}</div>`);
    return;
  }
  if (what === "refresh" || what === "close") {
    if (what === "close" && !confirm("Close this review? The session ends; the review and its findings stay.")) return;
    if (await api("/api/review/message", { ...k, type: what })) toast(what === "refresh" ? "asked the session to refresh" : "closing");
    return;
  }
  if (what === "say") {
    const text = document.getElementById("say").value.trim(); if (!text) return;
    if (await api("/api/review/message", { ...k, type: "message", text })) { document.getElementById("say").value = ""; reload(); }
    return;
  }
  if (what === "send") {
    const marked = R.state.findings.filter(f => f.status === "to-send");
    if (!confirm(`Send ${marked.length} finding(s) to ${sourceLabel(R.state.source)} as comments?\n\n` +
      marked.map(f => `${f.id} ${f.title}`).join("\n") + `\n\nComments on GitHub cannot be taken back from here.`)) return;
    toast("sending…");
    const out = await api("/api/review/send", k);
    if (out) toast(`sent ${out.sent.length}` + (out.errors.length ? ` · problems: ${out.errors.join("; ")}` : ""));
    return reload();
  }
}

// ---------------------------------------------------------------- writes and live updates
async function toggle(id, action, yes) {
  const r = await fetch("/api/toggle", { method: "POST", headers: { "Content-Type": "application/json", "X-Craftsman": "1" },
    body: JSON.stringify({ id, action, yes }) });
  const out = await r.json().catch(() => ({ ok: false, error: "no answer from the server" }));
  if (r.status === 409 && out.confirm) {
    if (confirm(out.confirm.message)) return toggle(id, action, true);
    return toast("nothing changed");
  }
  if (!out.ok) return toast(out.error || "failed");
  toast(out.changed.length ? `${action}d ${out.changed.length > 1 ? out.changed.length + " entries: " : ""}${out.changed.slice(0, 4).join(", ")}${out.changed.length > 4 ? "…" : ""}` +
    (out.commit ? ` · commit ${out.commit}` : "") + (out.cascade ? " · every member of the bundle follows it" : "") : `${id} is already ${action}d`);
  reload();
}
async function removeProject(path) {
  const r = await fetch("/api/projects/remove", { method: "POST", headers: { "Content-Type": "application/json", "X-Craftsman": "1" },
    body: JSON.stringify({ path }) });
  const out = await r.json().catch(() => ({ ok: false, error: "no answer from the server" }));
  if (!out.ok) return toast(out.error || "failed");
  toast(`removed ${projectLabel(path)} from the dashboard`);
  project = out.projects[out.projects.length - 1] || "";
  history.replaceState(null, "", project ? "?project=" + encodeURIComponent(project) : location.pathname);
  current = { type: "now" }; await reload();
}
let live = false;
function connect() {
  const es = new EventSource("/api/events");
  es.addEventListener("hello", () => { live = true; reload(); });
  es.addEventListener("change", () => reload());
  es.onerror = () => { live = false; if (loaded) render(); };
}

// ---------------------------------------------------------------- events
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
document.addEventListener("toggle", e => {
  const k = e.target.dataset && e.target.dataset.key; if (!k) return;
  e.target.open ? openKeys.add(k) : openKeys.delete(k);
}, true);
document.addEventListener("click", e => {
  const g = e.target.closest("[data-gnode],[data-link]");
  if (g) {
    if (g.dataset.link !== undefined) { graphInfo = graphInfo === +g.dataset.link ? null : +g.dataset.link; return render(); }
    const [kind, id] = g.dataset.gnode.split(/:(.*)/s);
    const st = R.state.structure;
    const name = ((kind === "uc" ? st["use-cases"] : st.contexts).find(x => x.id === id) || {}).name || id;
    if (kind === "ctx" && (st["use-cases"] || []).length + (st.contexts || []).length > 12) openContext = openContext === id ? null : id;
    rFilter = rFilter && rFilter.key === g.dataset.gnode ? null : { key: g.dataset.gnode, name, files: filesOf(kind, id) };
    return render();
  }
  const r = e.target.closest("[data-review],[data-rv],[data-answer],[data-fstatus],[data-fedit],[data-fsave],[data-explain],[data-hunk],[data-clear-filter]");
  if (r) {
    e.preventDefault();
    const k = reviewKey(), d = r.dataset;
    if (d.review) return go({ type: "review", project: d.rproject, id: d.review });
    if (d.rv) return reviewAction(d.rv);
    if (d.clearFilter) { rFilter = null; return render(); }
    if (d.hunk) { shownHunks.has(d.hunk) ? shownHunks.delete(d.hunk) : shownHunks.add(d.hunk); return render(); }
    if (d.answer !== undefined) return api("/api/review/change", { ...k, action: "answer", option: d.answer,
      note: document.getElementById("cp-note").value || null }).then(o => o && reload());
    if (d.fstatus) return api("/api/review/change", { ...k, action: "status", finding: d.fid, status: d.fstatus }).then(o => o && reload());
    if (d.fedit !== undefined) { editing = d.fedit || null; return render(); }
    if (d.fsave) {
      const f = R.state.findings.find(x => x.id === d.fsave), fields = {};
      for (const name of ["title", "description", "comment"]) {
        const v = document.getElementById("edit-" + name).value; if (v !== f[name]) fields[name] = v;
      }
      if (!Object.keys(fields).length) { editing = null; return render(); }
      return api("/api/review/change", { ...k, action: "edit", finding: d.fsave, fields }).then(o => { if (o) { editing = null; reload(); } });
    }
    if (d.explain) return api("/api/review/message", { ...k, type: "explain", about: { kind: d.explain, id: d.eid } })
      .then(o => o && toast("asked the session to explain " + d.eid));
  }
  const t = e.target.closest("[data-remove-project],[data-switch],[data-copy],[data-toggle],[data-file],[data-lib],[data-nav],[data-goto]");
  if (!t) return;
  if (t.dataset.removeProject) {
    const path = t.dataset.removeProject;
    if (!confirm(`Remove ${projectLabel(path)} from the dashboard?\n\n${path}\n\nOnly the dashboard forgets it — the project's files stay as they are.`)) return;
    return removeProject(path);
  }
  if (t.dataset.switch) {
    e.preventDefault(); e.stopPropagation();
    const x = libById[t.dataset.switch];
    return toggle(x.id, x.enabled ? "disable" : "enable", false);
  }
  if (t.dataset.copy) {
    navigator.clipboard?.writeText(t.dataset.copy); t.classList.add("done"); setTimeout(() => t.classList.remove("done"), 1200);
    return toast("copied: " + t.dataset.copy);
  }
  if (t.dataset.toggle) { const k = t.dataset.toggle; openKeys.has(k) ? openKeys.delete(k) : openKeys.add(k); return render(); }
  e.preventDefault();
  if (t.dataset.file) return go({ type: "file", id: t.dataset.file });
  if (t.dataset.lib) return libById[t.dataset.lib] ? go({ type: "lib", id: t.dataset.lib }) : toast(t.dataset.lib + " is not installed");
  if (t.dataset.goto) return go({ type: "lib", id: t.dataset.goto.replace(/^lib:/, "") });
  if (t.dataset.nav) return go(t.dataset.id ? { type: t.dataset.nav, id: t.dataset.id } : { type: t.dataset.nav });
});
document.addEventListener("mouseover", e => {
  const graph = document.getElementById("graph"); if (!graph) return;
  const n = e.target.closest("[data-gnode]");
  graph.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
  if (!n) return graph.classList.remove("hovering");
  const id = n.dataset.gnode; graph.classList.add("hovering"); n.classList.add("hl");
  graph.querySelectorAll("[data-a],[data-b]").forEach(x => {
    if (x.dataset.a === id || x.dataset.b === id) {
      x.classList.add("hl");
      const other = x.dataset.a === id ? x.dataset.b : x.dataset.a;
      graph.querySelectorAll(`[data-gnode="${CSS.escape(other)}"]`).forEach(o => o.classList.add("hl"));
    }
  });
});
document.addEventListener("keydown", e => {
  if (e.target.id === "say" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); reviewAction("say"); }
});
document.addEventListener("change", e => {
  if (e.target.id !== "projects") return;
  project = e.target.value; history.replaceState(null, "", "?project=" + encodeURIComponent(project));
  current = { type: "now" }; reload();
});
document.addEventListener("input", e => {
  if (e.target.id !== "libsearch") return;
  libQuery = e.target.value; const pos = e.target.selectionStart; render();
  const s = document.getElementById("libsearch"); s.focus(); s.setSelectionRange(pos, pos);
});
setInterval(() => { if (loaded && current.type === "now") render(); }, 30000);
connect();
</script>
