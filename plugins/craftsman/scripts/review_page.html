<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>craftsman review</title>
<style>
  /*THEME_CSS*/
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 300 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; font-weight: 400; }
  code.inl-c { color: var(--neon); }
  b, strong { font-weight: 500; color: var(--heading); }
  button { font: inherit; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  ::-webkit-scrollbar-corner { background: transparent; }

  .app { display: grid; grid-template-columns: 64px minmax(0, 1fr); height: 100vh; }
  /* the side panel grows with the screen and can be dragged wider or narrower; the width is remembered */
  /* with the side panel open, the content under the tabs makes room for it; the header and the tabs keep the width */
  .app.with-panel .view { margin-right: calc(var(--panel-w, clamp(560px, 42vw, 980px)) - 12px); }
  main { overflow-y: auto; padding: 24px 32px 48px; min-width: 0; }

  /* ---- rail: one tile per review ---- */
  .rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0; border-right: 1px solid var(--line); }
  .rtile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--card);
    border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; position: relative; cursor: pointer; }
  .rtile:hover { border-color: var(--line2); color: var(--heading); }
  .rtile.on { background: var(--neon-bg); color: var(--neon); border-color: var(--neon-dim); }
  .rtile .badge { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--should);
    border: 2px solid var(--bg); }
  .rtile.end { margin-top: auto; }
  .rsep { width: 28px; height: 1px; background: var(--line); margin: 4px 0; }
  .hover { position: fixed; left: 72px; width: 300px; background: var(--float); border: 1px solid var(--line2); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 16px 40px var(--shadow); z-index: 20; font-size: 13px; display: none; }
  .hover .t { color: var(--heading); font-size: 14.5px; margin: 2px 0; }

  /* ---- header ---- */
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px; }
  .head > div:first-child { min-width: 0; flex: 1 1 420px; }
  .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  h1 { margin: 0; font-size: 28px; font-weight: 300; color: var(--heading); letter-spacing: -.2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; margin: 18px 0 20px; border-bottom: 1px solid var(--line); }
  .tab { padding: 9px 14px; color: var(--muted); font-size: 13.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--heading); border-color: var(--neon); }
  .tab .qdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--should); margin-right: 7px; vertical-align: middle; }
  .asks { display: flex; align-items: center; gap: 10px; margin: -6px 0 18px; padding: 10px 14px; border-radius: 12px; background: var(--should-bg);
    border: 1px solid var(--should-bg); color: var(--should); font-size: 13.5px; }
  .asks .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .asks b { color: var(--should); }
  .tab .n { color: var(--dim); margin-left: 5px; } .tab.on .n { color: var(--neon); }

  .tag { font-size: 12px; padding: 2px 9px; border-radius: 7px; font-weight: 400; white-space: nowrap; background: var(--nit-bg); color: var(--nit); }
  .tag.green { background: var(--neon-bg); color: var(--neon); } .tag.red { background: var(--must-bg); color: var(--must); }
  .tag.amber { background: var(--should-bg); color: var(--should); } .tag.blue { background: var(--change-bg); color: var(--change); }
  .live { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; font-size: 13px;
    background: var(--neon-bg); color: var(--neon); cursor: pointer; border: 0; }
  .live.wait { background: var(--should-bg); color: var(--should); } .live.off { background: var(--nit-bg); color: var(--nit); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .live:not(.off) .pulse { animation: p 1.6s infinite; }
  @keyframes p { 50% { opacity: .3; } }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 400;
    background: var(--card2); border: 1px solid var(--line); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--line2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.go { background: var(--neon-strong); border-color: var(--neon-strong); color: var(--heading); }
  .btn.ghost { background: none; } .btn.sm { padding: 5px 10px; font-size: 12.5px; }
  .btn.danger { color: var(--must); background: none; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .field { width: 100%; background: var(--card2); border: 1px solid var(--line2); border-radius: 10px; color: var(--text);
    padding: 8px 10px; font: inherit; font-weight: 300; }
  textarea.field { min-height: 90px; resize: vertical; }

  /* ---- cards and grid ---- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
  .s4 { grid-column: span 4; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
  @media (max-width: 1200px) { .s4, .s8 { grid-column: span 12; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
  .card h3 { margin: 0 0 14px; font-size: 12.5px; font-weight: 400; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .card h3 a:hover { color: var(--heading); }
  .card.now { border-color: var(--neon-dim); box-shadow: 3px 0 0 var(--neon) inset; }
  .card.now h3 { color: var(--neon); }
  .card.now .q { font-size: 16px; line-height: 1.5; color: var(--heading); margin-bottom: 14px; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
  .kpi { font-size: 44px; font-weight: 200; line-height: 1; color: var(--heading); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpis .l { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .kpi.must { color: var(--must); } .kpi.should { color: var(--should); } .kpi.nit { color: var(--nit); }
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar { display: grid; grid-template-columns: 130px 1fr 22px; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
  .bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 8px; border-radius: 4px; background: var(--nit-bg); display: flex; overflow: hidden; }
  .track i { display: block; height: 100%; }
  .bar .n { text-align: right; color: var(--heading); }
  i.must { background: var(--must); } i.should { background: var(--should); } i.nit { background: var(--nit-dot); }
  .progress { display: block; height: 6px; border-radius: 3px; background: var(--nit-bg); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--neon); }
  .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0;
    border-top: 1px solid var(--line); font-size: 13px; }
  .ok { color: var(--neon); } .no { color: var(--must); } .wip { color: var(--dim); }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 20px; } .md li { margin: 3px 0; }

  /* ---- tables ---- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; table-layout: fixed; }
  th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--card2); }
  tr.sel td { background: var(--neon-bg); } tr.sel td:first-child { box-shadow: 2px 0 0 var(--neon) inset; }
  td .t { color: var(--heading); } td .w { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .sev { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sev::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--nit-dot); flex: none; }
  .sev.must-fix::before { background: var(--must); } .sev.should-fix::before { background: var(--should); }
  .who-agent, .who-developer { white-space: nowrap; } .who-agent { color: var(--neon); } .who-developer { color: var(--change); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .chip { padding: 5px 12px; border-radius: var(--pill); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px;
    cursor: pointer; background: none; }
  .chip:hover { color: var(--text); }
  .chip.on { border-color: var(--neon-dim); color: var(--neon); background: var(--neon-bg); }
  .chip b { font-weight: 500; color: inherit; margin-left: 4px; }
  .fsep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  select.chip { appearance: none; background: var(--bg); }
  .search { margin-left: auto; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: none;
    color: var(--text); width: 220px; font: inherit; font-size: 13px; }
  .cover { font-size: 12.5px; padding: 6px 10px; border-radius: 9px; background: var(--neon-bg); }

  /* ---- side panel ---- */
  .panel { border-left: 1px solid var(--line); background: var(--code-bg); display: flex; flex-direction: column;
    padding: 22px 22px 18px; min-height: 0; overflow-y: auto; position: relative; }
  .panel .crumb { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .panel h2 { margin: 6px 0 4px; font-size: 18px; font-weight: 400; color: var(--heading); line-height: 1.35; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 13.5px; }
  .box .l { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
  .quote { border-left: 2px solid var(--select); padding: 6px 12px; margin: 10px 0 0; color: var(--muted);
    background: var(--select-bg); border-radius: 0 8px 8px 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
  .thread { margin-top: 16px; }
  .thread-h { font-size: 12px; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 10px; }
  .msgs { display: flex; flex-direction: column; gap: 10px; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .msg .body { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .msg.developer .body { background: var(--select-bg); border-color: var(--select-bg); }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 6px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--line2); margin-top: 12px; }
  .composer textarea { flex: 1; background: none; border: 0; color: var(--text); font: inherit; resize: none; min-height: 36px; padding: 6px; outline: none; }
  .send { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--neon-strong);
    color: var(--heading); border: 0; cursor: pointer; flex: none; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .panel.dock { position: fixed; right: 0; bottom: 0; width: var(--panel-w, clamp(560px, 42vw, 980px)); z-index: 14; border-top: 1px solid var(--line); }
  .panel.over { position: fixed; right: 0; bottom: 0; width: var(--panel-w, clamp(560px, 42vw, 980px)); z-index: 16;
    border-left: 1px solid var(--line2); box-shadow: -30px 0 60px var(--shadow); }
  .grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 3; }
  .grip::after { content: ""; position: absolute; left: 3px; top: 50%; width: 2px; height: 36px; margin-top: -18px;
    border-radius: 2px; background: var(--line2); }
  .grip:hover::after, .grip.drag::after { background: var(--neon); }
  .log div { font-size: 12.5px; padding: 3px 0; white-space: pre-wrap; }
  .log .tool { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .log .denied { color: var(--must); font-family: var(--mono); font-size: 11.5px; }
  .log .turn { color: var(--dim); font-size: 11px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .log .you { color: var(--heading); border-left: 2px solid var(--select); padding-left: 8px; }

  /* ---- selection popover ---- */
  .pop { position: fixed; display: none; gap: 4px; padding: 4px; border-radius: 10px; background: var(--float);
    border: 1px solid var(--line2); box-shadow: 0 10px 30px var(--shadow); z-index: 30; }

  /* ---- files and diffs ---- */
  .pdir { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin: 8px 0 2px 6px; }
  .pf { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; font-size: 12.5px;
    font-family: var(--mono); margin-left: 8px; cursor: pointer; }
  .pf:hover { background: var(--card); }
  /* the file's name gets the whole line; its findings sit under it */
  .pf { align-items: flex-start; } .pf .vbox, .pf .kd { margin-top: 3px; }
  .pf .pfmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pf .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf.on { background: var(--card); color: var(--heading); box-shadow: 2px 0 0 var(--heading) inset; }
  .pf.del .nm { text-decoration: line-through; color: var(--muted); }
  .vbox { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line2); display: inline-grid; place-items: center;
    font-size: 10px; flex: none; font-family: -apple-system, sans-serif; cursor: pointer; }
  .vbox.on { background: var(--neon); border-color: var(--neon); color: var(--bg); }
  .kd { display: inline-block; width: 12px; text-align: center; font-family: var(--mono); font-weight: 600; }
  .kd.added { color: var(--neon); } .kd.modified, .kd.renamed { color: var(--change); } .kd.deleted { color: var(--must); }
  .dots { display: inline-flex; gap: 6px; flex: none; font-size: 11px; font-family: -apple-system, sans-serif; font-weight: 500; }
  .dots span { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
  .dots span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--nit-dot); }
  .dots .must-fix::before { background: var(--must); } .dots .should-fix::before { background: var(--should); }
  .klegend { font-size: 11.5px; color: var(--muted); margin: 10px 0 0 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .diffcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
  .diffhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .diffbody { overflow-x: auto; padding: 6px 0; }
  .hunk { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--change-bg); padding: 4px 16px; }
  .ln { display: grid; grid-template-columns: 44px 44px 44px 18px max-content; line-height: 1.9; white-space: pre; font-family: var(--mono);
    font-size: 12.5px; min-width: 100%; }
  .ln .no, .ln .sg { color: var(--dim); user-select: none; } .ln .no { text-align: right; padding-right: 8px; } .ln .sg { text-align: center; }
  .ln.add { background: var(--added-bg); } .ln.add .sg { color: var(--neon); }
  .ln.del { background: var(--removed-bg); } .ln.del .sg { color: var(--must); } .ln.del .c { color: var(--removed-text); }
  .ln.whole { background: none; }
  .ln .gd { display: flex; gap: 3px; align-items: center; padding-left: 4px; cursor: pointer; user-select: none; }
  .ln .gd i { width: 7px; height: 7px; border-radius: 50%; } .ln .gd .more { font-size: 10.5px; color: var(--muted); font-style: normal; }
  .gd i.must { background: var(--must); } .gd i.should { background: var(--should); } .gd i.nit { background: var(--nit-dot); }
  .ln .gd:hover, .ln.open .gd { background: var(--float); border-radius: 6px; }
  .ln .gl { display: none; }
  .ln.lf-must-fix { outline: 1px solid var(--must); outline-offset: -1px; } .ln.lf-should-fix { outline: 1px solid var(--should); outline-offset: -1px; }
  .ln.lf-nit { outline: 1px solid var(--nit); outline-offset: -1px; }
  .ann.on { border-color: var(--line2); background: var(--float); }
  .gtip { position: fixed; display: none; z-index: 30; max-width: 520px; padding: 8px 12px; border-radius: 10px; background: var(--float);
    border: 1px solid var(--line2); box-shadow: 0 10px 30px var(--shadow); font-size: 12.5px; pointer-events: none; }
  .gtip div { display: flex; gap: 8px; align-items: center; padding: 2px 0; } .gtip .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .switch { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; color: var(--muted); }
  .switch i { width: 28px; height: 16px; border-radius: 999px; background: var(--switch-off); position: relative; }
  .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--knob); }
  .switch.on i { background: var(--neon-strong); } .switch.on i::after { left: 14px; }
  .sevn { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); } .sevn i { width: 7px; height: 7px; border-radius: 50%; margin-left: 4px; }
  .ln.sel { background: var(--select-bg); box-shadow: 2px 0 0 var(--select) inset; }
  .ann { margin: 4px 16px 8px 106px; padding: 8px 12px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line);
    font-size: 13px; display: flex; gap: 10px; align-items: baseline; cursor: pointer; white-space: normal; }
  .ann:hover { border-color: var(--line2); }
  .banner { margin: 10px 16px; padding: 10px 14px; border-radius: 10px; font-size: 13px; background: var(--card2); border: 1px solid var(--line); }
  .banner.red { background: var(--must-bg); border-color: var(--must-bg); }
  .snip .ln { grid-template-columns: 36px 18px minmax(0, 1fr); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ---- structure: use cases as cards, one opened beside them ---- */
  .ucs { position: relative; min-height: 120px; }
  .uc { position: absolute; width: 260px; background: var(--card2); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 16px;
    cursor: pointer; transition: left .42s cubic-bezier(.2, .7, .2, 1), top .42s cubic-bezier(.2, .7, .2, 1), width .42s cubic-bezier(.2, .7, .2, 1),
    border-color .2s, box-shadow .2s; }
  .uc:hover { border-color: var(--neon-dim); }
  .uc .gac { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uc .name { color: var(--heading); font-size: 15px; margin: 2px 0 8px; }
  .uc .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .uc.untied { border-style: dashed; border-color: var(--should-bg); } .uc.untied .name { color: var(--should); }
  .uc.picked { border-color: var(--neon); box-shadow: 0 0 0 3px var(--neon-bg); }
  .uc.related { border-style: dashed; border-color: var(--line2); }
  .tip { position: absolute; width: 320px; background: var(--float); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px;
    z-index: 25; box-shadow: 0 16px 40px var(--shadow); font-size: 13px; pointer-events: none; display: none; }
  .tip .say { color: var(--heading); margin-bottom: 8px; }
  .tip .shares { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .slide > * { flex: none; }
  .slide { position: fixed; right: 0; bottom: 0; z-index: 15; border-left: 1px solid var(--line2); box-shadow: -30px 0 60px var(--shadow);
    transform: translateX(100%); transition: transform .42s cubic-bezier(.2, .7, .2, 1); visibility: hidden; }
  .slide.shown { transform: none; visibility: visible; }
  .slide > * { transition: opacity .14s ease; } .slide.swap > * { opacity: 0; }
  .change { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; font-size: 13.5px; }
  .change > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .change > div:last-child { border-color: var(--neon-dim); }
  .change .l { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  details.how { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  details.how summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .hflow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  .hstep { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border-radius: 8px; background: var(--card2);
    border: 1px solid var(--line2); font-size: 12px; cursor: pointer; }
  .harr { color: var(--muted); font-size: 12px; } .harr.bad { color: var(--must); }
  .hstep.still { cursor: default; border-style: dashed; color: var(--muted); }
  .hstep.still.go { cursor: pointer; } .hstep.still.go:hover { color: var(--text); border-color: var(--line2); }
  .ln.lit { outline: 1px solid var(--neon); outline-offset: -1px; }
  .hstep.cross { border-color: var(--must); }
  .xtag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--must-bg); color: var(--must); white-space: nowrap; }
  .hbr { margin-top: 10px; font-size: 12.5px; } .hbr div { padding: 2px 0; }
  .fnotes { margin-top: 14px; } .fnotes .ann { cursor: pointer; margin: 0 0 6px; } .fnotes .ann b { font-weight: 500; } .fnotes .where { margin-left: auto; color: var(--dim); white-space: nowrap; }

  /* where the review is: its steps, and what a tab waits for */
  .steps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .steps i { height: 5px; border-radius: 3px; background: var(--nit-bg); }
  .steps .cap { grid-row: 2; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .steps i.done { background: var(--neon); } .steps i.now { background: var(--neon-dim); animation: p 1.6s infinite; }
  .steps.wait i.now { background: var(--should); animation: none; } .steps.off i.now { background: var(--nit-dot); animation: none; }
  .stepline { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }
  .stepline b { font-weight: 400; color: var(--heading); }
  .pending { text-align: left; max-width: 640px; }
  .pending .steps { margin: 14px 0 10px; }
  .indeterminate { height: 4px; border-radius: 2px; background: var(--nit-bg); overflow: hidden; position: relative; margin: 14px 0; }
  .indeterminate::after { content: ""; position: absolute; left: -40%; width: 40%; height: 100%; background: var(--neon);
    animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { to { left: 100%; } }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--float); border: 1px solid var(--neon-dim);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  /*MD_CSS*/
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
  <aside class="panel" id="panel" style="display:none"></aside>
</div>
<aside class="panel slide" id="ucpanel"></aside>
<div class="hover" id="hover"></div>
<div class="pop" id="pop"></div>
<div class="gtip" id="gtip"></div>
<div class="toast" id="toast"></div>
<script>
// ================================================================ state
// One review is shown at a time: `project` + `id` from the address. `ui` is what the developer looks at in it.
const params = new URLSearchParams(location.search);
let current = { project: params.get("project"), id: params.get("review") };
let reviewsList = [], projects = [], R = null, deferred = false;
const ui = { tab: params.get("tab") || "overview", panel: null, file: params.get("file"), uc: null, ucFile: null,
  fsev: null, fby: null, fstatus: "open", fcat: "", fquestions: false, search: "", codeFilter: "all", editing: null,
  selection: null, inline: localStorage.getItem("craftsman-review-inline") === "1", open: new Set() };
const diffs = {}, refs = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// one line the agent wrote: escaped, with `code` and **bold** as markdown renders them
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code class="inl-c">$1</code>').replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const K = () => ({ project: current.project, id: current.id });
const q = () => `project=${encodeURIComponent(current.project)}&id=${encodeURIComponent(current.id)}`;
const SEV = { "must-fix": "Must fix", "should-fix": "Should fix", "nit": "Nit" };
const SEVS = Object.keys(SEV);
const KIND = { added: "+", modified: "~", renamed: "~", deleted: "−", unchanged: "·" };
const STATUS = { open: f => !["deleted", "sent"].includes(f.status), "to-send": f => f.status === "to-send",
  sent: f => f.status === "sent", deleted: f => f.status === "deleted" };
// The review's steps, as the code-review bundle runs them. The page works out the step from what the state already
// holds; a checkpoint names its step exactly.
// each step: its protocol, its name, and what the AI agent is doing while the review is at it
const STEPS = [["open-review", "Open the review", "fetches the PR, checks out its code, and stores the diff"],
  ["read-pr-scope", "Read what the PR is for", "reads the PR's description and tickets: how it was, how it will be"],
  ["map-change-structure", "Map the use cases", "follows each entry point through the change"],
  ["read-test-rules", "Read the rules from the tests", "reads the business rules the tests check"],
  ["triage-explanations", "Note the places that are hard to follow", "writes notes on the places a reviewer stops at"],
  ["review-use-cases", "Review the use cases", "reviews the code use case by use case and writes findings"],
  ["deduplicate-findings", "Merge findings that repeat one problem", "merges findings that say the same thing, so each problem is one comment"],
  ["serve-page", "Answer your questions", "answers what you ask on this page"]];
const stepAt = id => STEPS.findIndex(([k]) => k === id);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

async function reload() {
  const [list, ping] = await Promise.all([fetch("/api/reviews"), fetch("/api/ping")]);
  reviewsList = list.ok ? (await list.json()).reviews : [];
  projects = ping.ok ? (await ping.json()).found : [];
  if (!current.id) {
    const open = reviewsList.filter(r => !r.archived && !r.closed);
    const first = open.find(r => r.checkpoint) || open[0];
    if (first) current = { project: first.project, id: first.id };
  }
  if (current.id) {
    const r = await fetch("/api/review?" + q());
    const fresh = r.ok ? await r.json() : null;
    if (fresh && R && fresh.state.head !== R.state.head) Object.keys(diffs).forEach(k => delete diffs[k]);
    R = fresh;
  } else R = null;
  render();
}
function fileDiff(path) {
  if (diffs[path] !== undefined) return;
  diffs[path] = null;
  fetch(`/api/review/diff?${q()}&path=${encodeURIComponent(path)}`).then(r => r.ok ? r.text() : "")
    .then(text => { diffs[path] = parseDiff(text); render(); });
}
function references(path) {
  if (refs[path] !== undefined) return;
  refs[path] = null;
  fetch(`/api/review/references?${q()}&path=${encodeURIComponent(path)}`).then(r => r.ok ? r.json() : { references: [] })
    .then(out => { refs[path] = out.references; render(); });
}
const api = async (path, body) => {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Craftsman": "1" },
    body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({ error: "no answer from the server" }));
  if (!r.ok) { toast(out.error || "failed"); return null; }
  return out;
};
const change = (action, body) => api("/api/review/change", { ...K(), action, ...body });
function go(target) {
  const other = target.id !== undefined && (target.id !== current.id || target.project !== current.project);
  if (target.id !== undefined) current = { project: target.project, id: target.id };
  Object.assign(ui, target.ui || {});
  if (other) { R = null; Object.keys(diffs).forEach(k => delete diffs[k]); Object.keys(refs).forEach(k => delete refs[k]);
    Object.assign(ui, { panel: null, uc: null, file: null, selection: null }); }
  const p = new URLSearchParams();
  if (current.id) { p.set("project", current.project); p.set("review", current.id); }
  if (ui.tab !== "overview") p.set("tab", ui.tab);
  if (ui.tab === "code" && ui.file) p.set("file", ui.file);
  history.replaceState(null, "", "?" + p.toString());
  return other ? reload() : render();
}

// ================================================================ reading the review
const S = () => R.state;
const useCases = () => (S().structure || {})["use-cases"] || [];
const fileInfo = path => (R.files || []).find(f => f.path === path) || { path, change: "modified", added: 0, removed: 0, "use-cases": [], viewed: false };
const live = list => list.filter(f => !["merged", "deleted", "sent"].includes(f.status));
const findingsAt = path => S().findings.filter(f => !["merged", "deleted"].includes(f.status) && (f.locations || []).some(l => l.path === path));
const threadsOf = (kind, id) => (S().threads || []).filter(t => t.about.kind === kind && (kind === "file" ? t.about.path === id : t.about.id === id));
const waiting = () => S().checkpoint && !S().checkpoint.answer;
function sourceLabel(src) {
  if (!src) return "";
  if (src.kind === "pull-request") return `PR #${src.number} · ${src.repository}`;
  return `${src.target} ← ${src.source}` + (src["pull-request"] ? ` · PR #${src["pull-request"].number}` : " · no PR");
}
const pull = src => src && (src.kind === "pull-request" ? src : src["pull-request"]);
const dotsOf = list => `<span class="dots" title="${plural(list.length, "finding")}">${SEVS.map(k => [k, list.filter(f => f.severity === k).length])
  .filter(([, n]) => n).map(([k, n]) => `<span class="${k}">${n}</span>`).join("")}</span>`;
const sev = s => `<span class="sev ${esc(s)}">${SEV[s] || esc(s)}</span>`;
const who = by => by === "developer" ? `<span class="who-developer">● you</span>` : `<span class="who-agent">✦ AI Agent</span>`;
const md = key => R.html[key] || "";
function commonRoot() {
  const all = (R.files || []).map(f => f.path);
  const root = all.length > 1 ? all.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); }) : "";
  return root.slice(0, root.lastIndexOf("/") + 1);
}
const shortPath = p => { const root = commonRoot(); return root && p.startsWith(root) ? "…/" + p.slice(root.length) : p; };

function reviewStep() {
  // An open question fixes the step exactly. Otherwise the step is read from what the state holds, and an answered
  // question is a floor. Use cases count as mapped only once the review got past mapping them: their question was
  // answered, or a later step left something behind; until then the agent may still be about to ask about them.
  const s = S(), cp = s.checkpoint, ucs = useCases(), asked = cp && stepAt(cp.step);
  if (waiting() && asked >= 0) return asked;
  const later = (s.rules || []).length || (s.threads || []).some(t => t.messages[0].by === "agent") || ucs.some(u => u.status !== "pending");
  let at = !s.scope ? 0 : !ucs.length ? 1 : (later || asked >= 2) ? 3 : 2;
  if (at >= 3 && later) at = 4;
  if (ucs.some(u => u.status !== "pending")) at = 5;
  if (ucs.length && ucs.every(u => u.status === "reviewed")) at = 6;
  if (at === 6 && s.findings.some(f => f.status === "merged")) at = 7;
  if (cp && cp.answer && asked >= 0) at = Math.max(at, asked + 1);
  return Math.min(at, 7);
}
function stepsStrip(at, mode) {
  // the step in progress is named under its own bar, so it is clear what the blinking bar stands for
  const cap = at < STEPS.length / 2 ? `grid-column:${at + 1} / -1;text-align:left` : `grid-column:1 / ${at + 2};text-align:right`;
  return `<div class="steps ${mode}">${STEPS.map((_, i) => `<i class="${i < at ? "done" : i === at ? "now" : ""}" title="${i + 1}. ${STEPS[i][1]}${i < at ? " · done" : i === at ? " · now" : ""}"></i>`).join("")}` +
    `<span class="cap" style="${cap}">${at < STEPS.length / 2 ? "↑ " : ""}${mode === "off" ? "stopped here" : mode === "wait" ? "waits for your answer here" : "now: it " + STEPS[at][2]}${at < STEPS.length / 2 ? "" : " ↑"}</span></div>`;
}
const sessionMode = () => waiting() ? "wait" : R.running ? "" : "off";
const doing = () => waiting() ? "waits for your answer" : R.running ? "is working on it" : S().closed ? "— the review is closed" : "— its session is stopped";
// Under the tabs until the review reaches its last step: where it is, and what the AI agent does now.
function progressLine() {
  const at = reviewStep();
  const ask = waiting() && ui.tab !== "overview" ? `<div class="asks"><span class="pulse"></span><span class="grow"><b>AI Agent asks you</b> · ${esc(S().checkpoint.question.split("\n")[0])}</span>
    <button class="btn sm" data-answer-here>Answer here</button><a class="btn ghost sm" data-tab="overview">Open in Overview</a></div>` : "";
  if (at >= 7) return ask;
  return ask + `<div style="margin:-8px 0 18px"><div class="stepline"><span>Step ${at + 1} of ${STEPS.length} · <b>${STEPS[at][1]}</b></span>
    <span>AI Agent ${doing()}</span></div>${stepsStrip(at, sessionMode())}</div>`;
}
// What a tab shows before the step that fills it: which step that is, and where the review is now.
function pendingCard(step, what) {
  const at = reviewStep();
  return `<div class="card pending"><h3><span>${what}</span></h3>
    <div>This fills in at step ${step + 1} of ${STEPS.length}, <b>${STEPS[step][1].toLowerCase()}</b>. The AI agent is at step ${at + 1},
      ${STEPS[at][1].toLowerCase()}, and ${doing().replace(/^— /, "")}.</div>
    ${stepsStrip(at, sessionMode())}
    ${waiting() ? `<a class="btn go sm" data-tab="overview">Answer its question →</a>` : !R.running && !S().closed ? `<button class="btn go sm" data-power>Start the session</button>` : ""}</div>`;
}

// ================================================================ rail
function renderRail() {
  const shown = reviewsList.filter(r => !r.archived), archived = reviewsList.length - shown.length;
  document.getElementById("rail").innerHTML = shown.map((r, i) => {
    const pr = pull(r.source), here = r.id === current.id && r.project === current.project;
    return `<div class="rtile${here ? " on" : ""}" data-open-review="${i}" data-hoverr="${i}">${pr ? "#" + pr.number : "⑂"}` +
      `${r.checkpoint ? '<span class="badge"></span>' : ""}</div>`;
  }).join("") + `<div class="rsep"></div><div class="rtile" data-new title="New review">＋</div>` +
    `<div class="rtile end" data-archived title="Archived reviews · ${archived}">⌫</div>`;
}
function showHover(i, tile) {
  const r = reviewsList.filter(x => !x.archived)[i], h = document.getElementById("hover"); if (!r) return;
  const counts = r.findings || {};
  const total = Object.entries(counts).filter(([k]) => !["merged", "deleted"].includes(k)).reduce((a, [, n]) => a + n, 0);
  h.innerHTML = `<div class="muted" style="font-size:12px">${esc(sourceLabel(r.source))}</div>
    <div class="t">${esc((r.source && r.source.title) || r.id)}</div>
    <div class="muted">${esc(r.project.split("/").pop())}</div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${r.checkpoint ? '<span class="tag amber">AI Agent waits for your answer</span>' : ""}
      ${r.running ? '<span class="tag green">session running</span>' : '<span class="tag">session stopped</span>'}
      <span class="tag">${plural(total, "finding")}</span>${r.closed ? '<span class="tag">closed</span>' : ""}</div>
    <div class="row-actions"><button class="btn sm" data-open-review="${i}">Open</button>
      <button class="btn ghost sm" data-archive="${i}">Archive</button></div>`;
  h.style.top = Math.max(8, tile.getBoundingClientRect().top - 8) + "px";
  h.style.display = "block";
}

// ================================================================ header and tabs
function renderHead() {
  const s = S(), pr = pull(s.source), files = R.files || [];
  const added = files.reduce((a, f) => a + f.added, 0), removed = files.reduce((a, f) => a + f.removed, 0);
  const toSend = s.findings.filter(f => f.status === "to-send").length, now = useCases().find(u => u.status === "reviewing");
  const status = waiting() ? ["wait", "AI Agent waits for your answer"] : R.running ? ["", now ? `AI Agent · reviewing ${now.name}` : "AI Agent is working"]
    : ["off", s.closed ? "Review closed" : "Session stopped · start it"];
  const branches = s.source && (s.source["base-branch"] ? `${s.source["base-branch"]} ← ${s.source["head-branch"]}` :
    s.source.kind === "branches" ? `${s.source.target} ← ${s.source.source}` : "");
  const tabs = [["overview", "Overview", ""], ["structure", "Structure", useCases().length || ""],
    ["code", "Code", plural(files.length, "file")], ["findings", "Findings", live(s.findings).length]];
  return `<div class="head"><div>
      <div class="title"><h1>${esc((s.source && s.source.title) || sourceLabel(s.source))}</h1>
        ${pr ? `<span class="tag">PR #${pr.number}</span>` : '<span class="tag">no PR</span>'}
        ${(s.tickets || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="sub">${esc([pr && pr.repository, branches, `${plural(files.length, "file")}, +${added} −${removed}`].filter(Boolean).join(" · "))}</div></div>
    <div class="actions">
      <button class="live ${status[0]}" data-live title="Click for the session's log"><span class="pulse"></span>${esc(status[1])}</button>
      <button class="btn ghost" data-refresh>⟳ Refresh PR</button>
      <button class="btn go" data-send ${toSend && pr ? "" : "disabled"} title="${pr ? "" : "No pull request to send to"}">Send ${plural(toSend, "comment")}</button>
      <button class="btn ghost" data-power title="${R.running ? "Stop the session" : "Start the session"}">⏻</button>
    </div></div>
    <div class="tabs">${tabs.map(([id, name, n]) => `<a class="tab${id === ui.tab ? " on" : ""}" data-tab="${id}">${id === "overview" && waiting() ? '<span class="qdot" title="The AI agent waits for your answer"></span>' : ""}${name}${n !== "" ? `<span class="n">${n}</span>` : ""}</a>`).join("")}</div>`;
}

// ================================================================ overview
function viewOverview() {
  const s = S(), open = live(s.findings);
  const bySev = Object.fromEntries(SEVS.map(k => [k, open.filter(f => f.severity === k).length]));
  const cats = {};
  open.forEach(f => { cats[f.category] ||= { "must-fix": 0, "should-fix": 0, "nit": 0, n: 0 }; cats[f.category][f.severity]++; cats[f.category].n++; });
  const most = Math.max(1, ...Object.values(cats).map(c => c.n));
  const toSend = s.findings.filter(f => f.status === "to-send").length, sent = s.findings.filter(f => f.status === "sent").length;
  const ucs = useCases(), done = ucs.filter(u => u.status === "reviewed").length, cp = s.checkpoint;
  const scope = `<div class="md">${md("scope") || '<span class="muted">AI Agent has not read the PR yet.</span>'}</div>` +
    (md("requirements") ? `<h3 style="margin-top:14px"><span>What the ticket asks for</span></h3><div class="md">${md("requirements")}</div>` : "");
  let html = `<div class="grid">`;
  html += waiting() ? `<section class="card now s8"><h3><span>AI Agent asks you · ${esc(cp.step || "")}</span></h3>
      <div class="q">${esc(cp.question)}</div>
      <input class="field" id="cp-note" placeholder="A note with your answer (optional)" style="margin-bottom:10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${(cp.options || []).map((o, i) =>
        `<button class="btn${i === 0 ? " go" : ""}" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div></section>`
    : `<section class="card s8"><h3><span>What the PR is for</span></h3>${scope}</section>`;
  html += `<section class="card s4"><h3><span>Comments for the author</span><a data-tab="findings" data-fstatus="to-send">Review them →</a></h3>
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div><div class="kpi">${toSend}</div><div class="l">ready to send</div></div>
        <div><div class="kpi nit">${sent}</div><div class="l">sent</div></div></div>
      <div class="muted" style="font-size:13px;margin-top:14px">${plural(open.filter(f => f.status === "proposed").length, "finding")} not marked to send yet.</div></section>`;
  html += `<section class="card s4"><h3><span>Findings by severity</span><a data-tab="findings" data-fsev="">${open.length} →</a></h3>
      <div class="kpis">${SEVS.map(k => `<a data-tab="findings" data-fsev="${k}"><div class="kpi ${k.split("-")[0]}">${bySev[k]}</div><div class="l">${SEV[k].toLowerCase()}</div></a>`).join("")}</div>
      <div class="track" style="height:10px;margin-top:22px">${SEVS.map(k => `<i class="${k.split("-")[0]}" style="width:${open.length ? 100 * bySev[k] / open.length : 0}%"></i>`).join("")}</div></section>`;
  html += `<section class="card s4"><h3><span>Findings by category</span></h3><div class="bars">${Object.entries(cats).sort((a, b) => b[1].n - a[1].n).slice(0, 6).map(([c, v]) =>
      `<div class="bar" data-tab="findings" data-fcat="${esc(c)}"><span>${esc(c)}</span><span class="track">${SEVS.map(k => `<i class="${k.split("-")[0]}" style="width:${100 * v[k] / most}%"></i>`).join("")}</span><span class="n">${v.n}</span></div>`).join("") || `<span class="muted">${reviewStep() < 5 ? `Findings come at step 6, ${STEPS[5][1].toLowerCase()}.` : "No findings yet."}</span>`}</div></section>`;
  html += `<section class="card s4"><h3><span>Review progress</span><span>${done} of ${ucs.length} use cases</span></h3>
      <div class="progress" style="margin-bottom:10px"><i style="width:${ucs.length ? 100 * done / ucs.length : 0}%"></i></div>
      ${ucs.map(u => `<div class="row" data-tab="structure" data-uc="${esc(u.id)}" style="cursor:pointer"><span class="${u.status === "pending" ? "wip" : "ok"}">${u.status === "reviewed" ? "✓" : u.status === "reviewing" ? "●" : "○"}</span>
        <span>${esc(u.name)}</span>${dotsOf(open.filter(f => (f.locations || []).some(l => (u.files || []).includes(l.path))))}</div>`).join("") || '<span class="muted">AI Agent has not mapped the use cases yet.</span>'}</section>`;
  const must = open.filter(f => f.severity === "must-fix");
  if (must.length) html += `<section class="card s12"><h3><span>Must fix</span><a data-tab="findings" data-fsev="">All findings →</a></h3>${findingTable(must)}</section>`;
  if (waiting()) html += `<section class="card s12"><h3><span>What the PR is for</span></h3>${scope}</section>`;
  return html + `</div>`;
}

// ================================================================ findings
function findingTable(list) {
  return `<table><thead><tr><th style="width:110px">Severity</th><th>Finding</th><th style="width:100px">By</th><th style="width:140px">Category</th>
    <th style="width:70px">Thread</th><th style="width:110px">To the author</th></tr></thead><tbody>${list.map(f => {
      const loc = (f.locations || [])[0] || {}, threads = threadsOf("finding", f.id);
      const st = { "to-send": '<span class="tag green">to send</span>', sent: '<span class="tag blue">sent</span>',
        "maybe-resolved": '<span class="tag amber">maybe resolved</span>', deleted: '<span class="tag">dropped</span>' }[f.status] || '<span class="tag">not yet</span>';
      return `<tr data-finding="${esc(f.id)}"${ui.panel && ui.panel.finding === f.id ? ' class="sel"' : ""}><td>${sev(f.severity)}</td>
        <td><div class="t">${inline(f.title)}</div><div class="w mono" title="${esc(loc.path || "")}">${esc(shortPath(loc.path || ""))}${loc.line ? ":" + loc.line : ""}</div></td>
        <td>${who(f.by)}</td><td class="muted">${esc(f.category)}</td>
        <td class="muted">${threads.length ? `💬 ${threads.reduce((a, t) => a + t.messages.length, 0)}` : '<span class="dim">—</span>'}</td><td>${st}</td></tr>`;
    }).join("")}</tbody></table>`;
}
function viewFindings() {
  if (!S().findings.length && reviewStep() < 5) return pendingCard(5, "No findings yet");
  const all = S().findings.filter(f => f.status !== "merged"), base = all.filter(STATUS[ui.fstatus] || STATUS.open);
  const openQ = f => threadsOf("finding", f.id).some(t => t.status === "open"), text = ui.search.toLowerCase();
  const list = base.filter(f => (!ui.fsev || f.severity === ui.fsev) && (!ui.fby || (f.by || "agent") === ui.fby) && (!ui.fcat || f.category === ui.fcat) &&
    (!ui.fquestions || openQ(f)) && (!text || (f.title + " " + f.comment + " " + (f.locations || []).map(l => l.path).join(" ")).toLowerCase().includes(text)))
    .sort((a, b) => SEVS.indexOf(a.severity) - SEVS.indexOf(b.severity));
  const chip = (label, n, on, data) => `<button class="chip${on ? " on" : ""}" ${data}>${label}${n !== null ? ` <b>${n}</b>` : ""}</button>`;
  const cats = [...new Set(all.map(f => f.category))].sort();
  return `<div class="filters">
      ${chip("All", base.length, !ui.fsev, 'data-fsev=""')}${SEVS.map(k => chip(SEV[k], base.filter(f => f.severity === k).length, ui.fsev === k, `data-fsev="${k}"`)).join("")}
      <span class="fsep"></span>${chip("✦ AI Agent", base.filter(f => f.by !== "developer").length, ui.fby === "agent", 'data-fby="agent"')}${chip("You", base.filter(f => f.by === "developer").length, ui.fby === "developer", 'data-fby="developer"')}
      <span class="fsep"></span><select class="chip${ui.fcat ? " on" : ""}" id="fcat"><option value="">Any category</option>${cats.map(c => `<option${c === ui.fcat ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
      ${chip("Open questions", base.filter(openQ).length, ui.fquestions, "data-fquestions")}
      <span class="fsep"></span>${[["open", "Open"], ["to-send", "To send"], ["sent", "Sent"], ["deleted", "Dropped"]].map(([k, l]) =>
        chip(l, all.filter(STATUS[k]).length, ui.fstatus === k, `data-fstatus="${k}"`)).join("")}
      <input class="search" id="fsearch" placeholder="Search findings…"></div>
    <div class="card" style="padding:6px 10px">${list.length ? findingTable(list) : '<div class="muted" style="padding:14px">No finding matches.</div>'}</div>`;
}

// ================================================================ the side panel
function panelFinding(id) {
  const f = S().findings.find(x => x.id === id); if (!f) return `<div class="muted">No finding ${esc(id)}.</div>`;
  const loc = (f.locations || [])[0] || {}, sent = f.status === "sent", editing = ui.editing === f.id;
  const snippet = loc.path ? snippetAt(loc.path, loc.line, loc.side) : "";
  const actions = editing ? `<button class="btn go sm" data-save="${esc(f.id)}">Save</button><button class="btn ghost sm" data-edit="">Cancel</button>`
    : sent ? (f.sent || []).map(x => `<a class="btn sm" href="${esc(x.url)}" target="_blank">On GitHub ↗</a>`).join("")
    : (f.status === "to-send" ? `<button class="btn sm" data-status="proposed">✓ Marked to send</button>` : `<button class="btn go sm" data-status="to-send">Mark to send</button>`) +
      (f.status === "deleted" ? `<button class="btn ghost sm" data-status="proposed">Bring back</button>` : `<button class="btn danger sm" data-status="deleted">Drop</button>`);
  // every place it points at, grouped by file; a line number scrolls the diff to it
  const byFile = new Map(); (f.locations || []).forEach(l => byFile.set(l.path, [...(byFile.get(l.path) || []), l.line]));
  const places = [...byFile].map(([path, lines]) => `<span title="${esc(path)}">${esc(path.split("/").pop())}</span> ` +
    lines.map(n => `<a data-goto="${esc(path)}|${n}" style="color:var(--neon)">${n}</a>`).join(", ")).join(" · ");
  return `<div class="crumb"><span>Finding ${esc(f.id)} · ${esc(f.category)} · ${who(f.by)}${places ? " · " + places : ""}</span><a data-close-panel>✕</a></div>
    ${editing ? `<input class="field" id="edit-title" value="${esc(f.title)}" style="margin-top:8px">` : `<h2>${inline(f.title)}</h2>`}
    <div class="filters" style="margin:6px 0 0">${SEVS.map(k => `<button class="chip${f.severity === k ? " on" : ""}" data-set-sev="${k}" ${sent ? "disabled" : ""}>${SEV[k]}</button>`).join("")}</div>
    ${f.status === "maybe-resolved" ? `<div class="banner" style="margin:12px 0 0">AI Agent no longer sees this problem at the PR's head. Drop it, or keep it.</div>` : ""}
    ${editing || f.description ? `<div class="box" data-quote-about="finding:${esc(f.id)}"><div class="l">Why</div>${editing ? `<textarea class="field" id="edit-description">${esc(f.description)}</textarea>` : `<div class="md">${md(`finding:${f.id}:description`)}</div>`}</div>` : ""}
    ${snippet ? `<div class="box"><div class="l"><span class="mono">${esc(loc.path)}</span><a style="color:var(--neon)" data-open-file="${esc(loc.path)}">Open in Code →</a></div>${snippet}</div>` : ""}
    <div class="box"><div class="l"><span>Draft comment to the author</span>${sent || editing ? "" : `<a data-edit="${esc(f.id)}">Edit</a>`}</div>
      ${editing ? `<textarea class="field" id="edit-comment" style="min-height:140px">${esc(f.comment)}</textarea>` : `<div class="md">${md(`finding:${f.id}:comment`)}</div>`}</div>
    <div class="row-actions">${actions}</div>
    ${(f.sent || []).flatMap(x => x.replies || []).map(r => `<div class="box"><div class="l">${esc(r.author)} on GitHub</div>${esc(r.body)}</div>`).join("")}
    ${threadsBlock(threadsOf("finding", f.id), { kind: "finding", id: f.id }, "Ask about this finding…")}`;
}
// Open threads in full; resolved ones folded under one line, so the conversation that matters stays in view. A question
// waiting for an answer says plainly whether the session that answers it is running.
function threadsBlock(threads, about, placeholder) {
  const last = [...threads].reverse().find(t => t.status === "open");
  const one = t => {
    const waits = t.status === "open" && t.messages[t.messages.length - 1].by === "developer";
    return `<div class="thread"><div class="thread-h"><span>${t.messages[0].by === "agent" ? "AI Agent's note" : "Your question"} · ${t.status}</span>
      ${t.status === "open" ? `<a data-resolve="${esc(t.id)}">Resolve</a>` : ""}</div>
      ${t.quote ? `<div class="quote">${esc(t.quote)}</div>` : ""}
      <div class="msgs" style="margin-top:8px">${t.messages.map((m, i) => `<div class="msg ${m.by}"><div class="who">${m.by === "agent" ? "✦ AI Agent" : "you"} · ${esc((m.at || "").slice(11, 16))}</div>
        <div class="body md">${md(`thread:${t.id}:${i}`) || esc(m.text)}</div></div>`).join("")}
      ${!waits ? "" : R.running ? '<div class="muted" style="font-size:12px">AI Agent is answering…</div>'
        : '<div class="banner" style="margin:0">No answer yet: the AI agent\'s session is stopped. <a style="color:var(--neon)" data-power>Start it</a> and it answers every question waiting.</div>'}</div></div>`;
  };
  const open = threads.filter(t => t.status === "open"), resolved = threads.filter(t => t.status !== "open");
  return (resolved.length ? `<details class="thread"><summary class="muted" style="font-size:12px;cursor:pointer">${plural(resolved.length, "resolved question")}</summary>${resolved.map(one).join("")}</details>` : "") +
    open.map(one).join("") +
    `<div class="composer"><textarea id="compose" placeholder="${esc(placeholder)}" rows="2"></textarea>
      <button class="send" data-compose="${esc(JSON.stringify({ about, thread: last ? last.id : null }))}" title="Send (⌘↵)">→</button></div>`;
}
function placeOf(about) {
  if (about.kind === "file") return `${about.path}${about.lines ? ` ${about.lines[0]}–${about.lines[1]}` : ""}`;
  if (about.kind === "review") return "the whole review";
  const uc = about.kind === "use-case" && useCases().find(u => u.id === about.id);
  return uc ? uc.name : `${about.kind} ${about.id}`;
}
function panelAsk(p) {
  const same = p.about.kind === "file" ? threadsOf("file", p.about.path).filter(t => JSON.stringify(t.about.lines) === JSON.stringify(p.about.lines))
    : p.about.kind === "use-case" ? threadsOf("use-case", p.about.id) : [];
  return `<div class="crumb"><span>Question · ${esc(placeOf(p.about))}</span><a data-close-panel>✕</a></div>
    <h2>Ask AI Agent</h2>${p.quote && !same.length ? `<div class="quote">${esc(p.quote)}</div>` : ""}
    ${threadsBlock(same, { ...p.about, quote: p.quote }, "What do you want to know?")}
    ${p.about.kind === "file" ? `<div class="row-actions"><button class="btn sm" data-new-finding>Make it a finding</button></div>` : ""}`;
}
function panelThread(id) {
  const t = (S().threads || []).find(x => x.id === id); if (!t) return "";
  return `<div class="crumb"><span>Thread ${esc(t.id)} · ${esc(placeOf(t.about))}</span><a data-close-panel>✕</a></div>
    ${threadsBlock([t], t.about, "Reply…")}
    ${t.about.kind === "file" ? `<div class="row-actions"><button class="btn sm" data-open-file="${esc(t.about.path)}">Show the code</button></div>` : ""}`;
}
function panelNewFinding(p) {
  return `<div class="crumb"><span>Your finding · ${esc(p.path)}:${p.lines[0]}${p.lines[1] !== p.lines[0] ? "–" + p.lines[1] : ""}</span><a data-close-panel>✕</a></div>
    <h2>New finding</h2>${p.quote ? `<div class="quote">${esc(p.quote)}</div>` : ""}
    <div class="filters" style="margin-top:12px">${SEVS.map(k => `<button class="chip${p.severity === k ? " on" : ""}" data-nf-sev="${k}">${SEV[k]}</button>`).join("")}</div>
    <input class="field" id="nf-title" placeholder="Title — a few words" style="margin-top:4px">
    <textarea class="field" id="nf-comment" placeholder="The comment for the author: what is wrong, why it matters, what to do" style="margin-top:10px;min-height:140px"></textarea>
    <div class="row-actions"><button class="btn go sm" data-nf-save>Add finding</button><button class="btn ghost sm" data-close-panel>Cancel</button></div>`;
}
function panelCheckpoint() {
  const cp = S().checkpoint;
  if (!cp || cp.answer) return `<div class="crumb"><span>AI Agent's question</span><a data-close-panel>✕</a></div><h2>Answered</h2>`;
  return `<div class="crumb"><span>AI Agent asks you · ${esc(cp.step || "")}</span><a data-close-panel>✕</a></div>
    <div class="box" style="white-space:pre-wrap;color:var(--heading)">${esc(cp.question)}</div>
    <input class="field" id="cp-note" placeholder="A note with your answer (optional)" style="margin-top:12px">
    <div class="row-actions">${(cp.options || []).map((o, i) => `<button class="btn${i === 0 ? " go" : ""} sm" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
}
function panelLog() {
  const s = S();
  return `<div class="crumb"><span>The review's AI Agent session</span><a data-close-panel>✕</a></div>
    <h2>${R.running ? "Running" : "Stopped"}</h2>
    <div class="row-actions">${R.running ? '<button class="btn sm" data-power>Stop the session</button>' : '<button class="btn go sm" data-power>Start the session</button>'}
      <button class="btn danger sm" data-close-review>Close the review</button></div>
    ${s.session ? `<div class="box"><div class="l">Continue it in the CLI, once the session is stopped</div><code>cd ${esc(current.project)} && claude --resume ${esc(s.session)}</code></div>` : ""}
    <div class="box log">${(R.console || []).map(l => `<div class="${l.kind}">${esc(l.text)}</div>`).join("") || '<span class="muted">Nothing yet.</span>'}</div>`;
}
function renderPanel() {
  const el = document.getElementById("panel"), app = document.getElementById("app"), p = ui.panel;
  const body = !p || !R ? "" : p.finding ? panelFinding(p.finding) : p.thread ? panelThread(p.thread) : p.ask ? panelAsk(p.ask)
    : p.newFinding ? panelNewFinding(p.newFinding) : p.log ? panelLog() : p.checkpoint ? panelCheckpoint() : "";
  // The panel starts under the tabs, level with the content beside it, so the header keeps its width. Over an open
  // use case it floats on top of it instead of pushing the use case aside.
  const over = !!body && ui.tab === "structure" && !!ui.uc;
  app.classList.toggle("with-panel", !!body && !over);
  el.classList.toggle("over", over);
  el.classList.toggle("dock", !!body && !over);
  placePanel();
  el.style.display = body ? "flex" : "none";
  el.innerHTML = body ? `<div class="grip" id="grip"></div>` + body : "";
}

function placePanel() {
  const tabs = document.querySelector(".tabs"), el = document.getElementById("panel");
  el.style.top = Math.max(0, tabs ? tabs.getBoundingClientRect().bottom : 0) + "px";
}

// ================================================================ diffs
function parseDiff(text) {
  const hunks = []; let old = 0, now = 0;
  for (const line of text.split("\n")) {
    const h = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if (h) { old = +h[1]; now = +h[2]; hunks.push({ header: line, lines: [] }); continue; }
    if (!hunks.length) continue;
    const kind = { "+": "add", "-": "del", " ": "ctx" }[line[0]];
    if (!kind) continue;
    hunks[hunks.length - 1].lines.push({ kind, old: kind === "add" ? null : old, now: kind === "del" ? null : now, text: line.slice(1) });
    if (kind !== "add") old++;
    if (kind !== "del") now++;
  }
  return hunks;
}
function snippetAt(path, line, side) {
  const hunks = diffs[path];
  if (!hunks) { fileDiff(path); return '<div class="muted">Loading…</div>'; }
  const all = hunks.flatMap(h => h.lines), at = all.findIndex(l => (side === "LEFT" ? l.old : l.now) === line);
  if (at < 0) return "";
  return `<div class="snip">${all.slice(Math.max(0, at - 3), at + 4).map((l, i, shown) => `<div class="ln ${l.kind}${l === all[at] ? " sel" : ""}">` +
    `<span class="no">${l.now ?? l.old}</span><span class="sg">${l.kind === "add" ? "+" : l.kind === "del" ? "−" : ""}</span><span class="c">${esc(l.text)}</span></div>`).join("")}</div>`;
}
// One file's diff, with its findings and threads under their lines. A new or a deleted file is shown without colour:
// every line of it changed alike, so the colour would say nothing.
function diffView(path, position) {
  const info = fileInfo(path), hunks = diffs[path];
  const counts = [info.added ? "+" + info.added : "", info.removed ? "−" + info.removed : ""].filter(Boolean).join(" ");
  const head = `<div class="diffhead"><span>${position ? `<span class="muted" style="font-size:12.5px">${position}</span><br>` : ""}<b class="mono">${esc(path)}</b>
      <span class="tag ${{ added: "green", deleted: "red" }[info.change] || "blue"}" style="margin-left:6px">${info.change}${counts ? " · " + counts : ""}</span></span>
    <span style="display:flex;gap:14px;align-items:center;font-size:12.5px"><span class="muted">select lines to ask AI Agent or add a finding</span>${sevCounts(findingsAt(path))}
      <span class="switch${ui.inline ? " on" : ""}" data-inline title="Every finding under its line, or dots beside the line number"><i></i>Show all inline</span>
      <span style="display:inline-flex;gap:6px;align-items:center;cursor:pointer" data-view="${esc(path)}"><span class="vbox${info.viewed ? " on" : ""}">${info.viewed ? "✓" : ""}</span>Viewed</span></span></div>`;
  if (!hunks) { fileDiff(path); return `<div class="diffcard">${head}<div class="banner">Loading…</div></div>`; }
  let banner = "";
  if (info.change === "added") banner = `<div class="banner"><span class="kd added">+</span> <b>New file</b> · all ${info.added} lines are added, so they carry no colour.</div>`;
  if (info.change === "renamed") banner = `<div class="banner">Renamed from <code>${esc(info.from)}</code>.</div>`;
  if (info.change === "deleted") {
    references(path);
    const found = refs[path], name = path.split("/").pop().replace(/\.[^.]+$/, "");
    banner = `<div class="banner red"><b>Deleted in this PR</b> · ${info.removed} lines.</div>` + (!found ? "" : found.length
      ? `<div class="banner red">Still named in: ${found.map(r => `<code>${esc(r)}</code>`).join(", ")}</div>`
      : `<div class="banner"><span class="ok">✓</span> Nothing in the reviewed code still names <code>${esc(name)}</code>.</div>`);
  }
  const notes = threadsOf("file", path), anchored = findingsAt(path), whole = ["added", "deleted"].includes(info.change);
  const sel = ui.selection && ui.selection.path === path ? ui.selection.lines : null;
  const opened = ui.panel && ui.panel.finding ? S().findings.find(f => f.id === ui.panel.finding) : null;
  const body = hunks.map(h => `<div class="hunk">${esc(h.header)}</div>` + h.lines.map(l => {
    const n = l.now ?? l.old, side = l.now === null ? "LEFT" : "RIGHT";
    const here = anchored.filter(f => f.locations.some(x => x.path === path && x.line === n && (x.side || "RIGHT") === side));
    const talk = notes.filter(t => t.about.lines && t.about.lines[1] === n && (side === "RIGHT" || info.change === "deleted"));
    const inSel = sel && side === "RIGHT" && n >= sel[0] && n <= sel[1], key = `${path}|${side}|${n}`;
    const shown = here.length && (ui.inline || ui.open.has(key)), lit = opened && here.includes(opened) ? " lf-" + opened.severity : "";
    return `<div class="ln ${l.kind}${whole ? " whole" : ""}${inSel ? " sel" : ""}${shown && !ui.inline ? " open" : ""}${lit}" data-line="${n}" data-side="${side}">` +
      `<span class="no">${l.old ?? ""}</span><span class="no">${l.now ?? ""}</span>${gutter(here, key)}<span class="sg">${l.kind === "add" ? "+" : l.kind === "del" ? "−" : ""}</span><span class="c">${esc(l.text)}</span></div>` +
      (shown ? here.map(f => `<div class="ann${f === opened ? " on" : ""}" data-finding="${esc(f.id)}">${sev(f.severity)}<span>${who(f.by)} · ${esc(f.id)} · ${inline(f.title)}</span></div>`).join("") : "") +
      talk.map(t => `<div class="ann" data-thread="${esc(t.id)}"><span class="tag">${t.messages[0].by === "agent" ? "✦" : "💬"} ${t.messages.length}</span><span>${noteTitle(t.messages[0].text)}</span></div>`).join("");
  }).join("")).join("");
  return `<div class="diffcard">${head}${banner}<div class="diffbody" data-diff="${esc(path)}">${body || '<div class="banner">No lines changed.</div>'}</div></div>`;
}
// A line's findings as dots beside its number, worst first; the list behind them shows on hover, and a click opens it.
function gutter(here, key) {
  if (!here.length) return `<span class="gd"></span>`;
  const worst = [...here].sort((a, b) => SEVS.indexOf(a.severity) - SEVS.indexOf(b.severity));
  return `<span class="gd" data-gutter="${esc(key)}">${worst.slice(0, 4).map(f => `<i class="${f.severity.split("-")[0]}"></i>`).join("")}` +
    `${worst.length > 4 ? `<em class="more">+${worst.length - 4}</em>` : ""}<span class="gl">${worst.map(f =>
      `<div>${sev(f.severity)}<b>${esc(f.id)}</b> ${inline(f.title)}</div>`).join("")}<div class="hint">click to open them under the line</div></span></span>`;
}
function sevCounts(list) {
  const n = k => list.filter(f => f.severity === k).length;
  return list.length ? `<span class="sevn" title="Findings in this file">${SEVS.filter(n).map(k => `<i class="gd-${k}" style="background:var(--${k.split("-")[0] === "nit" ? "nit-dot" : k.split("-")[0]})"></i>${n(k)}`).join("")}</span>` : "";
}
// Files under their folders, the folders shortened: the common root once, a long folder as its first and last two parts.
function fileList(paths, selected, opts = {}) {
  const root = commonRoot();
  const folder = p => {
    const rel = p.startsWith(root) ? p.slice(root.length) : p, parts = rel.split("/").slice(0, -1);
    return parts.length ? (parts.length > 3 ? [parts[0], "…", ...parts.slice(-2)] : parts).join("/") + "/" : root ? "./" : "project root";
  };
  const groups = new Map();
  paths.forEach(p => { const d = folder(p); groups.has(d) || groups.set(d, []); groups.get(d).push(p); });
  return (root ? `<div class="dim" style="font-size:11.5px;margin:0 0 2px 6px" title="${esc(root)}">in …/${esc(root.split("/").filter(Boolean).pop() || "")}/</div>` : "") +
    [...groups].map(([d, ps]) => `<div class="pdir">${esc(d)}</div>` + ps.map(p => {
      const f = fileInfo(p), shared = f["use-cases"].length > 1;
      return `<div class="pf${p === selected ? " on" : ""}${f.change === "deleted" ? " del" : ""}" data-pick-file="${esc(p)}" title="${esc(p)}">` +
        `<span class="vbox${f.viewed ? " on" : ""}" data-view="${esc(p)}">${f.viewed ? "✓" : ""}</span><span class="kd ${f.change}">${KIND[f.change] || "~"}</span>` +
        `<span class="pfmain"><span class="nm">${esc(p.split("/").pop())}</span>${findingsAt(p).some(x => x.status !== "sent") ? dotsOf(findingsAt(p).filter(x => x.status !== "sent")) : ""}</span>` +
        `${shared ? '<span class="dim" title="in more than one use case">⇄</span>' : ""}</div>`;
    }).join("")).join("") +
    `<div class="klegend"><span class="kd added">+</span> added <span class="kd modified">~</span> modified <span class="kd deleted">−</span> deleted${opts.shared ? ' <span class="dim">⇄</span> in more than one use case' : ""}</div>`;
}

// ================================================================ code
const codeFiles = () => (R.files || []).filter(f => ui.codeFilter === "all" || (ui.codeFilter === "unviewed" ? !f.viewed : findingsAt(f.path).length));
function viewCode() {
  const files = R.files || [], shown = codeFiles();

// A note opens with a bold heading; that heading, or else its first sentence, names it in a list.

// The diff may still be loading: the line is looked for a few times, then scrolled to and lit for a moment.

// A click opens the use case beside the cards; another card reloads the panel in place; the same card closes it.

// ================================================================ render
function busy() {

    (getSelection().toString() !== "" && !["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName));
}
function render() {

  document.querySelectorAll("input[id], textarea[id]").forEach(el => typed[el.id] = [el.value, el.selectionStart, el.selectionEnd]);

  const y = main.scrollTop, py = panel.scrollTop, sy = side.scrollTop;

  else if (!R) main.innerHTML = `<h1>${esc(current.id)}</h1><div class="card pending" style="margin-top:20px"><h3><span>Step 1 of ${STEPS.length} · Open the review</span></h3>

// ================================================================ actions

const stepIn = (list, at, by) => list[Math.min(list.length - 1, Math.max(0, list.indexOf(at) + by))];

const CLICKABLE = ["tab", "inline", "gutter", "goto", "finding", "thread", "close-panel", "edit", "save", "status", "set-sev", "resolve", "compose", "view", "pick-file",
  "open-file", "step-file", "step-uc", "code-filter", "fsev", "fby", "fquestions", "fstatus", "answer", "live", "refresh", "send", "power",
  "close-review", "uccard", "close-uc", "ask-uc", "open-review", "archive", "new", "archived", "unarchive", "start", "pop", "new-finding",

  }
  if (d.send !== undefined) {
    const marked = S().findings.filter(f => f.status === "to-send");
    if (!confirm(`Send ${marked.length} comment(s) to ${sourceLabel(S().source)}?\n\n` + marked.map(f => `${f.id} ${f.title}`).join("\n") +
      "\n\nComments on GitHub cannot be taken back from here.")) return;
    toast("sending…");
    const out = await api("/api/review/send", K());
    if (out) toast(`sent ${out.sent.length}` + (out.errors.length ? ` · problems: ${out.errors.join("; ")}` : ""));
    return reload();
  }
  if (d.uccard) return openUseCase(d.uccard);
  if (d.closeUc !== undefined) return openUseCase(ui.uc);
  if (d.askUc) { ui.panel = { ask: { about: { kind: "use-case", id: d.askUc }, quote: null } }; return render(); }
  if (d.openReview !== undefined) {
    const r = reviewsList.filter(x => !x.archived)[+d.openReview];
    document.getElementById("hover").style.display = "none";
    return go({ project: r.project, id: r.id, ui: { tab: "overview" } });
  }
  if (d.archive !== undefined) {
    const r = reviewsList.filter(x => !x.archived)[+d.archive];
    document.getElementById("hover").style.display = "none";
    const ok = await api("/api/review/change", { project: r.project, id: r.id, action: "archive", archived: true });
    if (ok && r.id === current.id && r.project === current.project) { current = { project: null, id: null }; R = null; }
    return reload();
  }
  if (d.unarchive) {
    const [project, id] = d.unarchive.split("|");
    return api("/api/review/change", { project, id, action: "archive", archived: false }).then(() => go({ project, id, ui: { tab: "overview" } }));
  }
  if (d.new !== undefined) { ui.tab = "new"; ui.panel = null; return render(); }
  if (d.archived !== undefined) { ui.tab = "archived"; ui.panel = null; return render(); }
  if (d.start !== undefined) {
    const body = { project: document.getElementById("nr-project").value.trim(), source: document.getElementById("nr-source").value.trim() };
    if (!projects.includes(body.project) && !await api("/api/projects", { path: body.project })) return;
    const out = await api("/api/review/start", body);
    if (out) go({ project: body.project, id: out.id, ui: { tab: "overview" } });
    return;
  }
  if (d.pop) {
    const s = ui.selection;
    getSelection().removeAllRanges(); hidePop();
    if (d.pop === "ask") ui.panel = { ask: { about: s.about, quote: s.quote } };
    if (d.pop === "finding") ui.panel = { newFinding: { path: s.about.path, lines: s.about.lines, side: s.side, quote: s.quote, severity: "should-fix" } };
    if (d.pop === "quote") { ui.editing = ui.panel.finding; render(); const box = document.getElementById("edit-comment"); box.value = `> ${s.quote}\n\n` + box.value; return box.focus(); }
    return render();
  }
  if (d.newFinding !== undefined) { const a = ui.panel.ask; ui.panel = { newFinding: { path: a.about.path, lines: a.about.lines, side: "RIGHT", quote: a.quote, severity: "should-fix" } }; return render(); }
  if (d.nfSev) { ui.panel.newFinding.severity = d.nfSev; return render(); }
  if (d.nfSave !== undefined) {
    const p = ui.panel.newFinding, fields = { title: document.getElementById("nf-title").value.trim(), comment: document.getElementById("nf-comment").value.trim(),
      severity: p.severity, locations: [{ path: p.path, line: p.lines[1], side: p.side || "RIGHT", commit: S().head }] };
    if (!(await change("add-finding", { fields }))) return;
    ui.selection = null; await reload();
    ui.panel = { finding: S().findings[S().findings.length - 1].id }; return render();
  }
});
document.addEventListener("change", e => { if (e.target.id === "fcat") { ui.fcat = e.target.value; render(); } });
document.addEventListener("input", e => { if (e.target.id === "fsearch") { ui.search = e.target.value; render(); } if (e.target.id.startsWith("nr-")) checkNew(); });
document.addEventListener("keydown", e => {
  if (e.target.id === "compose" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.querySelector("[data-compose]")?.click(); }
  if (e.key === "Escape") { hidePop(); if (ui.uc) openUseCase(ui.uc); }
});
document.addEventListener("selectionchange", () => { if (deferred && !busy()) render(); });
document.addEventListener("focusout", () => setTimeout(() => { if (deferred && !busy()) render(); }, 0));
// Selecting lines of a diff, or words of a finding's text, offers to ask AI Agent about them.
document.addEventListener("mouseup", e => {
  if (e.target.closest("#pop")) return;
  setTimeout(() => {
    const sel = getSelection(), text = sel.toString().trim();
    if (!text || !sel.rangeCount) return;
    const range = sel.getRangeAt(0), node = n => n.nodeType === 1 ? n : n.parentElement;
    const start = node(range.startContainer), end = node(range.endContainer);
    const pop = document.getElementById("pop"), at = range.getBoundingClientRect();
    const diff = start && start.closest("[data-diff]"), about = start && start.closest("[data-quote-about]");
    if (diff && end && end.closest("[data-diff]") === diff && start.closest(".ln") && end.closest(".ln")) {
      const rows = [start.closest(".ln"), end.closest(".ln")], side = rows[0].dataset.side;
      const first = Math.min(...rows.map(r => +r.dataset.line)), last = Math.max(...rows.map(r => +r.dataset.line));
      ui.selection = { path: diff.dataset.diff, lines: [first, last], side, quote: text, about: { kind: "file", path: diff.dataset.diff, lines: [first, last] } };
      diff.querySelectorAll(".ln").forEach(l => l.classList.toggle("sel", l.dataset.side === side && +l.dataset.line >= first && +l.dataset.line <= last));
      pop.innerHTML = `<button class="btn go sm" data-pop="ask">✦ Ask AI Agent</button><button class="btn ghost sm" data-pop="finding">Add finding</button>`;
    } else if (about) {
      const [kind, id] = about.dataset.quoteAbout.split(":");
      ui.selection = { quote: text, about: { kind, id } };
      pop.innerHTML = `<button class="btn go sm" data-pop="ask">✦ Ask AI Agent</button>` + (kind === "finding" ? `<button class="btn ghost sm" data-pop="quote">Quote in comment</button>` : "");
    } else return;
    pop.style.display = "flex";
    pop.style.left = Math.min(innerWidth - 260, Math.max(8, at.right - 200)) + "px";
    pop.style.top = Math.max(8, at.top - 44) + "px";
  }, 0);
});
document.addEventListener("mouseover", e => {
  const tile = e.target.closest("[data-hoverr]");
  if (tile) return showHover(+tile.dataset.hoverr, tile);
  if (!e.target.closest("#hover") && !e.target.closest(".rail")) document.getElementById("hover").style.display = "none";
  const dots = e.target.closest("[data-gutter]"), gtip = document.getElementById("gtip");
  if (dots && !dots.closest(".ln.open") && !ui.inline) {
    const at = dots.getBoundingClientRect();
    gtip.innerHTML = dots.querySelector(".gl").innerHTML; gtip.style.display = "block";
    gtip.style.left = at.left + "px"; gtip.style.top = Math.min(at.bottom + 4, innerHeight - gtip.offsetHeight - 8) + "px";
  } else gtip.style.display = "none";
  const card = e.target.closest("[data-uccard]"), tip = document.getElementById("tip");
  if (card) return showTip(card);
  if (tip && tip.style.display === "block") { tip.style.display = "none"; document.querySelectorAll(".uc.related").forEach(x => x.classList.remove("related")); }
});
// The side panel's left edge resizes it; the width survives a reload.
const WIDTH_KEY = "craftsman.review.panel-width";
if (localStorage.getItem(WIDTH_KEY)) document.getElementById("app").style.setProperty("--panel-w", localStorage.getItem(WIDTH_KEY));
document.addEventListener("mousedown", e => {
  if (e.target.id !== "grip") return;
  e.preventDefault();
  const grip = e.target; grip.classList.add("drag");
  const move = ev => { const w = Math.min(Math.max(innerWidth - ev.clientX, 380), innerWidth * .7) + "px";
    document.getElementById("app").style.setProperty("--panel-w", w); localStorage.setItem(WIDTH_KEY, w); };
  const up = () => { grip.classList.remove("drag"); removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);
});
addEventListener("resize", () => { layoutCards(false); ucPanel(); placePanel(); });
document.getElementById("main").addEventListener("scroll", placePanel);
const events = new EventSource("/api/events");
events.addEventListener("hello", () => reload());
events.addEventListener("change", () => reload());
</script>
</body>
