  return c ? `<div class="thread">${ghHead(c)}${c.body ? `<div class="md">${md("github:" + c.id)}</div>` : ""}</div>` : `<div class="muted" style="padding-top:12px">This comment is not on GitHub any more.</div>`;

// ================================================================ the side panel
function panelFinding(id) {
  const f = S().findings.find(x => x.id === id); if (!f) return `<div class="muted">No finding ${esc(id)}.</div>`;

    : (f.status === "to-send" ? `<button class="btn sm" data-status="proposed">✓ Marked to send</button>` : `<button class="btn go sm" data-status="to-send">Mark to send</button>`) +

    ${f.status === "maybe-resolved" ? `<div class="banner" style="margin:12px 0 0">AI Agent no longer sees this problem at the PR's head. Drop it, or keep it.</div>` : ""}

    ${snippet ? `<div class="box"><div class="l"><span class="mono">${esc(loc.path)}</span><a style="color:var(--neon)" data-open-file="${esc(loc.path)}">Open in Code →</a></div>${snippet}</div>` : ""}
    <div class="box"><div class="l"><span>Draft comment to the author</span>${sent || editing ? "" : `<a data-edit="${esc(f.id)}">Edit</a>`}</div>
      ${editing ? `<textarea class="field" id="edit-comment" style="min-height:140px">${esc(f.comment)}</textarea>` : `<div class="md">${md(`finding:${f.id}:comment`)}</div>`}</div>
    <div class="row-actions">${actions}${f.status === "deleted" ? "" : `<span class="in-prompt" data-in-prompt="${esc(f.id)}" title="Whether the fix prompts ask the author's AI agent to fix this one">
      <span class="switch${f["in-prompt"] === false ? "" : " on"}"><i></i></span>In fix prompt</span>`}</div>
    ${sentAs(f).filter(root => ghThreads().has(root)).map(root => `<div class="box"><div class="l">On GitHub</div>${ghThreadMessages(root, ghThreads().get(root))}</div>`).join("")}`;

// ================================================================ the AI Agent panel: what it is about
// The panel stands beside every tab of a review and is about one thing, its context: what is picked in the tab, or
// the whole PR when nothing is. Each tab keeps its own; on the Code tab a pin keeps it while the developer moves around.
const PR = { kind: "review" };

// Whether a thread about `about` belongs to the context `ctx`: the same thing, and for a file the same lines, or none.
function aboutContext(about, ctx) {
  if (about.kind !== ctx.kind) return false;
  if (ctx.kind === "file" || ctx.kind === "folder") return about.path === ctx.path && JSON.stringify(about.lines || null) === JSON.stringify(ctx.lines || null);
  return ctx.kind === "review" || about.id === ctx.id;
}
// The panel's tabs: "Finding" only where a finding can be written (a folder, a file, lines) or is shown.
function panelTabs(ctx) {

}
// The draft a context writes: by its file's path, or its folder's (which ends with "/").
function draftKey(ctx) {
  return ctx.kind === "file" || ctx.kind === "folder" ? ctx.path : null;
}
function ctx() {
  const own = ui.ctxBy[ui.tab];

  if (ui.tab === "findings") {
    const first = sorted(S().findings.filter(STATUS.open))[0];
    return own && S().findings.some(f => f.id === own.id) ? own : first ? { kind: "finding", id: first.id } : PR;
  }

}
// The developer picked something: it becomes the context of the tab, unless the Code tab's context is pinned. A finding

function setCtx(c, ptab) {

const lineSpan = lines => lines ? `${lines[0]}${lines[1] !== lines[0] ? "–" + lines[1] : ""}` : "";

  if (c.kind === "github") { const m = conversation().find(x => x.id === c.id) || {}; return ["GitHub", `${m.author || "comment"}: ${(m.body || "").slice(0, 80)}`, false]; }
  if (c.kind === "directive") return ["Rule", c.id, true];

// the files the PR leaves as they are, each { path, declaration }: read once per review, when "Unchanged files" is first

const changed = path => (R.files || []).some(f => f.path === path);

const fcount = (list, title) => list.length ? `<span class="fcount ${worstOf(list)}" title="${esc(title)}">${list.length}</span>` : "";
// The files the tree shows: the changed files the filter lets through, and with "Unchanged files" on, the rest.
function treePaths() {
  const files = (R.files || []).filter(f => ui.codeFilter === "all" || (ui.codeFilter === "unviewed" ? !f.viewed : openFindings(f.path).length));
  return files.map(f => f.path).concat(ui.unchanged && ui.codeFilter === "all" ? (unchangedFiles || []).map(f => f.path) : []);

const treeFiles = () => treeRows(treePaths(), []).filter(r => r.type === "file").map(r => r.path);
function treeHtml() {
  const hits = new Set(searchHits(treePaths(), ui.tsearch || ""));
  const rows = treeRows(treePaths(), [...closedFolders()]);
  // a cursor inside a closed folder moves to the closed folder, or to the first row
  if (!rows.some(r => r.path === ui.cursor)) ui.cursor = rows.some(r => r.path === ui.file) ? ui.file
    : (rows.filter(r => r.type === "dir" && (ui.file || "").startsWith(r.path + "/")).pop() || rows[0] || {}).path;
  if (!rows.length) return `<div class="muted" style="padding:8px 14px">No file matches the filter.</div>`;
  return rows.map(r => {
    const pad = `style="padding-left:${6 + r.depth * 14}px"`, base = ["trow", r.path === ui.cursor ? "cursor" : "", hits.has(r.path) ? "hit" : ""];
    if (r.type === "dir") {
      const closed = closedFolders().has(r.path);
      return `<div class="${base.join(" ")}" ${pad} data-row="${esc(r.path)}" data-type="dir" role="treeitem" aria-level="${r.depth + 1}" aria-expanded="${!closed}" title="${esc(r.path)}">` +
        `<span class="chev${closed ? " closed" : ""}" data-chev="${esc(r.path)}">▼</span>${folderIcon(r.root)}<span class="nm">${esc(r.name)}</span>` +
        `<span class="right">${closed ? fcount(findingsUnder(r.path), "findings inside") : ""}</span></div>`;
    }
    const f = (R.files || []).find(x => x.path === r.path), declaration = (f || (unchangedFiles || []).find(x => x.path === r.path) || {}).declaration;
    const cls = [...base, r.path === ui.file ? "open" : "", f ? (f.change === "deleted" ? "removed" : "") : "same"].join(" ");
    return `<div class="${cls}" ${pad} data-row="${esc(r.path)}" data-type="file" role="treeitem" aria-level="${r.depth + 1}" aria-selected="${r.path === ui.file}" title="${esc(r.path)}">` +
      `<span class="chev"></span>${fileIcon(r.path, declaration)}<span class="vis">${declaration && declaration.visibility ? VISIBILITY[declaration.visibility] : ""}</span>` +
      `<span class="nm">${esc(r.name)}</span><span class="right">${fcount(openFindings(r.path), "findings in this file")}` +
      (f ? changeIcon(f.change, f.from) + `<span class="seen" data-view="${esc(r.path)}">${seenIcon(f.viewed)}</span>` : "") + `</span></div>`;

// a row of the tree as the panel's context: a folder's path ends with "/"
const rowCtx = (path, type) => type === "dir" ? { kind: "folder", path: path + "/" } : { kind: "file", path };
function toggleFolder(path) {
  const closed = closedFolders();
  closed.has(path) ? closed.delete(path) : closed.add(path);
  keepClosed(closed);
}
function focusTree() {
  const tree = document.getElementById("tree"); if (!tree) return;
  tree.focus({ preventScroll: true }); keepCursorInView(tree);
}
// The tree's keys, as IntelliJ's: moving opens the file the cursor lands on and the focus stays in the tree; Enter goes
// into the file's diff, or opens or closes a folder; → and ← open and close a folder, or step to its first file and back
// to its folder; Space marks the file viewed.
function treeKey(e) {
  const rows = [...document.querySelectorAll("#tree .trow")], i = rows.findIndex(r => r.dataset.row === ui.cursor), row = rows[i];
  const dir = row && row.dataset.type === "dir", open = dir && !closedFolders().has(ui.cursor);
  const to = j => {
    if (!rows[j]) return;
    ui.cursor = rows[j].dataset.row;
    if (rows[j].dataset.type === "file") ui.file = ui.cursor;
    setCtx(rowCtx(ui.cursor, rows[j].dataset.type)); go({}); focusTree();
  };
  const fold = () => { toggleFolder(ui.cursor); render(); focusTree(); };
  switch (e.key) {
    case "ArrowDown": return to(i + 1), true;
    case "ArrowUp": return to(Math.max(i - 1, 0)), true;
    case "ArrowRight": return dir && !open ? fold() : to(i + 1), true;
    case "ArrowLeft": {
      if (dir && open) return fold(), true;
      const level = +(row?.getAttribute("aria-level") || 1);
      for (let j = i - 1; j >= 0; j--) if (+rows[j].getAttribute("aria-level") < level) return to(j), true;
      return true;
    }
    case "Enter":
      if (dir) return fold(), true;
      if (narrow(899)) drawer("tree", false);
      document.querySelector(`.diffbody[data-diff="${CSS.escape(ui.file)}"]`)?.focus();
      return true;
    case " ":
      if (row && !dir && changed(ui.cursor)) toggleViewed(ui.cursor);
      return true;
    case "+":
      keepClosed(new Set()); render(); focusTree(); return true;
    case "-":
      keepClosed(new Set(treeRows(treePaths(), []).filter(r => r.type === "dir").map(r => r.path))); render(); focusTree(); return true;
  }
  return false;
}

// ================================================================ code
function viewCode() {

    <div style="margin-top:10px"><button class="btn ghost" data-refresh title="Refresh PR: read it again from GitHub">⟳ Refresh PR</button></div></div>`;
  if (ui.unchanged) readUnchanged();

  if (!ui.file || !(changed(ui.file) || (ui.unchanged && (unchangedFiles || []).some(f => f.path === ui.file))))
    ui.file = order.find(p => files.some(f => f.path === p && !f.viewed)) || order[0];

  const chip = (k, l, n) => `<button class="chip${ui.codeFilter === k ? " on" : ""}" data-code-filter="${k}">${l} <b>${n}</b></button>`;
  return `<div class="codegrid">
    <div class="treebox"><div class="treetop">
      <div class="treehead"><span>Viewed <b>${viewed}</b> of ${files.length}</span><span class="grow"></span>
        <button class="btn ghost sm" data-tree-all="open" title="Expand all">⊞</button><button class="btn ghost sm" data-tree-all="close" title="Collapse all">⊟</button></div>
      <div class="progress"><i style="width:${files.length ? 100 * viewed / files.length : 0}%"></i></div>
      <div class="filters">${chip("all", "All", files.length)}${chip("unviewed", "Not viewed", files.length - viewed)}${chip("findings", "With findings", files.filter(f => openFindings(f.path).length).length)}
        <span class="switch${ui.unchanged ? " on" : ""}" data-unchanged title="Also the files the PR leaves as they are"><i></i>Unchanged files</span></div></div>
      ${ui.tsearch !== null ? `<div class="tsearch"><input class="field" id="tree-search" data-no-dictation placeholder="Find a file (resd → ReserveDesk)" autocomplete="off" aria-label="Find a file"></div>` : ""}
      <div id="tree" tabindex="0" role="tree" aria-label="Files">${treeHtml()}</div>
      <div class="legend"><span>${changeIcon("added")}added</span><span>${changeIcon("modified")}modified</span><span>${changeIcon("deleted")}removed</span><span>${changeIcon("renamed")}moved</span><span>${seenIcon(true)}viewed</span></div></div>
    <div id="tree-grip" title="Drag to resize the tree"></div>
    <div class="codediff">${ui.file ? diffView(ui.file, at < 0 ? "" : `file ${at + 1} of ${order.length} &nbsp;<a data-step-file="-1">← prev</a> · <a data-step-file="1" style="color:var(--neon)">next →</a>`) : '<div class="muted">No changed files.</div>'}</div></div>`;

// A note opens with a bold heading; that heading, or else its first sentence, names it in a list.
function noteTitle(text) {
  const head = text.match(/^\s*\*\*(.+?)\*\*/);

// The diff may still be loading: the line is looked for a few times, then scrolled to and lit for a moment.
function showLine(path, n, tries = 20) {
  const body = [...document.querySelectorAll(".diffbody")].find(x => x.dataset.diff === path && x.offsetParent);
  const line = body && (body.querySelector(`.ln[data-line="${n}"][data-side="RIGHT"]`) || body.querySelector(`.ln[data-line="${n}"]`));
  if (!line) return tries && setTimeout(() => showLine(path, n, tries - 1), 100);

// ================================================================ rules

}

      <div style="min-width:0"><div><b class="rid">${esc(d.id)}</b>${d.bundle ? ` <span class="tag">${esc(d.bundle)}</span>` : ""}${d.on !== d.default ? ` <span class="muted" style="font-size:.75rem">${d.on ? "on for this review only" : "off for this review only"}</span>`
          : d.default !== d.enabled ? ` <span class="muted" style="font-size:.75rem">${d.on ? "on in your review set" : "off in your review set"}</span>` : ""}</div>
        <div class="muted" style="font-size:.8125rem">${esc(d.title)} · <span title="${d.scoped ? "From the code-review bundle's directive-scope.md" : "No row in the code-review bundle's directive-scope.md"}"${d.scoped ? "" : ' style="color:var(--should)"'}>${esc(howChecked(d))}${d.scoped ? "" : ", no row"}</span></div></div>
      <span class="cks">${places.map(u => cell(d, u)).join("")}</span>

      <span>${missing.length ? `<button class="btn ghost sm" data-directive-check="${esc(d.id)}" title="Check ${esc(missing.map(u => u.name).join(", "))}">Check now</button>` : ""}</span></div>`;

      ${all.some(d => d.on !== d.default) ? `<button class="btn ghost sm" data-directive-default title="New and open reviews check this set unless switched for one review">Make this set the default for every review</button>` : ""}

    <div class="card" style="padding:6px 20px">${shown.map(row).join("") || '<div class="muted" style="padding:14px 0">No directive matches.</div>'}</div>

// ================================================================ new and archived reviews
// The new-review wizard: what is reviewed, then where its code is read from. `ui.nr` holds what is filled in, so a
// refresh of the page never loses it; the checkout is checked by the server as it is typed or picked.
// a pull request on github.com or on a GitHub Enterprise host: https://<host>/<owner>/<repo>/pull/<number>
const PR_URL = /^https:\/\/([^/\s]+)\/([^/\s]+)\/([^/\s]+)\/pull\/\d+\/?$/, BRANCH = /^[^\s:]+$/;
function newReview() {
  return { kind: "pr", url: "", target: "", source: "", how: "clone", path: "", context: "", check: null, starting: false };
}
function nrSource() {
  const n = ui.nr;
  return n.kind === "pr" ? n.url.trim() : `${n.target.trim()}:${n.source.trim()}`;
}
const nrNeedsPath = () => ui.nr.kind === "branches" || ui.nr.how === "mine";
function nrReady() {
  const n = ui.nr, path = !nrNeedsPath() || (n.check && ["ok", "warn"].includes(n.check.state) && n.check.for === n.path.trim());
  const what = n.kind === "pr" ? PR_URL.test(n.url.trim()) : BRANCH.test(n.target.trim()) && BRANCH.test(n.source.trim());
  return what && path && !n.starting;
}
function viewNew() {
  const n = ui.nr, repo = (n.url.trim().match(PR_URL) || []).slice(2, 4).join("/") || "<owner>/<repo>";
  const chip = (attr, value, on, label) => `<a class="chip${on ? " on" : ""}" data-${attr}="${value}">${label}</a>`;
  const known = [...new Set(reviewsList.map(r => r.checkout).filter(c => c && !c.startsWith("/tmp/craftsman/")))];
  const pathField = `<div style="display:flex;gap:8px;margin-top:10px">
      <input class="field" id="nr-path" data-no-dictation list="nr-paths" value="${esc(n.path)}" placeholder="/path/to/the/repository" style="flex:1">
      <button class="btn" data-nr-browse>Browse…</button></div>
    <datalist id="nr-paths">${known.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    <div class="nr-status" id="nr-status"></div>`;
  return `<div class="card wiz" style="max-width:720px"><h3><span>New review</span></h3>
    <div class="wstep"><div class="wn">1</div><div class="grow"><div class="wl">What is reviewed</div>
      <div class="chips">${chip("nr-kind", "pr", n.kind === "pr", "A pull request")}${chip("nr-kind", "branches", n.kind === "branches", "Two branches of a local repository")}</div>
      ${n.kind === "pr" ? `<input class="field" id="nr-url" data-no-dictation value="${esc(n.url)}" placeholder="https://github.com/org/repo/pull/123" style="margin-top:10px">
        <div class="nr-status" id="nr-url-status"></div>`
        : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
          <label class="muted wsub">Target, merged into<input class="field" id="nr-target" data-no-dictation value="${esc(n.target)}" placeholder="main"></label>
          <label class="muted wsub">Source, under review<input class="field" id="nr-source" data-no-dictation value="${esc(n.source)}" placeholder="feature/cancel-reservation"></label></div>`}
    </div></div>
    <div class="wstep"><div class="wn">2</div><div class="grow"><div class="wl">Where its code is read from</div>

        ${n.how === "clone" ? `<div class="muted wnote">A partial clone in <code id="nr-clone-to">/tmp/craftsman/repos/${esc(repo)}/</code> — only the files the review reads are

          : `<div class="muted wnote">The top folder of a git checkout of the pull request's repository. The review reads the code from its own
          worktree, so your branch and your changes are never touched.</div>${pathField}`}`

// what the wizard says when the review it would start exists already, archived or not
function existingReview() {

    <div class="row-actions">${e.archived ? `<button class="btn go sm" data-nr-existing="back">Bring it back</button>`
      : `<button class="btn go sm" data-nr-existing="open">Open it</button>`}
      <button class="btn ghost sm" data-nr-existing="over">Start it over</button>
      <span class="muted" style="font-size:.75rem">Starting it over deletes its findings and answers.</span></div></div>`;
}
// what changes as the developer types: the checkout's status and the start button, without redrawing the fields
function paintNew() {
  const start = document.querySelector("[data-start]"), status = document.getElementById("nr-status"), n = ui.nr;
  if (start) {
    start.disabled = !nrReady();
    start.textContent = n.starting ? (n.kind === "pr" && n.how === "clone" ? "Cloning the repository…" : "Starting…") : "Start the review";
  }
  const to = document.getElementById("nr-clone-to"), repo = (n.url.trim().match(PR_URL) || []).slice(2, 4).join("/");
  if (to) to.textContent = `/tmp/craftsman/repos/${repo || "<owner>/<repo>"}/`;
  const urlStatus = document.getElementById("nr-url-status");
  if (urlStatus) {
    const wrong = n.url.trim() && !PR_URL.test(n.url.trim());
    urlStatus.className = "nr-status" + (wrong ? " error" : "");
    urlStatus.textContent = wrong ? "Not a pull request URL — it looks like https://<host>/<owner>/<repo>/pull/<number>" : "";
  }
  if (!status) return;
  const c = n.check && n.check.for === n.path.trim() ? n.check : null;
  status.className = "nr-status" + (c ? " " + c.state : "");

    : c.state === "ok" ? "✓ A git repository" + (c.checkout !== n.path.trim().replace(/\/+$/, "") ? `, read from <code>${esc(c.checkout)}</code>` : "")
    : c.state === "warn" ? `⚠ ${esc(c.text)}. Start anyway, or pick another checkout.` : esc(c.text);
}
let nrTimer;
function nrCheck() {
  clearTimeout(nrTimer);
  const path = ui.nr.path.trim();
  if (!path || !nrNeedsPath()) return paintNew();
  ui.nr.check = { state: "checking", for: path }; paintNew();
  nrTimer = setTimeout(async () => {
    const r = await fetch("/api/checkout/check", { method: "POST", headers: { "Content-Type": "application/json", "X-Craftsman": "1" },
      body: JSON.stringify({ path, source: nrSource() }) });
    const out = await r.json().catch(() => ({ error: "no answer from the server" }));
    if (ui.nr.path.trim() !== path) return;
    ui.nr.check = r.ok ? { state: out.warning ? "warn" : "ok", text: out.warning, checkout: out.checkout, for: path }
      : { state: "error", text: out.error || "failed", for: path };
    paintNew();
  }, 350);
}

if (localStorage.getItem(WIDTH_KEY)) document.getElementById("app").style.setProperty("--panel-w", localStorage.getItem(WIDTH_KEY));
document.addEventListener("mousedown", e => {
  if (e.target.id !== "grip") return;
  e.preventDefault();
  const grip = e.target; grip.classList.add("drag");
  const move = ev => { const w = Math.min(Math.max(innerWidth - ev.clientX - 16, 360), innerWidth * .6) + "px";
    document.getElementById("app").style.setProperty("--panel-w", w); localStorage.setItem(WIDTH_KEY, w); };
  const up = () => { grip.classList.remove("drag"); removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);

// The tree's right edge resizes it; the width survives a reload.
const TREE_WIDTH_KEY = "craftsman.review.tree-width";
if (localStorage.getItem(TREE_WIDTH_KEY)) document.getElementById("app").style.setProperty("--tree-w", localStorage.getItem(TREE_WIDTH_KEY));
document.addEventListener("mousedown", e => {
  if (e.target.id !== "tree-grip") return;
  e.preventDefault();
  const grip = e.target, left = document.querySelector(".treebox").getBoundingClientRect().left; grip.classList.add("drag");
  const move = ev => { const w = Math.min(Math.max(ev.clientX - left, 240), innerWidth * .5) + "px";
    document.getElementById("app").style.setProperty("--tree-w", w); localStorage.setItem(TREE_WIDTH_KEY, w); };
  const up = () => { grip.classList.remove("drag"); removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
  addEventListener("mousemove", move); addEventListener("mouseup", up);

// ================================================================ dictation
// A microphone button next to the text box being written in: the recording goes to the dashboard, which has the speech
// engine on this machine transcribe it, and the text goes in at the caret -- see REVIEW.md, "Dictation". Nothing is
// sent anywhere else, and nothing is ever sent or submitted for the developer: they read the text first.
const DICTABLE = "textarea[id]:not([data-no-dictation]), input.field[id]:not([type]):not([data-no-dictation])";
const DICTATION_LANG_KEY = "craftsman.review.dictation-language";
// Recording and upload, on their own so the tests can run them with fakes: `env` gives the microphone (`media`), the
// recorder (`Recorder`, `Blob`), the clock (`now`, `setTimeout`, `clearTimeout`), the loudness so far (`meter`), the
// upload (`post`), the engine's warm-up (`warm`), and where states (`onState`) and the text (`onText`) go.
function makeDictation(env) {
  const MAX = env.maxMs || 59000, MIN = env.minMs || 600, QUIET = env.silence || 0.02;
  let type = null;
  let state = "idle", stream = null, rec = null, chunks = [], started = 0, stopTimer = null, peak = null, discard = false, job = null;
  const set = (next, info) => { state = next; env.onState(next, info || {}); };
  const release = () => {
    if (stopTimer) env.clearTimeout(stopTimer);
    stopTimer = null;
    if (stream) stream.getTracks().forEach(track => track.stop());
    stream = null;
  };
  async function start(target, language) {
    if (state !== "idle" && state !== "error") return false;
    job = { target, language }; discard = false; chunks = [];
    // Opus in WebM (Chrome, Edge), else in Ogg (Firefox may only have that)
    type = env.Recorder && ["audio/webm;codecs=opus", "audio/ogg;codecs=opus"].find(t => env.Recorder.isTypeSupported(t));
    if (!type) {
      set("error", { kind: "format", message: "This browser cannot record Opus audio; dictation needs Chrome, Edge or Firefox." });
      return false;
    }
    set("asking");
    try { stream = await env.media.getUserMedia({ audio: true }); }
    catch (err) {
      set("error", { kind: "permission", message: err && err.name === "NotAllowedError"
        ? "The microphone is blocked for this page: allow it in the browser's site settings, then try again."
        : "No microphone could be opened." });
      return false;
    }
    if (discard) { release(); set("idle", { note: "Dictation cancelled." }); return false; }
    peak = env.meter ? env.meter(stream) : null;
    rec = new env.Recorder(stream, { mimeType: type });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => finish();
    started = env.now();
    rec.start(250);
    stopTimer = env.setTimeout(stop, MAX);
    set("recording", { started });
    if (env.warm) env.warm();
    return true;
  }
  function stop() { if (state === "recording" && rec && rec.state !== "inactive") rec.stop(); }
  function cancel() {
    if (state === "asking") discard = true;
    else if (state === "recording") { discard = true; stop(); }
  }
  async function finish() {
    const took = env.now() - started, heard = peak ? peak() : 1;
    release(); rec = null;
    if (discard) return set("idle", { note: "Dictation cancelled; nothing was transcribed." });
    if (took < MIN) return set("idle", { note: "Too short to transcribe." });
    if (heard < QUIET) return set("idle", { note: "Nothing was heard: is the right microphone selected?" });
    const audio = new env.Blob(chunks, { type: type.split(";")[0] }); chunks = [];
    set("transcribing");
    for (let attempt = 0; ; attempt++) {
      let answer;
      try { answer = await env.post(`/api/dictate?language=${encodeURIComponent(job.language)}`, audio); }
      catch (err) { return set("error", { kind: "unreachable", message: "The dashboard did not answer; is it still running?" }); }
      const body = answer.body || {};
      if (answer.status === 429 && attempt === 0) { await new Promise(done => env.setTimeout(done, 1500)); continue; }
      if (answer.status !== 200) return set("error", { kind: body.kind || "failed", message: body.error || `Dictation failed (${answer.status}).` });
      if (!body.text) return set("idle", { note: "Nothing was recognised." });
      set("idle");
      return env.onText(body.text, job.target);
    }
  }
  return { start, stop, cancel, state: () => state, active: () => ["asking", "recording", "transcribing"].includes(state) };
}
// What goes in at the caret: the text as spoken, with a space from the words around it, none before punctuation.
function joinDictated(before, text, after) {
  let out = text.trim();
  if (before && !/\s$/.test(before)) out = " " + out;
  if (after && !/^[\s.,;:!?)]/.test(after)) out = out + " ";
  return out;
}
// The loudest sample heard so far, so a silent recording is not sent (Whisper makes words up from silence).
function micMeter(stream) {
  try {
    const audio = new AudioContext(), analyser = audio.createAnalyser(), buf = new Float32Array(2048);
    analyser.fftSize = 2048;
    audio.createMediaStreamSource(stream).connect(analyser);
    let loudest = 0;
    const every = setInterval(() => { analyser.getFloatTimeDomainData(buf); for (const v of buf) loudest = Math.max(loudest, Math.abs(v)); }, 100);
    return () => { clearInterval(every); audio.close(); return loudest; };
  } catch (_) { return null; }
}
// `var`: render() may ask about dictation before this part of the script has run
var micStatus = null, micField = null, micSaid = null, micClock = null, micLost = null, micLang = localStorage.getItem(DICTATION_LANG_KEY) || (/^pl/i.test(navigator.language) ? "pl" : "en");
var dictation = makeDictation({
  media: navigator.mediaDevices, Recorder: window.MediaRecorder, Blob, now: () => Date.now(), meter: micMeter,
  setTimeout: (fn, ms) => setTimeout(fn, ms), clearTimeout: t => clearTimeout(t),
  post: async (url, audio) => {
    const r = await fetch(url, { method: "POST", headers: { "X-Craftsman": "1", "Content-Type": audio.type }, body: audio,
      signal: AbortSignal.timeout(150000) });  // longer than the dashboard waits for the engine
    return { status: r.status, body: await r.json().catch(() => ({})) };
  },
  warm: () => api("/api/dictate/start", {}).then(s => { if (s) micStatus = s; }).catch(() => {}),
  onState: (state, info) => micShow(state, info),
  onText: (text, target) => micInsert(text, target),
});
// the field the button stands by: the one being dictated into, else the one with the focus
function micTarget() {
  if (dictation.active() && micField) return document.getElementById(micField.id);
  const el = document.activeElement;
  return el && el.matches && el.matches(DICTABLE) ? el : null;
}
function placeMic() {
  if (!dictation) return;
  const dock = document.getElementById("mic"), field = micTarget();
  const keep = dictation.active() || micSaid;
  if (!field && !keep) { dock.hidden = true; return; }
  if (field) micField = { id: field.id, start: field.selectionStart, end: field.selectionEnd };
  if (!micStatus) { micStatus = { state: "loading" }; fetch("/api/dictate").then(r => r.json()).then(s => { micStatus = s; placeMic(); }).catch(() => {}); }
  dock.hidden = false;
  dock.classList.toggle("off", micStatus.state === "unavailable" || micStatus.state === "installing");
  document.getElementById("mic-lang").textContent = micLang.toUpperCase();
  document.getElementById("mic-lang").setAttribute("aria-label", `Dictation language: ${micLang === "pl" ? "Polish" : "English"}; click to switch`);
  const anchor = field || document.getElementById(micField && micField.id);
  if (!anchor) return;
  const box = anchor.getBoundingClientRect(), h = dock.offsetHeight;
  dock.style.right = Math.max(4, innerWidth - box.right + 4) + "px";
  dock.style.top = Math.max(4, Math.min(box.bottom - h - 4, innerHeight - h - 4)) + "px";
}
function micSay(html, ms) {
  const say = document.getElementById("mic-say");
  say.innerHTML = html || "";
  micSaid = html || null;
  clearTimeout(say.timer);
  if (html && ms) say.timer = setTimeout(() => { micSaid = null; say.innerHTML = ""; placeMic(); }, ms);
  placeMic();
}
function micShow(state, info) {
  const dock = document.getElementById("mic"), button = document.getElementById("mic-btn");
  dock.dataset.state = state;
  clearInterval(micClock);
  button.setAttribute("aria-pressed", state === "recording" ? "true" : "false");
  button.setAttribute("aria-label", state === "recording" ? "Stop dictating and transcribe" : "Dictate");
  if (state === "recording") {
    const tick = () => micSay(`<b>● REC</b> ${Math.floor((Date.now() - info.started) / 1000)} s · ${MOD === "⌘" ? "⌥" : "Alt+"}M stops · Esc cancels`);
    tick(); micClock = setInterval(tick, 500);
  } else if (state === "asking") micSay("Waiting for the microphone…");
  else if (state === "transcribing") micSay(micStatus && micStatus.state !== "ready" && !micStatus.external ? "Starting the speech engine…" : "Transcribing…");
  else if (state === "error") micSay(esc(info.message), 9000);
  else micSay(info.note ? esc(info.note) : "", 4000);
  if (!dictation.active() && deferred) setTimeout(render, 0);
}
function micInsert(text, target) {
  const el = document.getElementById(target);
  if (!el || !el.isConnected) {
    micLost = text;
    return micSay(`The text box is gone. <button class="btn sm" data-mic-copy>Copy the text</button>`, 30000);
  }
  const live = document.activeElement === el, start = live ? el.selectionStart : micField.start, end = live ? el.selectionEnd : micField.end;
  el.focus();
  el.setSelectionRange(start, end);
  const words = joinDictated(el.value.slice(0, start), text, el.value.slice(end));
  // the browser's own insertion keeps Undo (Cmd/Ctrl+Z) working
  if (!document.execCommand("insertText", false, words)) {
    el.setRangeText(words, start, end, "end");
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
}
function micToggle(field) {
  if (dictation.state() === "recording") return dictation.stop();
  if (dictation.state() === "asking") return dictation.cancel();
  if (dictation.active()) return;
  if (micStatus && micStatus.state === "installing") return micSay("The dictation engine is being set up…", 4000);
  if (micStatus && micStatus.state === "unavailable") return micSay(esc(micStatus.problem) +
    (micStatus.setup ? ` <button class="btn sm" data-mic-setup>Set up…</button>` : ""), 20000);
  const target = field || document.getElementById(micField && micField.id);
  if (!target) return;
  micField = { id: target.id, start: target.selectionStart, end: target.selectionEnd };
  dictation.start(target.id, micLang);
}
async function micSetup() {
  if (!confirm("Set up dictation on this machine?\n\nIt downloads the speech engine and the Whisper small model, about 0.7 GB, into ~/.craftsman/dictation. Your recordings never leave this machine and are never stored.")) return;
  const started = await api("/api/dictate/setup", {}).catch(() => null);
  if (!started) return;
  micStatus = started;
  micSay("Setting up dictation… this takes a few minutes.");
  const poll = setInterval(async () => {
    micStatus = await fetch("/api/dictate").then(r => r.json()).catch(() => micStatus);
    if (micStatus.state === "installing") return;
    clearInterval(poll);
    micSay(micStatus.state === "unavailable" ? esc(micStatus.problem) : "Dictation is ready.", 8000);
  }, 3000);
}
document.getElementById("mic").addEventListener("mousedown", e => e.preventDefault());  // the caret stays in the field
document.getElementById("mic").addEventListener("click", e => {
  if (e.target.closest("#mic-btn")) return micToggle(null);
  if (e.target.closest("#mic-lang")) {
    if (dictation.active()) return;
    micLang = micLang === "pl" ? "en" : "pl"; localStorage.setItem(DICTATION_LANG_KEY, micLang); return placeMic();
  }
  if (e.target.closest("[data-mic-setup]")) return micSetup();
  if (e.target.closest("[data-mic-copy]") && micLost) navigator.clipboard.writeText(micLost).then(() => micSay("Copied.", 3000));
});
document.addEventListener("focusin", () => placeMic());
document.addEventListener("focusout", () => setTimeout(placeMic, 0));
document.addEventListener("scroll", () => { if (!document.getElementById("mic").hidden) placeMic(); }, true);
addEventListener("resize", () => placeMic());
// a recording is never left running behind the developer's back
document.addEventListener("visibilitychange", () => { if (document.hidden) dictation.cancel(); });
addEventListener("pagehide", () => dictation.cancel());
const events = new EventSource("/api/events");
events.addEventListener("hello", () => reload());
events.addEventListener("change", () => reload());
</script>
