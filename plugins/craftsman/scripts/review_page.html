<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>craftsman review</title>
<style id="theme">/*THEME_CSS*/</style>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 300 .875rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  code, .mono { font-family: var(--mono); font-size: .7812rem; font-weight: 400; }
  code.inl-c { color: var(--neon); overflow-wrap: anywhere; }
  b, strong { font-weight: 500; color: var(--heading); }
  button { font: inherit; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  * { scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
  ::-webkit-scrollbar-corner { background: transparent; }

  .app { display: grid; grid-template-columns: 64px minmax(0, 1fr); height: 100vh; }
  /* the side panel grows with the screen and can be dragged wider or narrower; the width is remembered */
  /* with the side panel open, the content under the tabs makes room for it; the header and the tabs keep the width */
  .app.with-panel .view { margin-right: calc(var(--panel-w, clamp(560px, 42vw, 980px)) - 12px); }
  main { overflow-y: auto; padding: 24px 32px 48px; min-width: 0; }

  /* ---- rail: one tile per review ---- */
  .rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0; border-right: 1px solid var(--line); }
  .rtile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--card);
    border: 1px solid var(--line); color: var(--muted); font-size: .75rem; font-weight: 500; position: relative; cursor: pointer; }
  .rtile:hover { border-color: var(--line2); color: var(--heading); }
  .rtile.on { background: var(--neon-bg); color: var(--neon); border-color: var(--neon-dim); }
  .rtile .badge { position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--should);
    border: 2px solid var(--bg); }
  .rtile.end { margin-top: auto; }
  .rtile.dragged { opacity: .4; } .rtile.drop { border-color: var(--neon); }
  .rsep { width: 28px; height: 1px; background: var(--line); margin: 4px 0; }
  .hover { position: fixed; left: 72px; width: 300px; background: var(--float); border: 1px solid var(--line2); border-radius: 12px;
    padding: 14px 16px; box-shadow: 0 16px 40px var(--shadow); z-index: 20; font-size: .8125rem; display: none; }
  .hover .t { color: var(--heading); font-size: .9062rem; margin: 2px 0; }

  /* ---- header ---- */
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px; }
  .head > div:first-child { min-width: 0; flex: 1 1 420px; }
  .title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 300; color: var(--heading); letter-spacing: -.2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: .8438rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; margin: 18px 0 20px; border-bottom: 1px solid var(--line); }
  .tab { padding: 9px 14px; color: var(--muted); font-size: .8438rem; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--heading); border-color: var(--neon); }
  .tab .qdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--should); margin-right: 7px; vertical-align: middle; }
  .asks { display: flex; align-items: center; gap: 10px; margin: -6px 0 18px; padding: 10px 14px; border-radius: 12px; background: var(--should-bg);
    border: 1px solid var(--should-bg); color: var(--should); font-size: .8438rem; }
  .asks .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .asks b { color: var(--should); }
  .asks.permit { align-items: flex-start; }
  .asks .permit-what { display: block; margin: 8px 0; padding: 8px 10px; border-radius: var(--radius-sm); background: var(--code-bg);
    font: .7812rem/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 160px; overflow: auto; }
  .asks .permit-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .asks .permit-fields label { display: grid; gap: 4px; font-size: .75rem; }
  .asks .permit-buttons { display: flex; flex-direction: column; gap: 6px; }
  .tab .n { color: var(--dim); margin-left: 5px; } .tab.on .n { color: var(--neon); }

  .tag { font-size: .75rem; padding: 2px 9px; border-radius: 7px; font-weight: 400; white-space: nowrap; background: var(--nit-bg); color: var(--nit); }
  .tag.green { background: var(--neon-bg); color: var(--neon); } .tag.red { background: var(--must-bg); color: var(--must); }
  .tag.amber { background: var(--should-bg); color: var(--should); } .tag.blue { background: var(--change-bg); color: var(--change); }
  .live { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 10px; font-size: .8125rem;
    background: var(--neon-bg); color: var(--neon); cursor: pointer; border: 0; }
  .live.wait { background: var(--should-bg); color: var(--should); } .live.idle .pulse { animation: none; }
  .steps.idle i.now { background: var(--neon); animation: none; } .live.off { background: var(--nit-bg); color: var(--nit); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .live:not(.off) .pulse { animation: p 1.6s infinite; }
  @keyframes p { 50% { opacity: .3; } }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: .8438rem; font-weight: 400;
    background: var(--card2); border: 1px solid var(--line); color: var(--text); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--line2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.go { background: var(--neon-strong); border-color: var(--neon-strong); color: var(--on-strong); }
  .btn.ghost { background: none; } .btn.sm { padding: 5px 10px; font-size: .7812rem; }
  .btn.danger { color: var(--must); background: none; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .field { width: 100%; background: var(--card2); border: 1px solid var(--line2); border-radius: 10px; color: var(--text);
    padding: 8px 10px; font: inherit; font-weight: 300; }
  textarea.field { min-height: 90px; resize: vertical; }

  /* ---- cards and grid ---- */
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
  .s4 { grid-column: span 4; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
  @media (max-width: 1200px) { .s4, .s8 { grid-column: span 12; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
  .card h3 { margin: 0 0 14px; font-size: .7812rem; font-weight: 400; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .card h3 a:hover { color: var(--heading); }
  .card.now { border-color: var(--neon-dim); box-shadow: 3px 0 0 var(--neon) inset; }
  .card.now h3 { color: var(--neon); }
  .card.now .q { font-size: 1rem; line-height: 1.5; color: var(--heading); margin-bottom: 14px; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
  .kpi { font-size: 2.75rem; font-weight: 200; line-height: 1; color: var(--heading); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpis .l { font-size: .7812rem; color: var(--muted); margin-top: 6px; }
  .kpi.must { color: var(--must); } .kpi.should { color: var(--should); } .kpi.nit { color: var(--nit); }
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar { display: grid; grid-template-columns: 130px 1fr 22px; align-items: center; gap: 10px; font-size: .8125rem; cursor: pointer; }
  .bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 8px; border-radius: 4px; background: var(--nit-bg); display: flex; overflow: hidden; }
  .track i { display: block; height: 100%; }
  .bar .n { text-align: right; color: var(--heading); }
  i.must { background: var(--must); } i.should { background: var(--should); } i.nit { background: var(--nit-dot); }
  .progress { display: block; height: 6px; border-radius: 3px; background: var(--nit-bg); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--neon); }
  .row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 7px 0;
    border-top: 1px solid var(--line); font-size: .8125rem; }
  .ok { color: var(--neon); } .no { color: var(--must); } .wip { color: var(--dim); }
  .md p { margin: 6px 0; } .md ul, .md ol { margin: 6px 0; padding-left: 20px; } .md li { margin: 3px 0; }

  /* ---- tables ---- */
  table { width: 100%; border-collapse: collapse; font-size: .8438rem; table-layout: fixed; }
  th.sortable, th .subsort, th [data-sort] { cursor: pointer; user-select: none; } th.sortable:hover, th [data-sort]:hover { color: var(--text); }
  th.on, th .on { color: var(--heading); } th .subsort { color: var(--dim); margin-left: 4px; }
  th { text-align: left; font-weight: 400; color: var(--muted); font-size: .75rem; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: var(--card2); }
  tr.sel td { background: var(--neon-bg); } tr.sel td:first-child { box-shadow: 2px 0 0 var(--neon) inset; }
  td .t { color: var(--heading); } td .w { color: var(--muted); font-size: .7812rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .sev { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sev::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--nit-dot); flex: none; }
  .sev.must-fix::before { background: var(--must); } .sev.should-fix::before { background: var(--should); }
  .who-agent, .who-developer { white-space: nowrap; } .who-agent { color: var(--neon); } .who-developer { color: var(--change); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .chip { padding: 5px 12px; border-radius: var(--pill); border: 1px solid var(--line); color: var(--muted); font-size: .7812rem;
    cursor: pointer; background: none; }
  .chip:hover { color: var(--text); }
  .chip.on { border-color: var(--neon-dim); color: var(--neon); background: var(--neon-bg); }
  .wiz .wstep { display: flex; gap: 14px; margin: 6px 0 22px; } .wiz .wstep > .grow { flex: 1; min-width: 0; } .wiz .wl { font-weight: 500; margin-bottom: 8px; }
  .wiz .wn { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 1px solid var(--neon-dim); color: var(--neon);
    display: flex; align-items: center; justify-content: center; font-size: .7812rem; }
  .wiz .chips { display: flex; gap: 8px; flex-wrap: wrap; } .wiz .chip { cursor: pointer; }
  .wiz .wnote { font-size: .7812rem; margin-top: 10px; line-height: 1.5; } .wiz .wsub { font-size: .75rem; display: grid; gap: 4px; }
  .nr-status { font-size: .7812rem; margin-top: 8px; color: var(--muted); min-height: 18px; }
  .nr-status.ok { color: var(--neon); } .nr-status.warn { color: var(--should); } .nr-status.error { color: var(--must); }
  .chip b { font-weight: 500; color: inherit; margin-left: 4px; }
  .fsep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  select.chip { appearance: none; background: var(--bg); }
  .search { margin-left: auto; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: none;
    color: var(--text); width: 220px; font: inherit; font-size: .8125rem; }
  .cover { font-size: .7812rem; padding: 6px 10px; border-radius: 9px; background: var(--neon-bg); }

  /* ---- side panel ---- */
  .panel { border-left: 1px solid var(--line); background: var(--code-bg); display: flex; flex-direction: column;
    padding: 22px 22px 18px; min-height: 0; overflow-y: auto; position: relative; }
  .panel .crumb { font-size: .75rem; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
  .panel h2 { margin: 6px 0 4px; font-size: 1.125rem; font-weight: 400; color: var(--heading); line-height: 1.35; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: .8438rem; }
  .box .l { font-size: .75rem; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
  .quote { border-left: 2px solid var(--select); padding: 6px 12px; margin: 10px 0 0; color: var(--muted);
    background: var(--select-bg); border-radius: 0 8px 8px 0; white-space: pre-wrap; font-family: var(--mono); font-size: .75rem; }
  .thread { margin-top: 16px; }
  .thread-h { font-size: .75rem; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 10px; }
  .msgs { display: flex; flex-direction: column; gap: 10px; }
  .msg .who { font-size: .75rem; color: var(--muted); margin-bottom: 3px; }
  .msg .body { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .8438rem; }
  .msg.developer .body { background: var(--select-bg); border-color: var(--select-bg); }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 6px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--line2); margin-top: 12px; }
  .composer textarea { flex: 1; background: none; border: 0; color: var(--text); font: inherit; resize: none; min-height: 36px; padding: 6px; outline: none; }
  .send { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--neon-strong);
    color: var(--on-strong); border: 0; cursor: pointer; flex: none; }
  .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .ghlist { display: flex; flex-direction: column; gap: 12px; }
  .ghc { padding: 14px 18px; } .ghc > .who, .msg .who a, .ghc .who a { font-size: .75rem; color: var(--muted); } .ghc > .who b { color: var(--heading); font-weight: 500; }
  .ghc > .who { margin-bottom: 6px; }
  :is([data-gh-quote], [data-gh-reply-open], [data-cedit], [data-cdrop]):not(button) { cursor: pointer; font-size: .75rem; }
  .panel.dock { position: fixed; right: 0; bottom: 0; width: var(--panel-w, clamp(560px, 42vw, 980px)); z-index: 14; border-top: 1px solid var(--line); }
  .panel.over { position: fixed; right: 0; bottom: 0; width: var(--panel-w, clamp(560px, 42vw, 980px)); z-index: 16;
    border-left: 1px solid var(--line2); box-shadow: -30px 0 60px var(--shadow); }
  .grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 3; }
  .grip::after { content: ""; position: absolute; left: 3px; top: 50%; width: 2px; height: 36px; margin-top: -18px;
    border-radius: 2px; background: var(--line2); }
  .grip:hover::after, .grip.drag::after { background: var(--neon); }
  .log div { font-size: .7812rem; padding: 3px 0; white-space: pre-wrap; }
  .log .tool { font-family: var(--mono); font-size: .7188rem; color: var(--muted); }
  .log .denied { color: var(--must); font-family: var(--mono); font-size: .7188rem; }
  .log .turn { color: var(--dim); font-size: .6875rem; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .log .you { color: var(--heading); border-left: 2px solid var(--select); padding-left: 8px; }

  /* ---- selection popover ---- */
  .pop { position: fixed; display: none; gap: 4px; padding: 4px; border-radius: 10px; background: var(--float);
    border: 1px solid var(--line2); box-shadow: 0 10px 30px var(--shadow); z-index: 30; }

  /* ---- files and diffs ---- */
  .pdir { font-family: var(--mono); font-size: .7188rem; color: var(--muted); margin: 8px 0 2px 6px; }
  .pf { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; font-size: .7812rem;
    font-family: var(--mono); margin-left: 8px; cursor: pointer; }
  .pf:hover { background: var(--card); }
  /* the file's name gets the whole line; its findings sit under it */
  .pf { align-items: flex-start; } .pf .vbox, .pf .kd { margin-top: 3px; }
  .pf .pfmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pf .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf.on { background: var(--card); color: var(--heading); box-shadow: 2px 0 0 var(--heading) inset; }
  .pf.del .nm { text-decoration: line-through; color: var(--muted); }
  .vbox { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line2); display: inline-grid; place-items: center;
    font-size: .625rem; flex: none; font-family: -apple-system, sans-serif; cursor: pointer; }
  .vbox.on { background: var(--neon); border-color: var(--neon); color: var(--bg); }
  .kd { display: inline-block; width: 12px; text-align: center; font-family: var(--mono); font-weight: 600; }
  .kd.added { color: var(--neon); } .kd.modified, .kd.renamed { color: var(--change); } .kd.deleted { color: var(--must); }
  .dots { display: inline-flex; gap: 6px; flex: none; font-size: .6875rem; font-family: -apple-system, sans-serif; font-weight: 500; }
  .dots span { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
  .dots span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--nit-dot); }
  .dots .must-fix::before { background: var(--must); } .dots .should-fix::before { background: var(--should); }
  .klegend { font-size: .7188rem; color: var(--muted); margin: 10px 0 0 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .diffcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; min-width: 0; }
  .diffhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .diffbody { overflow-x: auto; padding: 6px 0; }
  .hunk { font-family: var(--mono); font-size: .75rem; color: var(--muted); background: var(--change-bg); padding: 4px 16px; }
  .ln { display: grid; grid-template-columns: 44px 44px 44px 18px max-content; line-height: 1.9; white-space: pre; font-family: var(--mono);
    font-size: .7812rem; min-width: 100%; }
  .ln .no, .ln .sg { color: var(--dim); user-select: none; } .ln .no { text-align: right; padding-right: 8px; } .ln .sg { text-align: center; }
  .ln.add { background: var(--added-bg); } .ln.add .sg { color: var(--neon); }
  .ln.del { background: var(--removed-bg); } .ln.del .sg { color: var(--must); } .ln.del .c { color: var(--removed-text); }
  .ln.whole { background: none; }
  .sx-k { color: var(--syn-keyword); } .sx-s { color: var(--syn-string); } .sx-c { color: var(--syn-comment); font-style: italic; }
  .sx-n { color: var(--syn-number); } .sx-t { color: var(--syn-type); } .sx-a { color: var(--syn-annotation); }
  .ln .gd { display: flex; gap: 3px; align-items: center; padding-left: 4px; cursor: pointer; user-select: none; }
  .ln .gd i { width: 7px; height: 7px; border-radius: 50%; } .ln .gd .more { font-size: .6562rem; color: var(--muted); font-style: normal; }
  .gd i.must { background: var(--must); } .gd i.should { background: var(--should); } .gd i.nit { background: var(--nit-dot); }
  .ln .gd:hover, .ln.open .gd { background: var(--float); border-radius: 6px; }
  .ln .gl { display: none; }
  .ln.lf-must-fix { outline: 1px solid var(--must); outline-offset: -1px; } .ln.lf-should-fix { outline: 1px solid var(--should); outline-offset: -1px; }
  .ln.lf-nit { outline: 1px solid var(--nit); outline-offset: -1px; }
  .ann.on { border-color: var(--line2); background: var(--float); }
  .modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: var(--scrim); }
  .modal.shown { display: flex; }
  .modal .box { width: min(640px, 92vw); max-height: 80vh; overflow: auto; background: var(--card); border: 1px solid var(--line2);
    border-radius: 14px; padding: 20px 22px; box-shadow: 0 20px 60px var(--shadow); }
  .modal h2 { margin: 0 0 4px; font-size: 1.125rem; font-weight: 500; color: var(--heading); }
  .modal .mrow { display: grid; grid-template-columns: 92px 40px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 0;
    border-top: 1px solid var(--line); font-size: .8438rem; }
  .modal .mrow .w { grid-column: 3; color: var(--dim); font-family: var(--mono); font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .gtip { position: fixed; display: none; z-index: 30; max-width: 520px; padding: 8px 12px; border-radius: 10px; background: var(--float);
    border: 1px solid var(--line2); box-shadow: 0 10px 30px var(--shadow); font-size: .7812rem; pointer-events: none; }

    animation: slide 1.4s ease-in-out infinite; }

<body>
<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>
  <aside class="panel" id="panel" style="display:none"></aside>
</div>
<aside class="panel slide" id="ucpanel"></aside>
<div class="hover" id="hover"></div>
<div class="pop" id="pop"></div>
<div class="gtip" id="gtip"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/theme_picker.js"></script>
<script src="/syntax.js"></script>
<script>
// ================================================================ state
// One review is shown at a time: its `id` from the address. `ui` is what the developer looks at in it.
const params = new URLSearchParams(location.search);
let current = { id: params.get("review") };
let reviewsList = [], R = null, deferred = false;
const ui = { tab: params.get("tab") || "overview", panel: null, file: params.get("file"), uc: null, ucFile: null,
  fsev: null, fby: null, fstatus: "open", fcat: "", fquestions: false, search: "", codeFilter: "all", editing: null,
  selection: null, sort: { key: "severity", dir: 1 }, inline: localStorage.getItem("craftsman-review-inline") === "1", open: new Set(),
  ghRead: new Set(), ghReading: false, replyTo: null, editComment: null };
ui.nr = newReview();
if (params.has("new")) {
  // opened by /craftsman:pr-review <source>: the wizard, with the source filled in
  const given = params.get("new").trim(), branches = !given.startsWith("https://") && given.match(/^([^\s:]+):([^\s:]+)$/);
  ui.tab = "new";
  if (branches) Object.assign(ui.nr, { kind: "branches", target: branches[1], source: branches[2] });

}
const diffs = {}, refs = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// one line the agent wrote: escaped, with `code` and **bold** as markdown renders them
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code class="inl-c">$1</code>').replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const K = () => ({ id: current.id });
const q = () => `id=${encodeURIComponent(current.id)}`;
const folder = path => String(path || "").split("/").pop();
const SEV = { "must-fix": "Must fix", "should-fix": "Should fix", "nit": "Nit" };
const SEVS = Object.keys(SEV);
const KIND = { added: "+", modified: "~", renamed: "~", deleted: "−", unchanged: "·" };
const STATUS = { open: f => !["deleted", "sent"].includes(f.status), "to-send": f => f.status === "to-send",
  sent: f => f.status === "sent", deleted: f => f.status === "deleted" };
// The review's steps, as the code-review bundle runs them. The page works out the step from what the state already
// holds; a checkpoint names its step exactly.
// each step: its protocol, its name, and what the AI agent is doing while the review is at it
const STEPS = [["open-review", "Open the review", "fetches the PR, checks out its code, and stores the diff"],
  ["read-pr-scope", "Read what the PR is for", "reads the PR's description and tickets: how it was, how it will be"],
  ["map-change-structure", "Map the use cases", "follows each entry point through the change"],
  ["read-test-rules", "Read the rules from the tests", "reads the business rules the tests check"],
  ["triage-explanations", "Note the places that are hard to follow", "writes notes on the places a reviewer stops at"],
  ["review-use-cases", "Review the use cases", "reviews the code use case by use case and writes findings"],
  ["deduplicate-findings", "Merge findings that repeat one problem", "merges findings that say the same thing, so each problem is one comment"],
  ["serve-page", "Answer your questions", "answers what you ask on this page"]];
const stepAt = id => STEPS.findIndex(([k]) => k === id);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

async function reload() {
  const list = await fetch("/api/reviews");
  reviewsList = list.ok ? (await list.json()).reviews : [];
  if (!current.id) {
    const open = reviewsList.filter(r => !r.archived && !r.closed);
    const first = open.find(r => r.checkpoint) || open[0];
    if (first) current = { id: first.id };
  }
  if (current.id) {
    const r = await fetch("/api/review?" + q());
    const fresh = r.ok ? await r.json() : null;
    if (fresh && R && fresh.state.head !== R.state.head) Object.keys(diffs).forEach(k => delete diffs[k]);
    R = fresh; if (R) R.seenAt = Date.now();
  } else R = null;
  render();
  if (R && pull(S().source) && !ui.ghRead.has(current.id)) readGithub();
}
// The pull request's conversation, read from GitHub once when the review opens, again after Send, and on request.
async function readGithub() {
  const id = current.id; ui.ghRead.add(id); ui.ghReading = true; render();
  await api("/api/review/github", { id }).finally(() => { ui.ghReading = false; });
  if (id === current.id) return reload();
}
function fileDiff(path) {
  if (diffs[path] !== undefined) return;
  diffs[path] = null;
  fetch(`/api/review/diff?${q()}&path=${encodeURIComponent(path)}`).then(r => r.ok ? r.text() : "")
    .then(text => { diffs[path] = parseDiff(text, path); render(); });
}
function references(path) {
  if (refs[path] !== undefined) return;
  refs[path] = null;
  fetch(`/api/review/references?${q()}&path=${encodeURIComponent(path)}`).then(r => r.ok ? r.json() : { references: [] })
    .then(out => { refs[path] = out.references; render(); });
}
const api = async (path, body) => {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Craftsman": "1" },
    body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({ error: "no answer from the server" }));
  if (!r.ok) { toast(out.error || "failed"); return null; }
  return out;
};
const change = (action, body) => api("/api/review/change", { ...K(), action, ...body });
function go(target) {
  const other = target.id !== undefined && target.id !== current.id;
  if (target.id !== undefined) current = { id: target.id };
  Object.assign(ui, target.ui || {});
  if (other) { R = null; Object.keys(diffs).forEach(k => delete diffs[k]); Object.keys(refs).forEach(k => delete refs[k]);
    Object.assign(ui, { panel: null, uc: null, file: null, selection: null }); }
  const p = new URLSearchParams();
  if (current.id) p.set("review", current.id);
  if (ui.tab !== "overview") p.set("tab", ui.tab);
  if (ui.tab === "code" && ui.file) p.set("file", ui.file);
  history.replaceState(null, "", "?" + p.toString());
  return other ? reload() : render();
}

// ================================================================ reading the review
const S = () => R.state;
const useCases = () => (S().structure || {})["use-cases"] || [];
const fileInfo = path => (R.files || []).find(f => f.path === path) || { path, change: "modified", added: 0, removed: 0, "use-cases": [], viewed: false };
const live = list => list.filter(f => !["merged", "deleted", "sent"].includes(f.status));
const findingsAt = path => S().findings.filter(f => !["merged", "deleted"].includes(f.status) && (f.locations || []).some(l => l.path === path));
const threadsOf = (kind, id) => (S().threads || []).filter(t => t.about.kind === kind && (kind === "file" ? t.about.path === id : t.about.id === id));
const waiting = () => S().checkpoint && !S().checkpoint.answer;
const conversation = () => (R.github && R.github.comments) || [];
const myComments = status => (S().comments || []).filter(c => c.status === status);
// GitHub's threads on the code, by the id of each thread's first comment
function ghThreads() {
  const threads = new Map();
  conversation().filter(c => c.kind === "inline").forEach(c => threads.set(c.root, [...(threads.get(c.root) || []), c]));
  return threads;
}
const sentAs = f => (f.sent || []).map(x => +(((x.url || "").match(/#discussion_r(\d+)$/) || [])[1])).filter(Boolean);
const findingOfThread = root => S().findings.find(f => sentAs(f).includes(root));
const when = at => at ? esc(at.slice(0, 16).replace("T", " ")) : "";
function sourceLabel(src) {
  if (!src) return "";
  if (src.kind === "pull-request") return `PR #${src.number} · ${src.repository}`;
  return `${src.target} ← ${src.source}` + (src["pull-request"] ? ` · PR #${src["pull-request"].number}` : " · no PR");
}
const pull = src => src && (src.kind === "pull-request" ? src : src["pull-request"]);
const dotsOf = list => `<span class="dots" title="${plural(list.length, "finding")}">${SEVS.map(k => [k, list.filter(f => f.severity === k).length])
  .filter(([, n]) => n).map(([k, n]) => `<span class="${k}">${n}</span>`).join("")}</span>`;
const sev = s => `<span class="sev ${esc(s)}">${SEV[s] || esc(s)}</span>`;
const who = by => by === "developer" ? `<span class="who-developer">● you</span>` : `<span class="who-agent">✦ AI Agent</span>`;
const md = key => R.html[key] || "";
function commonRoot() {
  const all = (R.files || []).map(f => f.path);
  const root = all.length > 1 ? all.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); }) : "";
  return root.slice(0, root.lastIndexOf("/") + 1);
}
const shortPath = p => { const root = commonRoot(); return root && p.startsWith(root) ? "…/" + p.slice(root.length) : p; };

function reviewStep() {
  // An open question fixes the step exactly. Otherwise the step is read from what the state holds, and an answered
  // question is a floor. Use cases count as mapped only once the review got past mapping them: their question was
  // answered, or a later step left something behind; until then the agent may still be about to ask about them.
  const s = S(), cp = s.checkpoint, ucs = useCases(), asked = cp && stepAt(cp.step);
  if (waiting() && asked >= 0) return asked;
  const later = (s.rules || []).length || (s.threads || []).some(t => t.messages[0].by === "agent") || ucs.some(u => u.status !== "pending");
  let at = !s.scope ? 0 : !ucs.length ? 1 : (later || asked >= 2) ? 3 : 2;
  if (at >= 3 && later) at = 4;
  if (ucs.some(u => u.status !== "pending")) at = 5;
  if (ucs.length && ucs.every(u => u.status === "reviewed")) at = 6;
  if (at === 6 && s.findings.some(f => f.status === "merged")) at = 7;
  if (cp && cp.answer && asked >= 0) at = Math.max(at, asked + 1);
  if (at >= 6 && idle()) at = 7;
  return Math.min(at, 7);
}
function stepsStrip(at, mode) {
  // one bar per step, always in the same place; the line above the strip says what the AI agent does at the current one
  return `<div class="steps ${mode}">${STEPS.map((_, i) => `<i class="${i < at ? "done" : i === at ? "now" : ""}" title="${i + 1}. ${STEPS[i][1]}${i < at ? " · done" : i === at ? " · now" : ""}"></i>`).join("")}</div>`;
}
// The session is working while it is in a turn or its reviewers run in the background; between turns, with nothing in
// the background, it is idle. Silence while working is how a stuck session shows: after a while the page says so.
const idle = () => R.running && !R.working && !waiting();
const quietFor = () => R.quiet == null ? 0 : R.quiet + Math.round((Date.now() - R.seenAt) / 1000);
const SILENT_AFTER = () => (R.background ? 15 : 5) * 60;
const stuck = () => R.working && quietFor() > SILENT_AFTER();
const ago = sec => sec < 90 ? `${sec} s` : sec < 5400 ? `${Math.round(sec / 60)} min` : `${Math.round(sec / 3600)} h`;
// A tool outside the session's list waits for the developer: the session asks the page, and stands still until answered.
const asking = () => R.running && (R.permissions || []).length > 0;
const sessionMode = () => R.restoring ? "restore" : waiting() || asking() ? "wait" : stuck() ? "stuck" : idle() ? "idle" : R.running ? "" : "off";
const doing = () => R.restoring ? "waits while the repository is restored" : asking() ? "waits for your permission" : waiting() ? "waits for your answer" : stuck() ? `has been silent for ${ago(quietFor())}` : idle() ? "is idle — ask it anything"
  : R.running ? STEPS[reviewStep()][2] : S().closed ? "— the review is closed" : "— its session is stopped";
// Under the tabs until the review reaches its last step: where it is, and what the AI agent does now.
function progressLine() {
  const at = reviewStep();
  const ask = waiting() && ui.tab !== "overview" ? `<div class="asks"><span class="pulse"></span><span class="grow"><b>AI Agent asks you</b> · ${esc(S().checkpoint.question.split("\n")[0])}</span>
    <button class="btn sm" data-answer-here>Answer here</button><a class="btn ghost sm" data-tab="overview">Open in Overview</a></div>` : "";
  const silent = stuck() ? `<div class="asks"><span class="pulse"></span><span class="grow"><b>AI Agent has been silent for ${ago(quietFor())}</b>
    · ${R.background ? `${plural(R.background, "reviewer")} it started still run in the background, or ` : ""}the session may be stuck.
    Restarting it continues the same conversation.</span>
    <button class="btn sm" data-restart>Restart the session</button><button class="btn ghost sm" data-live>Open the log</button></div>` : "";
  // the clone in /tmp, or the review's worktree, was gone: it is made again before the session resumes
  const restoring = R.restoring ? `<div class="asks"><span class="pulse"></span><span class="grow"><b>Restoring the repository…</b>
    · its clone or the review's worktree was gone; it is made again at the reviewed commit, then the session resumes.</span></div>` : "";
  const problem = R.problem ? `<div class="banner red" style="margin:0 0 14px"><b>The repository could not be restored</b> · ${esc(R.problem)}</div>` : "";
  const refused = (R.tools || []).filter(t => t.refused).map(t => t.allowed
    ? `<div class="asks"><span class="grow" style="white-space:normal"><b>${esc(t.name)} is allowed now</b> · the session still runs with the tools it started with;
        restart it and the AI Agent goes on, doing again what was refused.</span>
        <button class="btn sm" data-allow-tool="${esc(t.rule)}">Restart and go on</button></div>`
    : `<div class="asks"><span class="grow" style="white-space:normal"><b>The AI Agent was refused the tools of ${esc(t.name)}</b> · an MCP server its session
        connected to, such as the one Jira is read through. Allow it in every review? Every tool of the server is allowed then,
        writing ones too. <a style="color:var(--neon)" data-agent-tools>AI Agent tools</a></span>
        <button class="btn go sm" data-allow-tool="${esc(t.rule)}">Allow and go on</button></div>`).join("");
  const permits = asking() ? R.permissions.map(permitCard).join("") : "";
  if (at >= 7) return permits + restoring + problem + refused + ask + silent;
  return permits + restoring + problem + refused + ask + silent + `<div style="margin:-8px 0 18px"><div class="stepline"><span>Step ${at + 1} of ${STEPS.length} · <b>${STEPS[at][1]}</b></span>
    <span>AI Agent ${doing()}</span></div>${stepsStrip(at, sessionMode())}</div>`;
}
// What the session asks to use: the command, the file or the call, in a few words.
function permitWhat(p) {
  const i = p.input || {};
  return i.command || i.file_path || i.url || i.pattern || JSON.stringify(i).slice(0, 300);
}
// One permission request: allow it once, allow its rule in every review from now on, or refuse it with a reason.
function permitCard(p) {
  const id = esc(p.id);
  return `<div class="asks permit"><span class="pulse"></span><span class="grow" style="white-space:normal">
      <b>AI Agent asks to use ${esc(p.tool)}</b>${p.description ? ` · ${esc(p.description)}` : ""}
      <code class="permit-what">${esc(permitWhat(p))}</code>
      <span class="permit-fields"><label class="muted">Always allow<input class="field" id="perm-rule-${id}" value="${esc(p.rule)}"></label>
        <label class="muted">Reason, when you deny<input class="field" id="perm-reason-${id}" placeholder="e.g. use the script in the repository"></label></span></span>
    <span class="permit-buttons"><button class="btn go sm" data-permit="${id}" data-permit-answer="allow">Allow once</button>
      <button class="btn sm" data-permit="${id}" data-permit-answer="always" title="Kept as review-tools in ~/.craftsman/settings.json">Always in reviews</button>

// What a tab shows before the step that fills it: which step that is, and where the review is now.
function pendingCard(step, what) {
  const at = reviewStep();
  return `<div class="card pending"><h3><span>${what}</span></h3>
    <div>This fills in at step ${step + 1} of ${STEPS.length}, <b>${STEPS[step][1].toLowerCase()}</b>. The AI agent is at step ${at + 1},
      ${STEPS[at][1].toLowerCase()}, and ${doing().replace(/^— /, "")}.</div>
    ${stepsStrip(at, sessionMode())}
    ${waiting() ? `<a class="btn go sm" data-tab="overview">Answer its question →</a>` : !R.running && !S().closed ? `<button class="btn go sm" data-power>Start the session</button>` : ""}</div>`;
}

// ================================================================ rail
function renderRail() {
  const shown = shownReviews(), archived = reviewsList.length - shown.length;
  document.getElementById("rail").innerHTML = shown.map((r, i) => {
    const pr = pull(r.source), here = r.id === current.id;
    return `<div class="rtile${here ? " on" : ""}" data-open-review="${i}" data-hoverr="${i}" draggable="true">${pr ? "#" + pr.number : "⑂"}` +
      `${r.checkpoint ? '<span class="badge"></span>' : ""}</div>`;
  }).join("") + `<div class="rsep"></div><div class="rtile" data-new title="New review">＋</div>` +
    `<div class="rtile end${ui.tab === "tools" ? " on" : ""}" data-agent-tools title="AI Agent tools">⚙</div>` +
    `<div class="rtile" data-theme-picker title="Colour palette">◐</div>` +
    `<div class="rtile" data-archived title="Archived reviews · ${archived}">⌫</div>`;
}
// The rail's order is the developer's, dragged into place and kept in this browser; a review not placed yet goes last.
const ORDER_KEY = "craftsman-review-order";
function shownReviews() {
  const order = JSON.parse(localStorage.getItem(ORDER_KEY) || "[]"), at = id => { const n = order.indexOf(id); return n < 0 ? Infinity : n; };
  return reviewsList.filter(r => !r.archived).map((r, n) => [r, n]).sort(([a, n], [b, m]) => at(a.id) - at(b.id) || n - m).map(([r]) => r);
}
function moveReview(from, to) {
  const ids = shownReviews().map(r => r.id), [moved] = ids.splice(from, 1);
  ids.splice(to, 0, moved);
  localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
  renderRail();
}
// The card stays a moment after the pointer leaves the tile, so it can cross the gap and reach Open or Archive.
let hoverTimer;
function hideHoverSoon() {
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => { document.getElementById("hover").style.display = "none"; }, 400);
}
function showHover(i, tile) {
  const r = shownReviews()[i], h = document.getElementById("hover"); if (!r) return;
  clearTimeout(hoverTimer);
  const counts = r.findings || {};
  const total = Object.entries(counts).filter(([k]) => !["merged", "deleted"].includes(k)).reduce((a, [, n]) => a + n, 0);
  h.innerHTML = `<div class="muted" style="font-size:.75rem">${esc(sourceLabel(r.source))}</div>
    <div class="t">${esc((r.source && r.source.title) || r.id)}</div>
    <div class="muted">${esc(folder(r.checkout))}</div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">${r.checkpoint ? '<span class="tag amber">AI Agent waits for your answer</span>' : ""}
      ${r.restoring ? '<span class="tag amber">restoring the repository…</span>' : r.running ? '<span class="tag green">session running</span>' : '<span class="tag">session stopped</span>'}
      <span class="tag">${plural(total, "finding")}</span>${r.closed ? '<span class="tag">closed</span>' : ""}</div>
    <div class="row-actions"><button class="btn sm" data-open-review="${i}">Open</button>
      <button class="btn ghost sm" data-archive="${i}">Archive</button></div>`;
  h.style.top = Math.max(8, tile.getBoundingClientRect().top - 8) + "px";
  h.style.display = "block";
}

// ================================================================ header and tabs
function renderHead() {
  const s = S(), pr = pull(s.source), files = R.files || [];
  const added = files.reduce((a, f) => a + f.added, 0), removed = files.reduce((a, f) => a + f.removed, 0);
  const toSend = s.findings.filter(f => f.status === "to-send").length + myComments("to-send").length, now = useCases().find(u => u.status === "reviewing");
  const bg = R.background ? ` · ${plural(R.background, "reviewer")} in the background` : "";
  const status = R.restoring ? ["", "Restoring the repository…"] : asking() ? ["wait", "AI Agent waits for your permission"] : waiting() ? ["wait", "AI Agent waits for your answer"] : stuck() ? ["wait", `AI Agent silent for ${ago(quietFor())}`]
    : idle() ? ["idle", "AI Agent is idle · ask it anything"]
    : R.running ? ["", (now ? `AI Agent · reviewing ${now.name}` : "AI Agent is working") + bg]
    : ["off", s.closed ? "Review closed" : "Session stopped · start it"];

      <div class="title"><h1>${esc((s.source && s.source.title) || sourceLabel(s.source))}</h1>
        ${pr ? `<span class="tag">PR #${pr.number}</span>` : '<span class="tag">no PR</span>'}
        ${(s.tickets || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="sub">${esc([pr && pr.repository, branches, `${plural(files.length, "file")}, +${added} −${removed}`].filter(Boolean).join(" · "))}</div></div>
    <div class="actions">
      <button class="live ${status[0]}" data-live title="Click for the session's log"><span class="pulse"></span>${esc(status[1])}</button>
      <button class="btn ghost" data-refresh>⟳ Refresh PR</button>
      <button class="btn go" data-send ${toSend && pr && !ui.sending ? "" : "disabled"} title="${pr ? "" : "No pull request to send to"}">${ui.sending ? "Sending…" : `Send ${plural(toSend, "comment")}`}</button>
      <button class="btn ghost" data-power title="${R.running ? "Stop the session" : "Start the session"}">⏻</button>
    </div></div>
    <div class="tabs">${tabs.map(([id, name, n]) => `<a class="tab${id === ui.tab ? " on" : ""}" data-tab="${id}">${id === "overview" && waiting() ? '<span class="qdot" title="The AI agent waits for your answer"></span>' : ""}${name}${n !== "" ? `<span class="n">${n}</span>` : ""}</a>`).join("")}</div>`;
}

// ================================================================ overview
function viewOverview() {
  const s = S(), open = live(s.findings);
  const bySev = Object.fromEntries(SEVS.map(k => [k, open.filter(f => f.severity === k).length]));
  const cats = {};
  open.forEach(f => { cats[f.category] ||= { "must-fix": 0, "should-fix": 0, "nit": 0, n: 0 }; cats[f.category][f.severity]++; cats[f.category].n++; });
  const most = Math.max(1, ...Object.values(cats).map(c => c.n));
  const toSend = s.findings.filter(f => f.status === "to-send").length + myComments("to-send").length;
  const sent = s.findings.filter(f => f.status === "sent").length + myComments("sent").length;
  const ucs = useCases(), done = ucs.filter(u => u.status === "reviewed").length, cp = s.checkpoint;
  const scope = `<div class="md">${md("scope") || '<span class="muted">AI Agent has not read the PR yet.</span>'}</div>` +
    (md("requirements") ? `<h3 style="margin-top:14px"><span>What the ticket asks for</span></h3><div class="md">${md("requirements")}</div>` : "");
  let html = `<div class="grid">`;
  html += waiting() ? `<section class="card now s8"><h3><span>AI Agent asks you · ${esc(cp.step || "")}</span></h3>
      <div class="q">${esc(cp.question)}</div>
      <input class="field" id="cp-note" placeholder="A note with your answer (optional)" style="margin-bottom:10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">${(cp.options || []).map((o, i) =>
        `<button class="btn${i === 0 ? " go" : ""}" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div></section>`
    : `<section class="card s8"><h3><span>What the PR is for</span></h3>${scope}</section>`;
  html += `<section class="card s4"><h3><span>Comments for the author</span><a data-tab="findings" data-fstatus="to-send">Review them →</a></h3>
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div><div class="kpi">${toSend}</div><div class="l">ready to send</div></div>
        <div><div class="kpi nit">${sent}</div><div class="l">sent</div></div></div>
      <div class="muted" style="font-size:.8125rem;margin-top:14px">${plural(open.filter(f => f.status === "proposed").length, "finding")} not marked to send yet.
        ${pull(s.source) ? `<a data-tab="comments" style="color:var(--neon)">The conversation on GitHub →</a>` : ""}</div></section>`;
  html += `<section class="card s4"><h3><span>Findings by severity</span><a data-tab="findings" data-fsev="">${open.length} →</a></h3>
      <div class="kpis">${SEVS.map(k => `<a data-tab="findings" data-fsev="${k}"><div class="kpi ${k.split("-")[0]}">${bySev[k]}</div><div class="l">${SEV[k].toLowerCase()}</div></a>`).join("")}</div>
      <div class="track" style="height:10px;margin-top:22px">${SEVS.map(k => `<i class="${k.split("-")[0]}" style="width:${open.length ? 100 * bySev[k] / open.length : 0}%"></i>`).join("")}</div></section>`;
  html += `<section class="card s4"><h3><span>Findings by category</span></h3><div class="bars">${Object.entries(cats).sort((a, b) => b[1].n - a[1].n).slice(0, 6).map(([c, v]) =>
      `<div class="bar" data-tab="findings" data-fcat="${esc(c)}"><span>${esc(c)}</span><span class="track">${SEVS.map(k => `<i class="${k.split("-")[0]}" style="width:${100 * v[k] / most}%"></i>`).join("")}</span><span class="n">${v.n}</span></div>`).join("") || `<span class="muted">${reviewStep() < 5 ? `Findings come at step 6, ${STEPS[5][1].toLowerCase()}.` : "No findings yet."}</span>`}</div></section>`;
  html += `<section class="card s4"><h3><span>Review progress</span><span>${done} of ${ucs.length} use cases</span></h3>
      <div class="progress" style="margin-bottom:10px"><i style="width:${ucs.length ? 100 * done / ucs.length : 0}%"></i></div>
      ${ucs.map(u => `<div class="row" data-tab="structure" data-uc="${esc(u.id)}" style="cursor:pointer"><span class="${u.status === "pending" ? "wip" : "ok"}">${u.status === "reviewed" ? "✓" : u.status === "reviewing" ? "●" : "○"}</span>
        <span>${esc(u.name)}</span>${dotsOf(open.filter(f => (f.locations || []).some(l => (u.files || []).includes(l.path))))}</div>`).join("") || '<span class="muted">AI Agent has not mapped the use cases yet.</span>'}</section>`;
  const must = open.filter(f => f.severity === "must-fix");
  if (must.length) html += `<section class="card s12"><h3><span>Must fix</span><a data-tab="findings" data-fsev="">All findings →</a></h3>${findingTable(must)}</section>`;
  if (waiting()) html += `<section class="card s12"><h3><span>What the PR is for</span></h3>${scope}</section>`;
  return html + `</div>`;
}

// ================================================================ findings
// What each column sorts by; equal values keep the worst severity first, then the order the findings were made in.
const SORTS = {
  severity: f => SEVS.indexOf(f.severity), title: f => f.title.toLowerCase(),
  file: f => { const l = (f.locations || [])[0] || {}; return `${l.path || "~"}:${String(l.line || 0).padStart(6, "0")}`; },
  by: f => f.by || "agent", category: f => f.category, thread: f => -threadsOf("finding", f.id).reduce((a, t) => a + t.messages.length, 0),
  status: f => ["to-send", "proposed", "maybe-resolved", "sent", "deleted"].indexOf(f.status),
};
function sorted(list) {
  const key = SORTS[ui.sort.key] || SORTS.severity, num = f => +String(f.id).replace(/\D/g, "");
  const cmp = (a, b) => { const x = key(a), y = key(b); return x < y ? -1 : x > y ? 1 : 0; };
  return [...list].sort((a, b) => ui.sort.dir * cmp(a, b) || SORTS.severity(a) - SORTS.severity(b) || num(a) - num(b));
}
function findingTable(list, sortable) {
  const th = (key, label, style = "") => sortable
    ? `<th style="${style}" class="sortable${ui.sort.key === key ? " on" : ""}" data-sort="${key}">${label}${ui.sort.key === key ? (ui.sort.dir > 0 ? " ▲" : " ▼") : ""}</th>`
    : `<th style="${style}">${label}</th>`;
  const fileSort = sortable ? ` <a class="subsort${ui.sort.key === "file" ? " on" : ""}" data-sort="file">· by file${ui.sort.key === "file" ? (ui.sort.dir > 0 ? " ▲" : " ▼") : ""}</a>` : "";
  return `<table><thead><tr>${th("severity", "Severity", "width:110px")}${sortable
      ? `<th class="sortable${ui.sort.key === "title" ? " on" : ""}"><span data-sort="title">Finding${ui.sort.key === "title" ? (ui.sort.dir > 0 ? " ▲" : " ▼") : ""}</span>${fileSort}</th>` : "<th>Finding</th>"}
    ${th("by", "By", "width:100px")}${th("category", "Category", "width:140px")}${th("thread", "Thread", "width:70px")}${th("status", "To the author", "width:110px")}</tr></thead><tbody>${list.map(f => {
      const loc = (f.locations || [])[0] || {}, threads = threadsOf("finding", f.id);
      const st = { "to-send": '<span class="tag green">to send</span>', sent: '<span class="tag blue">sent</span>',
        "maybe-resolved": '<span class="tag amber">maybe resolved</span>', deleted: '<span class="tag">dropped</span>' }[f.status] || '<span class="tag">not yet</span>';
      return `<tr data-finding="${esc(f.id)}"${ui.panel && ui.panel.finding === f.id ? ' class="sel"' : ""}><td>${sev(f.severity)}</td>
        <td><div class="t">${inline(f.title)}</div><div class="w mono" title="${esc(loc.path || "")}">${esc(shortPath(loc.path || ""))}${loc.line ? ":" + loc.line : ""}</div></td>
        <td>${who(f.by)}</td><td class="muted">${esc(f.category)}</td>
        <td class="muted">${threads.length ? `💬 ${threads.reduce((a, t) => a + t.messages.length, 0)}` : '<span class="dim">—</span>'}</td><td>${st}</td></tr>`;
    }).join("")}</tbody></table>`;
}
function viewFindings() {
  if (!S().findings.length && reviewStep() < 5) return pendingCard(5, "No findings yet");
  const all = S().findings.filter(f => f.status !== "merged"), base = all.filter(STATUS[ui.fstatus] || STATUS.open);
  const openQ = f => threadsOf("finding", f.id).some(t => t.status === "open"), text = ui.search.toLowerCase();
  const list = base.filter(f => (!ui.fsev || f.severity === ui.fsev) && (!ui.fby || (f.by || "agent") === ui.fby) && (!ui.fcat || f.category === ui.fcat) &&
    (!ui.fquestions || openQ(f)) && (!text || (f.title + " " + f.comment + " " + (f.locations || []).map(l => l.path).join(" ")).toLowerCase().includes(text)));
  const chip = (label, n, on, data) => `<button class="chip${on ? " on" : ""}" ${data}>${label}${n !== null ? ` <b>${n}</b>` : ""}</button>`;
  const cats = [...new Set(all.map(f => f.category))].sort();
  return `<div class="filters">
      ${chip("All", base.length, !ui.fsev, 'data-fsev=""')}${SEVS.map(k => chip(SEV[k], base.filter(f => f.severity === k).length, ui.fsev === k, `data-fsev="${k}"`)).join("")}
      <span class="fsep"></span>${chip("✦ AI Agent", base.filter(f => f.by !== "developer").length, ui.fby === "agent", 'data-fby="agent"')}${chip("You", base.filter(f => f.by === "developer").length, ui.fby === "developer", 'data-fby="developer"')}
      <span class="fsep"></span><select class="chip${ui.fcat ? " on" : ""}" id="fcat"><option value="">Any category</option>${cats.map(c => `<option${c === ui.fcat ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
      ${chip("Open questions", base.filter(openQ).length, ui.fquestions, "data-fquestions")}
      <span class="fsep"></span>${[["open", "Open"], ["to-send", "To send"], ["sent", "Sent"], ["deleted", "Dropped"]].map(([k, l]) =>
        chip(l, all.filter(STATUS[k]).length, ui.fstatus === k, `data-fstatus="${k}"`)).join("")}
      <input class="search" id="fsearch" placeholder="Search findings…"></div>
    <div class="card" style="padding:6px 10px">${list.length ? findingTable(sorted(list), true) : '<div class="muted" style="padding:14px">No finding matches.</div>'}</div>`;
}

// ================================================================ comments: the conversation on GitHub and the developer's own
// GitHub's conversation as it reads there, oldest first: comments, reviews, and the threads on the code, each at the
// time it started. The developer's comments wait for Send under it; a reply waits under its thread.
function viewComments() {
  if (!pull(S().source)) return `<div class="card"><div class="muted">This review has no pull request, so there is no conversation to read or write to.</div></div>`;
  const g = R.github, read = ui.ghReading ? "Reading the conversation from GitHub…"
    : g && g.fetched ? `Read from GitHub ${ago(Math.max(0, Math.round((Date.now() - Date.parse(g.fetched)) / 1000)))} ago` : "Not read from GitHub yet";
  const items = [...conversation().filter(c => c.kind !== "inline").map(c => ({ at: c.at, html: ghComment(c) })),
    ...[...ghThreads()].map(([root, msgs]) => ({ at: msgs[0].at, html: ghThreadCard(root, msgs) }))].sort((a, b) => (a.at || "").localeCompare(b.at || ""));
  const general = myComments("to-send").filter(c => !c["reply-to"]);
  return `<div class="filters" style="justify-content:space-between;align-items:center"><span class="muted" style="font-size:.7812rem">${read}</span>
      <button class="btn ghost sm" data-gh-read ${ui.ghReading ? "disabled" : ""}>⟳ Read again</button></div>
    ${g && g.error ? `<div class="banner red" style="margin:0 0 12px">GitHub did not answer: ${esc(g.error)}</div>` : ""}
    <div class="ghlist">${items.map(i => i.html).join("") || '<div class="card muted">Nobody has written on the pull request yet.</div>'}</div>
    ${general.length ? `<h3 class="muted" style="font-size:.7812rem;font-weight:400;margin:20px 0 8px">Waiting for Send</h3>${general.map(draftCard).join("")}` : ""}
    <div class="card" style="margin-top:16px"><textarea class="field" id="new-comment" placeholder="Write a comment on the whole pull request… It goes with Send." style="min-height:90px"></textarea>
      <div class="row-actions"><button class="btn go sm" data-comment-add>Add comment</button></div></div>`;
}
function ghHead(c, extra = "") {
  return `<div class="who"><b>${esc(c.author || "someone")}</b> · ${when(c.at)}${extra}${c.url ? ` · <a href="${esc(c.url)}" target="_blank" rel="noopener">On GitHub ↗</a>` : ""}</div>`;
}
function ghComment(c) {
  const decided = { APPROVED: ' · <span class="tag green">approved</span>', CHANGES_REQUESTED: ' · <span class="tag red">asked for changes</span>' }[c.state] || (c.kind === "review" ? " · reviewed" : "");
  return `<div class="card ghc">${ghHead(c, decided)}${c.body ? `<div class="md">${md("github:" + c.id)}</div>` : ""}
    ${c.kind === "issue" ? `<div class="row-actions"><a class="muted" data-gh-quote="${c.id}">Quote reply</a></div>` : ""}</div>`;
}
// One thread on the code: where it is, what was said, the developer's replies waiting for Send, and a reply box.
function ghThreadMessages(root, msgs) {
  return `<div class="msgs">${msgs.map(m => `<div class="msg"><div class="who">${esc(m.author || "someone")} · ${when(m.at)}${m.url ? ` · <a href="${esc(m.url)}" target="_blank" rel="noopener">↗</a>` : ""}</div>
      <div class="body md">${md("github:" + m.id)}</div></div>`).join("")}
    ${(S().comments || []).filter(c => c.status === "to-send" && c["reply-to"] === root).map(draftCard).join("")}</div>
    ${ui.replyTo === root ? `<textarea class="field" id="reply-box" placeholder="Your reply… It goes with Send." style="margin-top:10px;min-height:70px"></textarea>
      <div class="row-actions"><button class="btn go sm" data-gh-reply="${root}">Add reply</button><button class="btn ghost sm" data-gh-reply-open="">Cancel</button></div>`
    : `<div class="row-actions"><a class="muted" data-gh-reply-open="${root}">Reply</a></div>`}`;
}
function ghPlace(first) {
  const line = first.line ?? first["original-line"];
  return `<span class="mono">${esc(first.path)}:${line ?? ""}</span>` + (first.line == null ? ' <span class="tag">outdated</span>'
    : (R.files || []).some(f => f.path === first.path) ? ` <a data-goto="${esc(first.path)}|${first.line}" style="color:var(--neon)">Show in code →</a>` : "");
}
function ghThreadCard(root, msgs) {
  const f = findingOfThread(root);
  return `<div class="card ghc"><div class="thread-h"><span>${ghPlace(msgs[0])}</span>${f ? `<a data-finding="${esc(f.id)}">your finding ${esc(f.id)}</a>` : ""}</div>
    ${ghThreadMessages(root, msgs)}</div>`;
}
function draftCard(c) {
  const editing = ui.editComment === c.id;
  return `<div class="msg developer"><div class="who">you · waits for Send${c["reply-to"] ? "" : " · comment on the pull request"}</div>
    ${editing ? `<textarea class="field" id="cedit-${esc(c.id)}" style="min-height:70px">${esc(c.body)}</textarea>
      <div class="row-actions"><button class="btn go sm" data-csave="${esc(c.id)}">Save</button><button class="btn ghost sm" data-cedit="">Cancel</button></div>`
    : `<div class="body md">${md("comment:" + c.id)}</div><div class="row-actions"><a class="muted" data-cedit="${esc(c.id)}">Edit</a><a class="muted" data-cdrop="${esc(c.id)}">Drop</a></div>`}</div>`;
}
function panelGhThread(root) {
  const msgs = ghThreads().get(root); if (!msgs) return `<div class="muted">This thread is not on GitHub any more.</div>`;
  return `<div class="crumb"><span>Thread on GitHub · ${ghPlace(msgs[0])}</span><a data-close-panel>✕</a></div>
    <div style="margin-top:12px">${ghThreadMessages(root, msgs)}</div>`;
}

// ================================================================ the side panel
function panelFinding(id) {
  const f = S().findings.find(x => x.id === id); if (!f) return `<div class="muted">No finding ${esc(id)}.</div>`;
  const loc = (f.locations || [])[0] || {}, sent = f.status === "sent", editing = ui.editing === f.id;
  const snippet = loc.path ? snippetAt(loc.path, loc.line, loc.side) : "";
  const actions = editing ? `<button class="btn go sm" data-save="${esc(f.id)}">Save</button><button class="btn ghost sm" data-edit="">Cancel</button>`
    : sent ? (f.sent || []).map(x => `<a class="btn sm" href="${esc(x.url)}" target="_blank">On GitHub ↗</a>`).join("")
    : (f.status === "to-send" ? `<button class="btn sm" data-status="proposed">✓ Marked to send</button>` : `<button class="btn go sm" data-status="to-send">Mark to send</button>`) +
      (f.status === "deleted" ? `<button class="btn ghost sm" data-status="proposed">Bring back</button>` : `<button class="btn danger sm" data-status="deleted">Drop</button>`);
  // every place it points at, grouped by file; a line number scrolls the diff to it

// ================================================================ diffs
function parseDiff(text, path) {
  const hunks = []; let old = 0, now = 0;
  for (const line of text.split("\n")) {
    const h = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if (h) { old = +h[1]; now = +h[2]; hunks.push({ header: line, lines: [] }); continue; }
    if (!hunks.length) continue;
    const kind = { "+": "add", "-": "del", " ": "ctx" }[line[0]];
    if (!kind) continue;
    hunks[hunks.length - 1].lines.push({ kind, old: kind === "add" ? null : old, now: kind === "del" ? null : now, text: line.slice(1) });
    if (kind !== "add") old++;
    if (kind !== "del") now++;
  }
  return colourCode(hunks, path);
}
// Each line's HTML coloured by the file's language (syntax.js). A hunk is read twice over: the old side -- unchanged and
// deleted lines -- and the new one -- unchanged and added lines -- so a comment opened on one side stays on it.
function colourCode(hunks, path) {
  const lang = window.Syntax ? Syntax.language(path) : null;
  hunks.forEach(h => {
    let old = null, now = null;
    h.lines.forEach(l => {
      if (!lang) { l.html = esc(l.text); return; }
      const [html, next] = Syntax.line(lang, l.text, l.kind === "del" ? old : now);
      l.html = html;
      if (l.kind !== "add") old = next;
      if (l.kind !== "del") now = next;
    });
  });
  return hunks;
}
function snippetAt(path, line, side) {
  const hunks = diffs[path];

  const all = hunks.flatMap(h => h.lines), at = all.findIndex(l => (side === "LEFT" ? l.old : l.now) === line);
  if (at < 0) return "";
  return `<div class="snip">${all.slice(Math.max(0, at - 3), at + 4).map((l, i, shown) => `<div class="ln ${l.kind}${l === all[at] ? " sel" : ""}">` +
    `<span class="no">${l.now ?? l.old}</span><span class="sg">${l.kind === "add" ? "+" : l.kind === "del" ? "−" : ""}</span><span class="c">${l.html}</span></div>`).join("")}</div>`;
}
// One file's diff, with its findings and threads under their lines. A new or a deleted file is shown without colour:

function diffView(path, position) {

    <span style="display:flex;gap:14px;align-items:center;font-size:.7812rem"><span class="muted">select lines to ask AI Agent or add a finding</span>${sevCounts(findingsAt(path))}
      <span class="switch${ui.inline ? " on" : ""}" data-inline title="Every finding under its line, or dots beside the line number"><i></i>Show all inline</span>
      <span style="display:inline-flex;gap:6px;align-items:center;cursor:pointer" data-view="${esc(path)}"><span class="vbox${info.viewed ? " on" : ""}">${info.viewed ? "✓" : ""}</span>Viewed</span></span></div>`;
  if (!hunks) { fileDiff(path); return `<div class="diffcard">${head}<div class="banner">Loading…</div></div>`; }

    const shown = here.length && (ui.inline || ui.open.has(key)), lit = opened && here.includes(opened) ? " lf-" + opened.severity : "";

      `<span class="no">${l.old ?? ""}</span><span class="no">${l.now ?? ""}</span>${gutter(here, key)}<span class="sg">${l.kind === "add" ? "+" : l.kind === "del" ? "−" : ""}</span><span class="c">${l.html}</span></div>` +

        `<div class="ann${ui.panel && ui.panel.ghThread === root ? " on" : ""}" data-gh-thread="${root}"><span class="tag blue">GitHub · ${msgs.length}</span><span>${esc(msgs[0].author || "")}: ${noteTitle(msgs[0].body)}</span></div>`).join("");

// An in-page confirmation: resolves true on the confirm button, false on Cancel, Escape, or a click outside the box.
function ask(title, body, yes) {

  el.innerHTML = `<div class="box"><h2>${title}</h2>${body}<div class="foot"><button class="btn ghost" data-m="no">Cancel</button>
    <button class="btn go" data-m="yes">${esc(yes)}</button></div></div>`;
  el.classList.add("shown"); el.querySelector("[data-m=yes]").focus();
  return new Promise(done => {

    const key = e => { if (e.key === "Escape") { e.stopPropagation(); close(false); } };

// A line's findings as dots beside its number, worst first; the list behind them shows on hover, and a click opens it.

    `${worst.length > 4 ? `<em class="more">+${worst.length - 4}</em>` : ""}<span class="gl">${worst.map(f =>
      `<div>${sev(f.severity)}<b>${esc(f.id)}</b> ${inline(f.title)}</div>`).join("")}<div class="hint">click to open them under the line</div></span></span>`;

// Files under their folders, the folders shortened: the common root once, a long folder as its first and last two parts.
