<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>craftsman review</title>
<style>
  /*THEME_CSS*/
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  a { color: var(--blue); text-decoration: none; cursor: pointer; }
  code { font-family: var(--mono); font-size: 12.5px; color: var(--blue); }
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr) clamp(440px, 38vw, 960px); height: 100vh; }
  .app > * { overflow-y: auto; min-height: 0; }

  /* ---- menu ---- */
  .menu { background: var(--panel); border-right: 1px solid var(--border); padding: 14px 0; }
  .brand { padding: 0 16px 12px; font-weight: 600; color: var(--green); letter-spacing: .5px;
    border-bottom: 1px solid var(--border); }
  .brand span { color: var(--muted); font-weight: 400; }
  .menu-group { padding: 10px 0 2px; }
  .menu-title { padding: 2px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .menu-item { display: flex; align-items: center; gap: 8px; padding: 4px 16px; cursor: pointer;
    color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-item:hover { background: var(--panel2); }
  .menu-item.current { background: var(--blue-bg); color: var(--heading); }
  .menu-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .menu-item.review { font-weight: 500; }
  .menu-item.section { padding-left: 32px; }
  .menu-item.category { padding-left: 46px; font-size: 13px; }
  .menu-item .where { color: var(--muted); font-weight: 400; font-size: 12px; }
  .count { color: var(--muted); font-size: 12px; }
  .count.waiting { color: var(--amber); }

  /* ---- centre ---- */
  .head { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 10px 24px; flex-wrap: wrap; }
  .topbar .crumb { flex: 1; min-width: 200px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .topbar .crumb b { color: var(--heading); font-weight: 500; }
  .live { font-size: 12px; color: var(--muted); }
  .live::before { content: "●"; color: var(--green); margin-right: 5px; }
  .live.off::before { color: var(--red); }
  .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 4px;
    padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .btn:hover { border-color: var(--blue); }
  .btn.primary { border-color: var(--green-dim); color: var(--green); }
  .btn.danger { border-color: var(--red-dim); color: var(--red); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .checkpoint { background: var(--amber-bg); border-top: 1px solid var(--amber-dim); padding: 10px 24px 12px; }
  .checkpoint .q { color: var(--heading); margin: 2px 0 8px; white-space: pre-wrap; max-height: 40vh; overflow-y: auto; }
  .checkpoint .field { margin-bottom: 8px; }
  .view { padding: 18px 24px 60px; max-width: 1100px; }
  h1 { font-size: 20px; color: var(--heading); margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 26px 0 8px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .muted { color: var(--muted); }
  .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-top: 8px; }

  details.block { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; }
  details.block > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
  details.block > summary::-webkit-details-marker { display: none; }
  details.block > summary::before { content: "▸"; color: var(--muted); width: 10px; flex: none; }
  details.block[open] > summary::before { content: "▾"; }
  details.block > summary .t { color: var(--heading); font-weight: 500; }
  details.block > .inner { padding: 4px 16px 12px 32px; border-top: 1px solid var(--border); }

  .badge { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--border);
    font-family: var(--mono); white-space: nowrap; }
  .badge.active { color: var(--green); border-color: var(--green-dim); background: var(--green-bg); }
  .badge.done, .badge.off { color: var(--muted); }
  .badge.pending { color: var(--blue); border-color: var(--blue-dim); background: var(--blue-bg); }
  .badge.violation { color: var(--red); border-color: var(--red-dim); }
  .badge.new-convention { color: var(--violet); border-color: var(--violet-dim); }
  .badge.scout { color: var(--green); border-color: var(--green-dim); }
  .badge.out-of-scope { color: var(--amber); border-color: var(--amber-dim); }
  .badge.proposed { color: var(--text); }
  .badge.to-send { color: var(--green); border-color: var(--green-dim); background: var(--green-bg); }
  .badge.sent { color: var(--blue); border-color: var(--blue-dim); background: var(--blue-bg); }
  .badge.deleted, .badge.merged { color: var(--muted); }
  .badge.maybe-resolved { color: var(--amber); border-color: var(--amber-dim); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 8px 0 4px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; cursor: pointer; }
  .tile:hover { border-color: var(--blue-dim); }
  .tile .n { font-size: 22px; color: var(--heading); font-weight: 600; }
  .tile .what { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .bar { display: flex; gap: 3px; margin: 6px 0 12px; }
  .bar span { flex: 1; height: 6px; border-radius: 3px; background: var(--panel2); }
  .bar span.done { background: var(--green); }
  .bar span.active { background: repeating-linear-gradient(45deg, var(--green), var(--green) 4px, var(--green-dim) 4px, var(--green-dim) 8px); }
  .list-row { display: flex; gap: 10px; align-items: baseline; padding: 5px 4px; border-bottom: 1px solid var(--border); }
  .list-row .grow { flex: 1; }
  .ico { width: 14px; text-align: center; flex: none; }
  .ico.done { color: var(--muted); } .ico.active { color: var(--green); } .ico.pending { color: var(--blue); }
  .ico.waiting { color: var(--amber); }
  .field { width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 6px 8px; font: inherit; }
  textarea.field { min-height: 120px; font-family: var(--mono); font-size: 12.5px; }
  .filterbar { display: flex; gap: 8px; align-items: center; background: var(--blue-bg); border: 1px solid var(--blue-dim);
    border-radius: var(--radius-sm); padding: 5px 10px; margin: 0 0 12px; font-size: 13px; }

  .graph { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
  .graph svg { display: block; width: 100%; max-width: 900px; height: auto; }
  .graph .gnode rect { fill: var(--panel2); stroke: var(--border); rx: 8; }
  .graph .gnode.uc rect { stroke: var(--blue-dim); } .graph .gnode.ctx rect { stroke: var(--violet); }
  .graph .gnode text { fill: var(--text); font-size: 12px; pointer-events: none; }
  .graph .gnode { cursor: pointer; }
  .graph .gedge { stroke: var(--border); stroke-width: 1.5; fill: none; }
  .graph .glink { stroke: var(--green); stroke-width: 1.8; fill: none; cursor: pointer; }
  .graph .glink.doubt { stroke: var(--red); stroke-dasharray: 5 4; }
  .graph .glabel { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  .graph.hovering .gnode, .graph.hovering .gedge, .graph.hovering .glink, .graph.hovering .glabel { opacity: .25; }
  .graph.hovering .hl { opacity: 1 !important; }
  .graph .gnode.picked rect { fill: var(--blue-bg); stroke: var(--blue); }
  .graph-info { margin-top: 6px; font-size: 13px; }

  .finding { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; padding: 10px 14px; }
  .finding.to-send { border-color: var(--green-dim); }
  .finding.deleted { opacity: .5; } .finding.sent { border-color: var(--blue-dim); }
  .finding.maybe-resolved { border-style: dashed; }
  .finding .fhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .finding .ftitle { color: var(--heading); font-weight: 500; flex: 1; }
  .finding .comment { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px 12px; }
  .finding .actions { margin-top: 10px; }
  .loc { font-family: var(--mono); font-size: 12px; }
  .hunk { font-family: var(--mono); font-size: 12px; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); margin: 4px 0 8px; overflow-x: auto; }
  .hunk div { white-space: pre; padding: 0 8px; }
  .hunk .add { background: var(--green-bg); } .hunk .del { background: var(--red-bg); }
  .hunk .at { color: var(--muted); } .hunk .here { outline: 1px solid var(--amber); }
  .reply { border-left: 3px solid var(--blue-dim); padding: 2px 10px; margin: 4px 0; font-size: 13px; }
  .cmd { display: inline-flex; gap: 6px; align-items: center; margin: 4px 0 0; }
  .cmd code { background: var(--panel2); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
  .copy { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px; flex: none;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; color: var(--muted); cursor: pointer; padding: 0; }
  .copy:hover, .copy.done { color: var(--green); border-color: var(--green); }

  /* ---- console (right) ---- */
  .side { position: relative; background: var(--panel); border-left: 1px solid var(--border); display: flex;
    flex-direction: column; overflow: hidden; padding: 12px 12px 12px 14px; }
  .grip { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 3; }
  .grip:hover, .grip.dragging { background: var(--blue-dim); }
  .side-title { display: flex; gap: 8px; align-items: baseline; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); padding: 2px 4px 10px; }
  .side-title .grow { flex: 1; }
  .lines { flex: 1; overflow-y: auto; font-size: 13px; padding: 0 2px; }
  .ln { padding: 3px 4px; white-space: pre-wrap; word-break: break-word; }
  .ln.you { color: var(--heading); border-left: 2px solid var(--blue); background: var(--blue-bg); margin-top: 8px; }
  .ln.tool { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .ln.denied { color: var(--red); font-family: var(--mono); font-size: 11.5px; }
  .ln.turn { color: var(--muted); font-size: 11px; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
  .say { display: flex; gap: 6px; padding-top: 8px; align-items: flex-end; }
  .say textarea { flex: 1; min-height: 64px; font-size: 13px; font-family: inherit; }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--green); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; max-width: 640px; }
  .toast.show { opacity: 1; }
  /*MD_CSS*/
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="menu" id="menu"></nav>
  <main class="centre" id="centre"></main>
  <aside class="side" id="side"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
// ---------------------------------------------------------------- state
// `current` is what the page shows: one review (`project` + `id`) and one of its sections, or the new-review form.
const SECTIONS = ["overview", "structure", "rules", "map", "explanations", "findings", "sent"];
const params = new URLSearchParams(location.search);
let current = { project: params.get("project"), id: params.get("review"), section: params.get("section") || "overview",
  category: params.get("category") };
let reviewsList = [], projects = [], R = null, diffText = null, live = false;
let rFilter = null, graphInfo = null, openContext = null, editing = null;
const openKeys = new Set(), shownHunks = new Set();

async function reload() {
  const [list, ping] = await Promise.all([fetch("/api/reviews"), fetch("/api/ping")]);
  reviewsList = list.ok ? (await list.json()).reviews : [];
  projects = ping.ok ? (await ping.json()).found : [];
  if (current.id === null && current.section !== "new") {
    const first = reviewsList.find(r => !r.closed && r.checkpoint) || reviewsList.find(r => !r.closed) || reviewsList[0];
    current = first ? { ...current, project: first.project, id: first.id } : { section: "new" };
  }
  await loadReview();
  render();
}
async function loadReview() {
  if (!current.id) { R = null; return; }
  const q = `project=${encodeURIComponent(current.project)}&id=${encodeURIComponent(current.id)}`;
  const r = await fetch("/api/review?" + q);
  const fresh = r.ok ? await r.json() : null;
  if (fresh && R && fresh.state.head !== R.state.head) diffText = null;
  R = fresh;
  if (R && diffText === null) { const d = await fetch("/api/review/diff?" + q); diffText = d.ok ? await d.text() : ""; }
}
function go(target) {
  const other = target.id !== current.id || target.project !== current.project;
  current = { project: current.project, id: current.id, ...target };
  if (other) { R = null; diffText = null; rFilter = null; graphInfo = null; openContext = null; editing = null; shownHunks.clear(); }
  const q = new URLSearchParams();
  if (current.id) { q.set("project", current.project); q.set("review", current.id); }
  if (current.section && current.section !== "overview") q.set("section", current.section);
  if (current.category) q.set("category", current.category);
  history.replaceState(null, "", "?" + q.toString());
  document.getElementById("centre").scrollTop = 0;
  return other ? reload() : render();
}

// ---------------------------------------------------------------- helpers
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const ICON = { done: "✓", active: "●", pending: "○", waiting: "?" };
const ico = st => `<span class="ico ${st}">${ICON[st] || "·"}</span>`;
const COPY_SVG = `<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
const copyCmd = c => `<span class="cmd"><button class="copy" data-copy="${esc(c)}" title="copy">${COPY_SVG}</button><code>${esc(c)}</code></span>`;
const short = sha => String(sha || "").slice(0, 8);
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
function det(key, summary, inner) {
  return `<details class="block" data-key="${esc(key)}"${openKeys.has(key) ? " open" : ""}>` +
         `<summary>${summary}</summary><div class="inner">${inner}</div></details>`;
}
function sourceLabel(src) {
  if (!src) return "";
  if (src.kind === "pull-request") return `PR #${src.number} · ${src.repository}`;
  return `${src.target} ← ${src.source}` + (src["pull-request"] ? ` · PR #${src["pull-request"].number}` : " · no PR");
}
function projectLabel(path) {
  const parts = String(path || "").split("/").filter(Boolean);
  return parts.slice(-1)[0] || path;
}
const waiting = () => R && R.state.checkpoint && !R.state.checkpoint.answer;
const open = list => list.filter(f => f.status !== "merged" && f.status !== "sent");
function categories() {
  const cats = {};
  open(R.state.findings).forEach(f => (cats[f.category] ||= []).push(f));
  return Object.entries(cats).sort((a, b) => a[0].localeCompare(b[0]));
}
const api = async (path, body) => {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Craftsman": "1" },
    body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({ error: "no answer from the server" }));
  if (!r.ok) { toast(out.error || "failed"); return null; }
  return out;
};
const reviewKey = () => ({ project: current.project, id: current.id });

// ---------------------------------------------------------------- menu (left)
function renderMenu() {
  let html = `<div class="brand">craftsman <span>· review</span></div><div class="menu-group"><div class="menu-title">Reviews</div>`;
  html += `<div class="menu-item${current.section === "new" ? " current" : ""}" data-new="1"><span class="grow">+ New review</span></div>`;
  const several = new Set(reviewsList.map(r => r.project)).size > 1;
  reviewsList.forEach(rv => {
    const here = rv.id === current.id && rv.project === current.project;
    const state = rv.closed ? "done" : rv.checkpoint ? "waiting" : rv.running ? "active" : "pending";
    const total = Object.values(rv.findings).reduce((a, b) => a + b, 0);
    html += `<div class="menu-item review${here && !R ? " current" : ""}" data-review="${esc(rv.id)}" data-rproject="${esc(rv.project)}"` +
      ` title="${esc(rv.project)}">${ico(state)}<span class="grow">${esc(rv.id)}${several ? ` <span class="where">${esc(projectLabel(rv.project))}</span>` : ""}</span>` +
      `<span class="count">${rv.findings["to-send"] || 0}/${total}</span></div>`;
    if (here && R) html += sectionItems();
  });
  document.getElementById("menu").innerHTML = html + `</div>`;
}
function sectionItems() {
  const S = R.state, st = S.structure || {};
  const ucs = st["use-cases"] || [];
  const counts = {
    overview: waiting() ? `<span class="count waiting">waiting for you</span>` : "",
    structure: ucs.length ? `<span class="count">${ucs.filter(u => u.status === "reviewed").length}/${ucs.length}</span>` : "",
    rules: (S.rules || []).length || "", map: (S.map || []).length || "", explanations: (S.explanations || []).length || "",
    findings: open(S.findings).length || "", sent: S.findings.filter(f => f.status === "sent").length || "",
  };
  const names = { overview: "Overview", structure: "Structure", rules: "Rules from the tests", map: "PR map",
    explanations: "Explanations", findings: "Findings", sent: "Sent" };
  let html = "";
  SECTIONS.forEach(section => {
    const here = current.section === section && !(section === "findings" && current.category);
    const count = typeof counts[section] === "number" ? `<span class="count">${counts[section]}</span>` : counts[section];
    html += `<div class="menu-item section${here ? " current" : ""}" data-section="${section}"><span class="grow">${names[section]}</span>${count}</div>`;
    if (section === "findings") categories().forEach(([cat, list]) => {
      const there = current.section === "findings" && current.category === cat;
      html += `<div class="menu-item category${there ? " current" : ""}" data-section="findings" data-category="${esc(cat)}">` +
        `<span class="grow">${esc(cat)}</span><span class="count">${list.length}</span></div>`;
    });
  });
  return html;
}

// ---------------------------------------------------------------- top of the centre: where, actions, the question
function renderHead() {
  if (!R) return `<div class="topbar"><span class="crumb"><b>${esc(current.section === "new" ? "new review" : current.id || "")}</b></span>` +
    `<span class="live${live ? "" : " off"}">${live ? "live" : "reconnecting…"}</span></div>`;
  const S = R.state;
  const where = [current.section, current.category].filter(Boolean).join(" / ");
  const toSend = S.findings.filter(f => f.status === "to-send").length;
  let html = `<div class="topbar"><span class="crumb"><b>${esc(current.id)}</b> / ${esc(where)}</span>` +
    `<span class="badge ${R.running ? "active" : "off"}">${R.running ? "session running" : "session stopped"}</span>` +
    (S.closed ? `<span class="badge done">closed</span>` : "") +
    (R.pending ? `<span class="muted" style="font-size:12px">${plural(R.pending, "request")} waiting</span>` : "") +
    `<span class="actions">` +
    (R.running ? `<button class="btn" data-rv="stop">Stop</button><button class="btn" data-rv="cli">Continue in CLI</button>`
               : `<button class="btn primary" data-rv="resume">${S.session ? "Resume" : "Start"}</button>`) +
    `<button class="btn" data-rv="refresh">Refresh PR</button>` +
    `<button class="btn primary" data-rv="send"${toSend ? "" : " disabled"}>Send ${toSend} to GitHub</button>` +
    `<button class="btn danger" data-rv="close">Close</button></span>` +
    `<span class="live${live ? "" : " off"}">${live ? "live" : "reconnecting…"}</span></div>`;
  if (waiting()) {
    const cp = S.checkpoint;
    html += `<div class="checkpoint"><div class="muted" style="font-size:12px">${esc(cp.step)} is waiting for you</div>` +
      `<div class="q">${inline(cp.question)}</div><input class="field" id="cp-note" placeholder="note (optional)">` +
      `<div class="actions">${(cp.options || []).map(o => `<button class="btn primary" data-answer="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`;
  }
  return html;
}

// ---------------------------------------------------------------- sections
function viewOverview() {
  const S = R.state, H = R.html, st = S.structure || {};
  const ucs = st["use-cases"] || [];
  let html = `<h1>${esc(sourceLabel(S.source))}</h1><div class="sub">${esc(current.id)} · base <code>${short(S.base)}</code>` +
    ` · head <code>${short(S.head)}</code> · <span title="${esc(current.project)}">${esc(current.project)}</span></div>`;
  const status = {}; S.findings.forEach(f => status[f.status] = (status[f.status] || 0) + 1);
  const tile = (n, what, section) => `<div class="tile" data-section="${section}"><div class="n">${n}</div><div class="what">${what}</div></div>`;
  html += `<div class="tiles">` + tile(`${ucs.filter(u => u.status === "reviewed").length}/${ucs.length}`, "use cases reviewed", "structure") +
    tile(open(S.findings).length, "findings open", "findings") + tile(status["to-send"] || 0, "marked to send", "findings") +
    tile(status.sent || 0, "sent", "sent") + `</div>`;

// ---------------------------------------------------------------- actions
async function reviewAction(what) {
  const k = reviewKey();
  if (what === "start") {
    const body = { project: document.getElementById("nr-project").value, source: document.getElementById("nr-source").value.trim() };
    const out = await api("/api/review/start", body);
    if (out) go({ project: body.project, id: out.id, section: "overview", category: null });
    return;
  }
  if (what === "resume" || what === "stop") { if (await api("/api/review/" + what, k)) toast(what === "stop" ? "session stopped" : "session started"); return reload(); }
  if (what === "cli") {
    if (!(await api("/api/review/stop", k))) return;
    await reload();
    document.getElementById("lines").insertAdjacentHTML("beforeend",
      `<div class="ln you">The session is stopped. Continue it in the CLI:<br>${copyCmd(`cd ${current.project} && claude --resume ${R.state.session}`)}</div>`);
    return;
  }
  if (what === "refresh" || what === "close") {
    if (what === "close" && !confirm("Close this review? The session ends; the review and its findings stay.")) return;
    if (await api("/api/review/message", { ...k, type: what })) toast(what === "refresh" ? "asked the session to refresh" : "closing");
    return;
  }
  if (what === "say") {
    const text = document.getElementById("say").value.trim(); if (!text) return;
    if (await api("/api/review/message", { ...k, type: "message", text })) { document.getElementById("say").value = ""; reload(); }
    return;
  }
  if (what === "send") {
    const marked = R.state.findings.filter(f => f.status === "to-send");
    if (!confirm(`Send ${marked.length} finding(s) to ${sourceLabel(R.state.source)} as comments?\n\n` +
      marked.map(f => `${f.id} ${f.title}`).join("\n") + `\n\nComments on GitHub cannot be taken back from here.`)) return;
    toast("sending…");
    const out = await api("/api/review/send", k);
    if (out) toast(`sent ${out.sent.length}` + (out.errors.length ? ` · problems: ${out.errors.join("; ")}` : ""));
    return reload();
  }
}

  const n = e.target.closest("[data-gnode]");
  graph.querySelectorAll(".hl").forEach(x => x.classList.remove("hl"));
  if (!n) return graph.classList.remove("hovering");
  const id = n.dataset.gnode; graph.classList.add("hovering"); n.classList.add("hl");
  graph.querySelectorAll("[data-a],[data-b]").forEach(x => {
    if (x.dataset.a === id || x.dataset.b === id) {
      x.classList.add("hl");
      const other = x.dataset.a === id ? x.dataset.b : x.dataset.a;
      graph.querySelectorAll(`[data-gnode="${CSS.escape(other)}"]`).forEach(o => o.classList.add("hl"));
    }
  });
});
// the console's width: drag its left edge; the width is remembered in this browser
const WIDTH_KEY = "craftsman.review.console-width";
function applyWidth(width) { document.getElementById("app").style.gridTemplateColumns = width ? `240px minmax(0, 1fr) ${width}` : ""; }
applyWidth(localStorage.getItem(WIDTH_KEY));
document.addEventListener("mousedown", e => {
  if (e.target.id !== "grip") return;
  e.preventDefault();
  const grip = e.target; let width = null;
  grip.classList.add("dragging");
  const move = ev => { width = Math.min(Math.max(window.innerWidth - ev.clientX, 320), window.innerWidth - 560) + "px"; applyWidth(width); };
  const up = () => {
    document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up);
    grip.classList.remove("dragging"); if (width) localStorage.setItem(WIDTH_KEY, width);
  };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
});
document.addEventListener("keydown", e => {
  if (e.target.id === "say" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); reviewAction("say"); }
});
connect();
</script>
